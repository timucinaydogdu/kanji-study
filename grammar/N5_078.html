  t.textContent=open?'Göster ▼':'Gizle ▲';
}
function shuffle(a){return[...a].sort(()=>Math.random()-0.5);}
var tqs=[],ti=0,sc=0,log=[];
function initTest(){
  tqs=shuffle(POOL).slice(0,30);
  ti=0;sc=0;log=[];
  renderQ();
}
function renderQ(){
  var q=tqs[ti],tot=tqs.length;
  document.getElementById('prog').style.width=(ti/tot*100)+'%';
  document.getElementById('scoreDisplay').textContent=sc+' / '+tot;
  var opts=shuffle(q.opts);
  document.getElementById('tv').innerHTML=
    '<div class="tqlabel '+q.lc+'">'+q.lb+'</div>'+
    '<div class="tq" style="white-space:pre-line">'+q.q+'</div>'+
    '<div class="topts">'+
    opts.map(function(o,i){return '<button class="topt" onclick="doAns('+i+')">'+o+'</button>';}).join('')+
    '</div>'+
    '<div class="tfb" id="fb"></div>'+
    '<button class="tnext" id="nq" onclick="nextQ()">'+
    (ti===tot-1?'Sonuçları Gör →':'Sonraki →')+
    '</button>';
  window._opts=opts;
}
function doAns(i){
  var q=tqs[ti],sel=window._opts[i],ok=sel===q.ans;
  if(ok)sc++;
  log.push({q:q.q,ans:q.ans,sel:sel,ok:ok,lb:q.lb});
  document.querySelectorAll('.topt').forEach(function(b,j){
    b.disabled=true;
    if(j===i)b.classList.add(ok?'ok':'ng');
    if(window._opts[j]===q.ans&&!ok)b.classList.add('show');
  });
  var fb=document.getElementById('fb');
  fb.className='tfb '+(ok?'ok':'ng');
  fb.textContent=ok?'✅ Doğru!':'❌ Yanlış — Doğru: '+q.ans;
  document.getElementById('nq').style.display='block';
}
function nextQ(){ti++;if(ti>=tqs.length){showR();return;}renderQ();}
function showR(){
  var tot=tqs.length,pct=Math.round(sc/tot*100);
  var emoji=pct>=90?'🏆':pct>=70?'🎯':pct>=50?'📚':'💪';
  var lbl=pct>=90?'Mükemmel':pct>=70?'İyi':pct>=50?'Gelişiyor':'Devam Et';
  document.getElementById('tv').style.display='none';
  document.getElementById('prog').style.width='100%';
  document.getElementById('scoreDisplay').textContent=sc+' / '+tot;
  var typeMap={};
  log.forEach(function(l){if(!typeMap[l.lb])typeMap[l.lb]={ok:0,tot:0};typeMap[l.lb].tot++;if(l.ok)typeMap[l.lb].ok++;});
  var tsum=Object.keys(typeMap).map(function(lb){var v=typeMap[lb];return '<div class="tsrow"><span class="tslb">'+lb+'</span><span class="tspct">'+v.ok+'/'+v.tot+'</span></div>';}).join('');
  var rep=log.map(function(l,i){return '<div class="krow"><div class="knum">'+(i+1)+'</div><div class="kinfo"><div class="kqt">'+l.q+'</div>'+(l.ok?'<div class="kcorrect">✓ '+l.ans+'</div>':'<div class="kans">Verilen: <strong>'+l.sel+'</strong> → Doğru: <strong>'+l.ans+'</strong></div>')+'</div><span class="rs '+(l.ok?'rs-ok':'rs-bad')+'">'+(l.ok?'✓':'✗')+'</span></div>';}).join('');
  var rv=document.getElementById('rv');
  rv.style.display='block';
  rv.innerHTML='<div class="rwrap"><div class="remoji">'+emoji+'</div><div class="rscore">'+sc+' / '+tot+'</div><div class="rlabel">'+lbl+' · %'+pct+'</div><div class="rbdown"><div class="rbc"><div class="rbv rg">'+sc+'</div><div class="rbl">Doğru</div></div><div class="rbc"><div class="rbv rr">'+(tot-sc)+'</div><div class="rbl">Yanlış</div></div><div class="rbc"><div class="rbv rgr">'+tot+'</div><div class="rbl">Toplam</div></div></div><div class="slabel" style="text-align:left;margin-bottom:8px">Soru Tipi Bazında</div>'+tsum+'<button class="rbtn" onclick="restartTest()" style="margin-top:1.25rem">Tekrar Dene</button> <a href="../index.html" class="rbtn" style="display:inline-block;margin-top:8px;text-decoration:none">← Anasayfa</a></div><div class="krep"><div class="slabel" style="margin-bottom:12px">Soru Detayı</div>'+rep+'</div>';
}
function restartTest(){document.getElementById('tv').style.display='block';document.getElementById('rv').style.display='none';initTest();}
initTest();

</script>
</body>
</html>
