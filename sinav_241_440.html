  {n:256,ch:"屋",mn:"Dükkan / Bina / Satıcı",on:["OKU"],kun:["ya"],or:"OBI veya bronz formu yok; olası pre-Shuowen formlar mevcut. 'Eğilmiş ya da yere uzanmış kişi' ve kısaltılmış 'oda' ya da 'varmak/ulaşmak' unsurlarından oluşur. 'Uzanacak yer' anlamından bina ve dükkan",mm:"💀 BINAYA GELİNCE MÜŞTERİNİN CESEDINI BULURSUN",cp:[{k:"屋上",r:"OKUJŌ",m:"Çatı"},{k:"小屋",r:"koya",m:"Kulübe, baraka"},{k:"パン屋",r:"PANya",m:"Fırın"}],ex:[{s:"パン___でパンを買った。",tr:"Fırından ekmek satın aldım.",b:"屋",br:"ya"}]},
  {n:257,ch:"温",mn:"Sıcak / Ilık",on:["ON"],kun:["atatakai", "atatameru"],or:"OBI formları var. Geleneksel form mevcut. Mühür aşamasından itibaren 'su' ve fonetik unsur içerir. Mizukami banyo kapla birinin OBI formunu gösterir. Modern grafik su, güneş ve kase olarak hatırlanabi",mm:"☀️ GÜNEŞ KASEDEKI SUYU ISINTIYOR",cp:[{k:"温泉",r:"ONSEN",m:"Kaplıca"},{k:"温情",r:"ONJŌ",m:"Merhamet, şefkat"},{k:"温室",r:"ONSHITSU",m:"Sera"}],ex:[{s:"お___泉に入った。",tr:"Kaplıcaya girdim.",b:"温",br:"on"}]},
  {n:258,ch:"化",mn:"Değişmek / Büyülemek",on:["KA", "KE"],kun:["bakeru", "bakasu"],or:"Geleneksel 化. OBI formu 'kişi' (41, dik duran) ve 'yere düşen kişi'yi içerir — hal değişikliğini belirtir; fonetik unsur olarak da işlev görür. Tōdō 'şekil değiştirmek' kelime ailesine dahil eder.",mm:"🧟 DIKAN DURAN ADAM BÜYÜLENMIŞ VE DÜŞMÜŞ",cp:[{k:"変化",r:"HENKA",m:"Değişim"},{k:"化粧",r:"KESHŌ",m:"Makyaj"},{k:"化け物",r:"bakemono",m:"Hayalet, canavar"}],ex:[{s:"町が大きく変___した。",tr:"Şehir büyük değişime uğradı.",b:"化",br:"KA"}]},
  {n:259,ch:"荷",mn:"Yük / Ağırlık",on:["KA"],kun:["ni"],or:"Geç dönem karakter (Shuowen). 'Bitki, bitki örtüsü' ve 'ne?' (fonetik) unsurlarını içerir; özgün anlam lotus bitkisiydi. Sonradan 'sırtlamak, taşımak' anlamına geçildi.",mm:"🌿 O YÜKTE NE BİTKİLERİ VAR?",cp:[{k:"出荷",r:"SHUKKA",m:"Gönderim, sevkiyat"},{k:"船荷",r:"funani",m:"Gemi yükü"},{k:"荷物",r:"niMOTSU",m:"Bagaj, yük"}],ex:[{s:"重い___物を運んだ。",tr:"Ağır yük taşıdım.",b:"荷",br:"ni"}]},
  {n:260,ch:"界",mn:"Alan / Sınır",on:["KAI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Tarla' ve 'arasına girmek' (fonetik, 'bölmek' çağrışımlı) unsurlarından oluşur; özgün anlam tarlaları bölmek. Tōdō 'ikiye bölmek; aralık' kelime ailesine dahil eder.",mm:"🌾 TARILALARI SINIRLARLA ALANLARA BÖL",cp:[{k:"世界",r:"SEKAI",m:"Dünya"},{k:"境界",r:"KYŌKAI",m:"Sınır"},{k:"政界",r:"SEIKAI",m:"Siyaset dünyası"}],ex:[{s:"世___中を旅したい。",tr:"Dünyayı gezmek istiyorum.",b:"界",br:"KAI"}]},
  {n:261,ch:"開",mn:"Açmak",on:["KAI"],kun:["hiraku", "akeru"],or:"Görece geç dönem karakter (Shuowen). 'Kapı' ve iç unsur içerir; iç unsur i] 'karşı karşıya' (açık kapının iki kanadı) ya da ii] sürgüyü kaldıran iki el olarak yorumlanır.",mm:"🙌 ELLER SÜRGÜYÜ KALDIRIR VE KAPIYI AÇAR",cp:[{k:"開発",r:"KAIHATSU",m:"Geliştirme, kalkınma"},{k:"開始",r:"KAISHI",m:"Başlangıç"},{k:"開き綱",r:"hirakizuna",m:"Açma ipi"}],ex:[{s:"ドアを___けた。",tr:"Kapıyı açtım.",b:"開",br:"a"}]},
  {n:262,ch:"階",mn:"Kat / Basamak",on:["KAI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Yığılmış toprak, tepe' belirleyicisi ve 'hepsi, herkes' (fonetik, 'sıralanmak' çağrışımlı) unsurlarını içerir.",mm:"🏔️ BASAMAKLAR SIRALANIYOR — TÜM TEPELER",cp:[{k:"階段",r:"KAIDAN",m:"Merdivenler"},{k:"二階",r:"NIKAI",m:"İkinci kat"},{k:"階級",r:"KAIKYŪ",m:"Sınıf, derece"}],ex:[{s:"三___に部屋がある。",tr:"Üçüncü katta oda var.",b:"階",br:"KAI"}]},
  {n:263,ch:"寒",mn:"Soğuk",on:["KAN"],kun:["samui"],or:"Bronz form A: çatı/konut içinde toplanmış bitki örtüsü — soğuktan korunmak için (Shirakawa). Form B'de ek iki yatay çizgi var. Modern form kuyu, altı ve buz unsurlarıyla hatırlanabilir.",mm:"🧊 ALTI ÇATILI KUYU KIŞ AYAZINDA DONAR",cp:[{k:"寒波",r:"KANPA",m:"Soğuk hava dalgası"},{k:"寒気",r:"samuKE",m:"Titreme, üşüme hissi"},{k:"寒暖計",r:"KANDANKEI",m:"Termometre"}],ex:[{s:"冬は___い日が続く。",tr:"Kışın soğuk günler devam eder.",b:"寒",br:"samu"}]},
  {n:264,ch:"感",mn:"His / Duygu",on:["KAN"],kun:["kanjiru"],or:"Geç dönem karakter (Shuowen). 'Kalp' ve bir tür silah (fonetik, 'sarsmak' çağrışımlı) unsurlarını içerir; 'titreyen kalp' ve dolayısıyla 'his, duygu' anlamına ulaşır.",mm:"❤️ KALPSİLAH KARŞISINDA AĞIZDA HİSSEDİLİR",cp:[{k:"感心",r:"KANSHIN",m:"Takdir, hayranlık"},{k:"感覚",r:"KANKAKU",m:"Duygu, his"},{k:"感情",r:"KANJŌ",m:"Duygular, hisler"}],ex:[{s:"映画を見て___動した。",tr:"Filmi izleyerek duygulandım.",b:"感",br:"KAN"}]},
  {n:265,ch:"漢",mn:"Han Çinliler / Erkek",on:["KAN"],kun:[],or:"Etimolojik açıdan en belirsiz karakterlerden biri. Bronz form. 'Su' ve fonetik unsur (ilişkili anlam belirsiz) içerir. Başlangıçta Han Nehri'ni ifade ediyordu; Han Hanedanı adıyla birlikte 'Han Çinlil",mm:"💪 HAN NEHRİ'NİN AĞZINDAN OTLU HAN ÇİN'DEN ADAM",cp:[{k:"漢字",r:"KANJI",m:"Kanji karakteri"},{k:"悪漢",r:"AKKAN",m:"Kötü adam, katil"},{k:"漢詩",r:"KANSHI",m:"Çin şiiri"}],ex:[{s:"___字を勉強している。",tr:"Kanji çalışıyorum.",b:"漢",br:"KAN"}]},
  {n:266,ch:"館",mn:"Büyük Bina / Salon",on:["KAN"],kun:[],or:"Geç dönem karakter (Shuowen). 'Yemek/yemek yemek' ve 'yetkili' (fonetik, 'içinde çalışılacak bina' çağrışımlı) unsurlarını içerir. Shirakawa onu ordunun hareket halindeyken kullandığı törensel bina ol",mm:"🍽️ YETKİLİ SALONDA YİYOR",cp:[{k:"開館",r:"KAIKAN",m:"Salon, toplanma yeri"},{k:"旅館",r:"RYOKAN",m:"Japon oteli"},{k:"美術館",r:"BIJUTSUKAN",m:"Sanat galerisi"}],ex:[{s:"図書___で本を読んだ。",tr:"Kütüphanede kitap okudum.",b:"館",br:"KAN"}]},
  {n:267,ch:"岸",mn:"Kıyı / Bank",on:["GAN"],kun:["kishi"],or:"Geç dönem karakter (Shuowen). 'Dağ' ve alt kısım fonetik unsur (kaya yüksekte, kıyıya yakın' çağrışımlı) içerir. Genişletilmiş anlam suya yakın yüksek arazi ve kıyı.",mm:"🏔️ DAĞA BENZER BANKA KURUDUR",cp:[{k:"海岸",r:"KAIGAN",m:"Kıyı, sahil"},{k:"対岸",r:"TAIGAN",m:"Karşı kıyı"},{k:"川岸",r:"kawagishi",m:"Nehir kıyısı"}],ex:[{s:"川___に立って川を眺めた。",tr:"Nehir kıyısında durarak nehri seyrettim.",b:"岸",br:"kishi"}]},
  {n:268,ch:"起",mn:"Kalkmak / Neden olmak",on:["KI"],kun:["okiru", "okosu", "okoru"],or:"Görece geç dönem karakter (Shuowen). 'Koşmak' (hareket gösterir) ve fonetik unsur (başlamak ya da bükülmüş kişi) içerir. 'Neden olmak' genişletilmiş anlamdır.",mm:"🌀 BÜKÜK BİR ŞEKİLDE KOŞMAK SONUÇLARA YOL AÇAR",cp:[{k:"起源",r:"KIGEN",m:"Köken, başlangıç"},{k:"早起き",r:"hayaoki",m:"Erken kalkma"},{k:"起動機",r:"KIDŌKI",m:"Marş motoru"}],ex:[{s:"毎朝六時に___きる。",tr:"Her sabah altıda kalkarım.",b:"起",br:"o"}]},
  {n:269,ch:"期",mn:"Dönem / Beklemek",on:["KI", "GO"],kun:[],or:"Bronz formlar 'dönmek' fonetik unsuru ve 'güneş' ya da 'ay' belirleyicisini içerir. Güneşin bir döngüsü (bir yıl) ya da ayın bir döngüsü (ay); dolayısıyla genel olarak 'dönem'. 'Beklemek' düzenliliğe ",mm:"📅 VİNYÜR BİÇMELER ARASINDA DÖNEM BEKLENİR",cp:[{k:"学期",r:"GAKKI",m:"Okul dönemi"},{k:"期待",r:"KITAI",m:"Beklenti, umut"},{k:"最後",r:"SAIGO",m:"Son, ölüm"}],ex:[{s:"夏休みの___間が楽しみだ。",tr:"Yaz tatili dönemini bekliyorum.",b:"期",br:"KI"}]},
  {n:270,ch:"客",mn:"Misafir / Ziyaretçi",on:["KYAKU", "KAKU"],kun:[],or:"OBI ve bronz formlar var. OBI'de çatı, 'durmak/kalmak', diz çökmüş kişi ve 'ağız' fonetik unsurlarını içerir. Bronz formda 'çatı', 'kişi' ve 'her biri' (fonetik, 'gelmek, durmak') bulunur.",mm:"🤐 HER ZİYARETÇİ ÇATI ALTINDA AĞZI AÇIK DİZ ÇÖKER",cp:[{k:"来客",r:"RAIKYAKU",m:"Ziyaretçi, müşteri"},{k:"乗客",r:"JŌKYAKU",m:"Yolcu"},{k:"客員",r:"KAKUIN",m:"Misafir üye"}],ex:[{s:"お___様をお迎えした。",tr:"Misafiri karşıladım.",b:"客",br:"KYAKU"}]},
  {n:271,ch:"究",mn:"Araştırmak / Aşırı",on:["KYŪ"],kun:["kiwameru"],or:"Geç dönem karakter (Shuowen). 'Mağara (konut), delik' ve 'dokuz' (fonetik, 'eğilmek' çağrışımlı) unsurlarını içerir; 'dar mağara konutu' ve dolayısıyla 'zorlukta olmak, aşırıya gitmek' anlamına ulaşır",mm:"🕳️ DOKUZ DELİKTE AŞIRI ARAŞTIRMA",cp:[{k:"研究",r:"KENKYŪ",m:"Araştırma"},{k:"究明",r:"KYŪMEI",m:"Soruşturma"},{k:"探究",r:"TANKYŪ",m:"İnceleme, araştırma"}],ex:[{s:"研___所で働いている。",tr:"Araştırma merkezinde çalışıyorum.",b:"究",br:"KYŪ"}]},
  {n:272,ch:"急",mn:"Acele etmek / Ani",on:["KYŪ"],kun:["isogu"],or:"Geç dönem karakter. Mühür formu (Shuowen) 'kalp/duygular' ve arkasından koşan elin üst kısmını tasvir eder. Üst kısım fonetik unsurdur. 'Ani' genişletilmiş anlamdır.",mm:"🫀 ACELE EDEN KİŞİ ANİDEN ELINI KALBİNE GÖTÜRÜR",cp:[{k:"急死",r:"KYŪSHI",m:"Ani ölüm"},{k:"急速",r:"KYŪSOKU",m:"Hız, sürat"},{k:"大急ぎ",r:"ōisogi",m:"Büyük aceleyle"}],ex:[{s:"___いで駅へ走った。",tr:"Aceleyle istasyona koştum.",b:"急",br:"iso"}]},
  {n:273,ch:"級",mn:"Rütbe / Sınıf",on:["KYŪ"],kun:[],or:"Genel olarak geç dönem karakter; Yamada bronz formu listeler. 'İplik' ve fonetik unsur (uzanmak/genişlemek, 'sıradaki' çağrışımlı) içerir. 'Sıra' genişletilmiş anlamdır.",mm:"🧵 İPLİKLERE UZANARAK SINIFLANDIR",cp:[{k:"進級",r:"SHINKYŪ",m:"Terfi, sınıf atlamak"},{k:"同級生",r:"DŌKYŪSEI",m:"Sınıf arkadaşı"},{k:"上級",r:"JŌKYŪ",m:"Üst sınıf"}],ex:[{s:"上___生に質問した。",tr:"Üst sınıf öğrencisine soru sordum.",b:"級",br:"KYŪ"}]},
  {n:274,ch:"宮",mn:"Saray / Tapınak",on:["KYŪ", "GŪ", "KU"],kun:["miya"],or:"OBI formu çatı altındaki odaları gösterir; büyük bir ev veya bina anlamına gelir. Saraylar ve tapınaklarla ilişkilendirildi ve onların başlıca sakinleriyle.",mm:"🏯 ÇATI ALTINDA ÇOK ODA SARAY YA DA TAPINAK GÖSTERİR",cp:[{k:"神宮",r:"JINGŪ",m:"Şinto tapınağı"},{k:"宮中",r:"KYŪCHŪ",m:"Saray mahkemesi"},{k:"宮様",r:"miyasama",m:"Prens (saygılı)"}],ex:[{s:"___殿の庭を歩いた。",tr:"Saray bahçesinde yürüdüm.",b:"宮",br:"KYUU"}]},
  {n:276,ch:"去",mn:"Gitmek / Geçmiş",on:["KYO", "KO"],kun:["saru"],or:"OBI formu büyük olasılıkla pirinç için çift kapakçıklı kap piktogramına dayanır; bambu ya da benzeri esnek bitkiden yapılma. Yamada ayrılmak anlamını pilav tenceresinden pirinç almaya bağlar.",mm:"👃 TOPRAĞIN ALTINDA BURUN — GITTIN, GÖMÜLDÜN!",cp:[{k:"去年",r:"KYONEN",m:"Geçen yıl"},{k:"過去",r:"KAKO",m:"Geçmiş"},{k:"立ち去る",r:"tachisaru",m:"Ayrılmak, uzaklaşmak"}],ex:[{s:"___年の夏は暑かった。",tr:"Geçen yaz sıcaktı.",b:"去",br:"KYO"}]},
  {n:277,ch:"橋",mn:"Köprü",on:["KYŌ"],kun:["hashi"],or:"Geç dönem karakter (Shuowen). 'Ağaç, ahşap' ve 'uzun, yüksek' (fonetik, 'yüksek' çağrışımlı) unsurlarını içerir. 'Köprü' uzanmış anlam ya da fonetik ödünç kullanımdır.",mm:"🌉 DÜZENSİZ TEPELI UZUN AHŞAP YAPI KÖPRÜDÜR",cp:[{k:"鉄橋",r:"TEKKYŌ",m:"Çelik köprü"},{k:"陸橋",r:"RIKKYŌ",m:"Üst geçit"},{k:"石橋",r:"ishibashi",m:"Taş köprü"}],ex:[{s:"川に___が架かっている。",tr:"Nehir üzerinde köprü var.",b:"橋",br:"hashi"}]},
  {n:278,ch:"業",mn:"Meslek / Eylem / Karma",on:["GYŌ", "GŌ"],kun:["waza"],or:"Bronz form çentikli tahtadan asılı zilleri olan müzik aletini temsil eder. 'Öğrenmek, çalışmak' anlamı düz bir yüzey üzerinde öğrenmeyi simgeleyen levha ya da tabletten türedi. 'Karma' genişletilmiş a",mm:"🐑 TAHTA KOYUNLARDAN ODD SIRALARI YAPMAK TUHAF BİR MESLEKTİR",cp:[{k:"産業",r:"SANGYŌ",m:"Sanayi, endüstri"},{k:"罪業",r:"ZAIGŌ",m:"Günah, kötülük"},{k:"仕業",r:"shiwaza",m:"Eylem, iş"}],ex:[{s:"卒___式に参加した。",tr:"Mezuniyet törenine katıldım.",b:"業",br:"GYŌ"}]},
  {n:279,ch:"曲",mn:"Eğmek / Melodi",on:["KYOKU"],kun:["mageru", "magaru"],or:"Bronz formu ahşap ya da bambudan yapılmış eğri kap piktogramıdır. 'Eğri' anlamından 'bükülmek' türedi. 'Melodi' genişletilmiş anlam, muhtemelen bükümlülükten.",mm:"🌾 TARLALARIN ÖTESINDE KIYISI BÜKÜLEN YOLLAR",cp:[{k:"曲線",r:"KYOKUSEN",m:"Eğri"},{k:"作曲",r:"SAKKYOKU",m:"Beste yapma"},{k:"曲がり目",r:"magarime",m:"Dönüş noktası"}],ex:[{s:"好きな___を聴いた。",tr:"Sevdiğim parçayı dinledim.",b:"曲",br:"KYOKU"}]},
  {n:280,ch:"局",mn:"Büro / Bölüm / Durum",on:["KYOKU"],kun:[],or:"Geç dönem karakter (Shuowen). Genellikle 'eğilmiş ya da yere uzanmış kişi' ve 'cümle' (fonetik, 'eğilmiş, kambur' ya da 'bölmek' çağrışımlı) unsurlarından oluştuğu kabul edilir.",mm:"💀 BÜRO CESDİ HAKKINDA TUHAF CÜMLE",cp:[{k:"局面",r:"KYOKUMEN",m:"Durum, sahne"},{k:"結局",r:"KEKKYOKU",m:"Sonunda, nihayetinde"},{k:"郵便局",r:"YŪBINKYOKU",m:"Posta ofisi"}],ex:[{s:"郵便___で手紙を出した。",tr:"Postaneden mektup gönderdim.",b:"局",br:"KYOKU"}]},
  {n:281,ch:"銀",mn:"Gümüş",on:["GIN"],kun:["shirogane"],or:"Geç dönem karakter (Shuowen). 'Metal' belirleyicisi ve 'durdurmak, öfkeyle geri bakmak, karşı çıkmak' (fonetik, 'beyaz' çağrışımlı) unsurlarını içerir. 628 (iyi) karakteriyle karıştırılmamalı.",mm:"🥈 GÜMÜŞ METALE DURAKSAYIP BAK",cp:[{k:"銀行",r:"GINKŌ",m:"Banka"},{k:"銀河",r:"GINGA",m:"Samanyolu"},{k:"銀貨",r:"GINKA",m:"Gümüş para"}],ex:[{s:"___行でお金をおろした。",tr:"Bankadan para çektim.",b:"銀",br:"GIN"}]},
  {n:282,ch:"区",mn:"Semt / Bölüm",on:["KU"],kun:[],or:"OBI, bronz ve geleneksel form. OBI formu 'koltukaltı' olarak yorumlanır. Fonetik unsur 'eğilmiş, kambur' ya da 'bölmek' anlamı taşır. 'Semt, bölüm' genişletilmiş ya da ödünç anlamlardır.",mm:"📦 BÖLÜM X BÜYÜK ÖLÇÜDE KAPALI BİR SEMTTIR",cp:[{k:"区別",r:"KUBETSU",m:"Ayrım"},{k:"地区",r:"CHIKU",m:"Bölge, semt"},{k:"北区",r:"kitaKU",m:"Kita Semti"}],ex:[{s:"渋谷___に住んでいる。",tr:"Shibuya bölgesinde yaşıyorum.",b:"区",br:"KU"}]},
  {n:283,ch:"苦",mn:"Acı / Acı vermek",on:["KU"],kun:["nigai", "kurushii", "kurushimu"],or:"Geç dönem karakter (Shuowen). 'Bitki/çimen' ve 'eski' (fonetik, 'sıkmak' ya da 'güçlü uyarı hissetmek' çağrışımlı) unsurlarından oluşur; anlam 'acı, nahoş'a genişledi.",mm:"🌿 ESKİ BİTKİLER ACILIDIR, HATTA ADETA ACITIR",cp:[{k:"苦心",r:"KUSHIN",m:"Çile, zahmet"},{k:"苦痛",r:"KUTSŪ",m:"Acı, sancı"},{k:"苦味",r:"nigami",m:"Acı tat"}],ex:[{s:"この薬は___い。",tr:"Bu ilaç acıdır.",b:"苦",br:"niga"}]},
  {n:284,ch:"具",mn:"Donatmak / Araç",on:["GU"],kun:["sonaeru"],or:"OBI formu üç ayaklı kazan ya da kabuk para biriminin kısaltması olarak yorumlanır; iki el hem anlamsal hem fonetik işlev görür. Genişletilmiş anlamlar araç gereç ve vasıtalardır.",mm:"👁️ MASANIN ÜZERİNE GÖZ KOY — FAYDALI BİR ARAÇ",cp:[{k:"具合",r:"GUai",m:"Durum, hal"},{k:"用具",r:"YŌGU",m:"Alet, donatım"},{k:"道具",r:"DŌGU",m:"Alet, araç"}],ex:[{s:"道___を使って修理した。",tr:"Alet kullanarak tamir ettim.",b:"具",br:"GU"}]},
  {n:285,ch:"君",mn:"Lord / Sen / Bay",on:["KUN"],kun:["kimi"],or:"OBI formu 'kelimeler' (22, ağız/konuşmak) ve 'sopayı elde tutarak yönetmek' unsurlarından oluşur; hem anlamsal hem fonetik işlev görür. 'Sözle insanlara önderlik etmek' anlamından 'önder, lider' çıkar",mm:"🪄 EFENDIM, ELİNDE SOPA VE SÖZ İLE YÖNETTİĞİNİ GÖRÜYORUM",cp:[{k:"暴君",r:"BŌKUN",m:"Tiran, zorba"},{k:"細君",r:"SAIKUN",m:"Eş (resmi, eski)"},{k:"山田君",r:"YamadaKUN",m:"Bay Yamada"}],ex:[{s:"___は何が好きですか？",tr:"Sen neyi seversin?",b:"君",br:"kimi"}]},
  {n:286,ch:"係",mn:"İlgi / Bağ",on:["KEI"],kun:["kakari"],or:"Geç dönem karakter (Shuowen). 'Kişi' ve 'birleşik iplikler' (fonetik, 'bağlamak' çağrışımlı) unsurlarını içerir.",mm:"🧵 BİRLEŞTİRİLMİŞ İPLİKLERLE UĞRAŞAN KİŞİ",cp:[{k:"関係",r:"KANKEI",m:"İlişki, bağlantı"},{k:"係争",r:"KEISŌ",m:"Anlaşmazlık, dava"},{k:"係員",r:"kakariIN",m:"Sorumlu görevli"}],ex:[{s:"担当___に連絡した。",tr:"İlgili yetkiliye ulaştım.",b:"係",br:"KAKARI"}]},
  {n:287,ch:"軽",mn:"Hafif / Hafifmeşrep",on:["KEI"],kun:["karui"],or:"Geç dönem karakter (Shuowen). Geleneksel form. 'Araç, araba' ve tezgahta gerilmiş iplikler (fonetik, 'boş' çağrışımlı) unsurlarını içerir. Hafif anlamı 'boş'tan genişledi.",mm:"🚗 HAFİF ARAÇ ELLE YER BOYUNCA İTİLİYOR",cp:[{k:"軽食",r:"KEISHOKU",m:"Hafif yemek"},{k:"軽薄",r:"KEIHAKU",m:"Hafifmeşreplik"},{k:"軽石",r:"karuishi",m:"Pomza taşı"}],ex:[{s:"この荷物は___い。",tr:"Bu yük hafiftir.",b:"軽",br:"karu"}]},
  {n:288,ch:"血",mn:"Kan",on:["KETSU"],kun:["chi"],or:"OBI formu adak töreninde kaseye konulan kanı gösterir. Anlam sonradan yalnızca 'kan'a daraldı.",mm:"🩸 KASEDEN TAŞAN SIVI KANDUR",cp:[{k:"血液",r:"KETSUEKI",m:"Kan"},{k:"血統",r:"KETTŌ",m:"Soy, kan bağı"},{k:"鼻血",r:"hanaji",m:"Burun kanaması"}],ex:[{s:"転んで___が出た。",tr:"Düşüp kanım çıktı.",b:"血",br:"chi"}]},
  {n:289,ch:"決",mn:"Karar vermek / Çökmek",on:["KETSU"],kun:["kimeru", "kimaru"],or:"Geç dönem karakter (Shuowen). 'Su' ve fonetik unsur (set çöküşü gibi anlamlar çağrışımlı) içerir. 'Karar vermek' ödünç anlamdır. Çökmek hala küçük bir anlam olarak varlığını sürdürür.",mm:"🎒 ADAM SUDOLU SIRTÇANTAYLA GITMEYE KARAR VERİYOR",cp:[{k:"解決",r:"KAIKETSU",m:"Çözüm"},{k:"決裂",r:"KETSURETU",m:"Kopuş, çöküş"},{k:"決心",r:"KESSHIN",m:"Kararlılık"}],ex:[{s:"明日の予定を___めた。",tr:"Yarının programını belirledim.",b:"決",br:"ki"}]},
  {n:290,ch:"研",mn:"Bileme / İncelemek",on:["KEN"],kun:["togu"],or:"Geç dönem karakter (Shuowen). 'Taş' ve 'düz, seviyeli' (fonetik, 'düzleştirmek' çağrışımlı) unsurlarını içerir. 'İncelemek' temel anlam 'pürüzsüzleştirme'nin genişlemesidir.",mm:"🪨 TAŞI İKİ TUHAF SOPAYLA BİLE",cp:[{k:"研修",r:"KENSHŪ",m:"Eğitim, staj"},{k:"研ぎ側",r:"togikawa",m:"Bilemek için kayış"},{k:"研究者",r:"KENKYŪSHA",m:"Araştırmacı"}],ex:[{s:"___究の結果を発表した。",tr:"Araştırma sonucunu sundum.",b:"研",br:"KEN"}]},
  {n:291,ch:"県",mn:"İl / Prefektörlük",on:["KEN"],kun:[],or:"Bronz form ağaçta ters asılı kesilmiş başı gösterir — bir ceza sahnesi. Geleneksel form 'birleşik iplikler' (fonetik, 'asmak' çağrışımlı) içerir. Çince'de benzer sesli kelime 'ilçe, nahiye'; Japonca'd",mm:"👁️ İL GÖSTERİSİNDE SEHPAYA GÖZ KULAK OL",cp:[{k:"三重県",r:"MieKEN",m:"Mie İli"},{k:"県令",r:"KENREI",m:"İl yönetmeliği"},{k:"県庁",r:"KENCHŌ",m:"İl müdürlüğü"}],ex:[{s:"神奈川___に住んでいる。",tr:"Kanagawa ilinde yaşıyorum.",b:"県",br:"KEN"}]},
  {n:292,ch:"庫",mn:"Ambar / Depo",on:["KO"],kun:[],or:"Bronz form. 'Bina' ve 'araç, araba' (hem anlamsal hem fonetik) unsurlarını içerir. Özgün anlam arabaları barındıran bina; sonradan genel anlam kazandı.",mm:"🚗 DEPODA BIRAKILAN ARAÇ",cp:[{k:"車庫",r:"SHAKO",m:"Garaj, araç deposu"},{k:"倉庫",r:"SŌKO",m:"Depo, ambar"},{k:"冷蔵庫",r:"REIZŌKO",m:"Buzdolabı"}],ex:[{s:"冷蔵___に食べ物を入れた。",tr:"Buzdolabına yiyecek koydum.",b:"庫",br:"KO"}]},
  {n:293,ch:"湖",mn:"Göl",on:["KO"],kun:["mizuumi"],or:"Bronz formdaki basit şekle dayanır. 'Su' ve fonetik unsur (büyük çağrışımlı) içerir. Modern form su, ay ve eski unsurlarıyla hatırlanabilir.",mm:"🌙 GÖLÜN SUYUNDA ESKİ AY GÖRÜNÜYOR",cp:[{k:"琵琶湖",r:"BIWAKO",m:"Biwa Gölü"},{k:"湖岸",r:"KOGAN",m:"Göl kıyısı"},{k:"湖水",r:"KOSUI",m:"Göl suyu"}],ex:[{s:"___のほとりを散歩した。",tr:"Göl kıyısında yürüyüş yaptım.",b:"湖",br:"mizuumi"}]},
  {n:294,ch:"向",mn:"Yönelmek / Yüzleşmek",on:["KŌ"],kun:["muku", "mukeru", "mukō"],or:"OBI formu görünüşe göre kuzeye bakan pencereli bir evi gösterir. Mizukami, Ma ve Yamada yüzleşmek ve yön anlamlarını sonraki anlamlar olarak görür.",mm:"🪟 YÜKSEK PENCERELİ EVE DÖN",cp:[{k:"向上",r:"KŌJŌ",m:"Gelişme, ilerleme"},{k:"向こう側",r:"mukōgawa",m:"Karşı taraf"},{k:"前向き",r:"maemuki",m:"İleriye dönük, iyimser"}],ex:[{s:"駅に___かって歩いた。",tr:"İstasyona doğru yürüdüm.",b:"向",br:"mu"}]},
  {n:295,ch:"幸",mn:"Mutluluk / Şans",on:["KŌ"],kun:["saiwai", "sachi", "shiawase"],or:"Mühür formu. Geç dönem karakter (Shuowen). Baş eğik figür (güzel, narin; ancak felaketi temsil etmek için ödünç alındı) ve 'tersine çevrilmiş' unsurlarından oluşur. Tüm birlikte 'iyi talih' anlamı ver",mm:"⚔️ EKSTRİ KESKİN VURUŞ MUTLULUK VE ŞANS GETİRİR",cp:[{k:"幸運",r:"KŌUN",m:"İyi şans"},{k:"不幸",r:"FUKŌ",m:"Mutsuzluk, talihsizlik"},{k:"幸いに",r:"saiwai ni",m:"Neyse ki"}],ex:[{s:"今日は___運な日だ。",tr:"Bugün şanslı bir gün.",b:"幸",br:"KŌ"}]},
  {n:296,ch:"港",mn:"Liman",on:["KŌ"],kun:["minato"],or:"Geç dönem karakter (Shuowen). 'Su' ve 'yerleşim caddesi' (hem anlamsal hem fonetik, 'yol, güzergah' çağrışımlı) unsurlarını içerir; tekne yolu ve dolayısıyla liman anlamına gelir.",mm:"⚓ SUDA BİR ARADA BULURSUN KENDİNİ — LİMAN",cp:[{k:"空港",r:"KŪKŌ",m:"Havalimanı"},{k:"入港",r:"NYŪKŌ",m:"Limana giriş"},{k:"港町",r:"minatomachi",m:"Liman kasabası"}],ex:[{s:"___から船が出発した。",tr:"Limandan gemi kalktı.",b:"港",br:"minato"}]},
  {n:297,ch:"号",mn:"Numara / Çağırmak / İşaret",on:["GŌ"],kun:[],or:"Geç dönem karakter (Shuowen). Geleneksel form kaplan içerir. Çeşitli analizler sesi 'uluyan kaplan' gibi howl çağrışımlı olarak yorumlar. Kısaltılmış modern form daha genel anlamlıdır; 'ad, numara' öd",mm:"📢 YÜKSELEN YÜKSEk SES BİR NUMARA ÇAĞIRIYOR",cp:[{k:"番号",r:"BANGŌ",m:"Numara"},{k:"号令",r:"GŌREI",m:"Komut, emir"},{k:"号泣",r:"GŌKYŪ",m:"Hıçkıra hıçkıra ağlamak"}],ex:[{s:"部屋___を確認した。",tr:"Oda numarasını kontrol ettim.",b:"号",br:"GŌ"}]},
  {n:298,ch:"根",mn:"Kök / Temel",on:["KON"],kun:["ne"],or:"Geç dönem karakter (Shuowen). 'Ağaç, ahşap' ve 'durup bakmak' (fonetik, 'kök, gövde' çağrışımlı) unsurlarını içerir. Tōdō 'hareketsiz kalmak' kelime ailesine dahil eder.",mm:"🌳 AĞAÇ KÖKÜNÜ DURARAK SEYRET",cp:[{k:"根本",r:"KONPON",m:"Temel, kök"},{k:"大根",r:"DAIKON",m:"Dev turp"},{k:"屋根",r:"yane",m:"Çatı"}],ex:[{s:"木の___が地面に広がる。",tr:"Ağacın kökleri yere yayılıyor.",b:"根",br:"ne"}]},
  {n:299,ch:"祭",mn:"Festival / İbadet",on:["SAI"],kun:["matsuri", "matsuru"],or:"OBI ve bronz formlar et ve şarabın bir sunak üzerine elle yerleştirilmesini tasvir eder. Kullanım 'tanrıları çağırmak için törenler'e genişledi.",mm:"🍖 EL ETİ FESTIYAL İBADETINDE SUNAĞA KOYAR",cp:[{k:"祭日",r:"SAIJITSU",m:"Tatil, bayram"},{k:"祭壇",r:"SAIDAN",m:"Sunak"},{k:"雪まつり",r:"yukimatsuri",m:"Kar Festivali"}],ex:[{s:"夏___りに浴衣を着た。",tr:"Yaz festivalinde yukata giydim.",b:"祭",br:"matsuri"}]},
  {n:300,ch:"皿",mn:"Tabak / Kase",on:[],kun:["sara"],or:"OBI formları yüksek tabanlı derin eğri kaseyi gösterir. Sonraki formlar metal işlemeli daha ayrıntılı versiyonları gösterir.",mm:"🍽️ DİKEY ÇİZGİLİ TABAK",cp:[{k:"灰皿",r:"haizara",m:"Küllük"},{k:"大皿",r:"ōzara",m:"Büyük tabak"},{k:"皿洗い",r:"saraarai",m:"Bulaşık yıkama"}],ex:[{s:"___に料理を盛り付けた。",tr:"Tabağa yemek koydum.",b:"皿",br:"sara"}]},
  {n:301,ch:"仕",mn:"Hizmet etmek / Çalışmak",on:["SHI", "JI"],kun:["tsukaeru"],or:"Bronz form ve sonrası. 'Kişi' ve 'erkek/samuray' (fonetik, 'çalışmak, hizmet etmek' ya da 'durmak' çağrışımlı) unsurlarını içerir. Antik Çin'de çalışma genellikle köle ya da uşak tarafından yapılırdı.",mm:"⚔️ SAMURAY ÇALIŞAN VE HİZMET EDEN KİŞİDİR",cp:[{k:"仕事",r:"SHIGOTO",m:"İş, çalışma"},{k:"仕方",r:"SHIkata",m:"Yol, yöntem"},{k:"仕組み",r:"SHIkumi",m:"Düzenleme, yapı"}],ex:[{s:"新しい___事を始めた。",tr:"Yeni bir işe başladım.",b:"仕",br:"shi"}]},
  {n:302,ch:"死",mn:"Ölmek / Ölüm",on:["SHI"],kun:["shinu"],or:"OBI ve mühür formlar var. OBI'nin sol kısmı iskelet kalıntılarını gösterir; sağ kısım fonetik işlevli 'kişi'dir. Modern form 'etsiz kemikler' ve 'yere düşen kişi' unsurlarından oluşur.",mm:"🦴 KİŞİ ÖLÜR, YAKINDA KEMIKLER KALIR",cp:[{k:"死体",r:"SHITAI",m:"Ceset"},{k:"死去",r:"SHIKYŌ",m:"Ölüm"},{k:"若死に",r:"wakajini",m:"Genç yaşta ölüm"}],ex:[{s:"その植物は水不足で___んだ。",tr:"O bitki su yetersizliğinden öldü.",b:"死",br:"shi"}]},
  {n:304,ch:"始",mn:"Başlamak",on:["SHI"],kun:["hajimeru", "hajimaru"],or:"Bronz formlar 'kadın' ve ilk kız çocuğu çağrışımlı fonetik unsur içerir; daha genel 'ilk' anlamına gelişti. Modern formda burun ve ağız hafıza aracı olarak kullanılabilir.",mm:"👄 KADININ YÜZÜ BURUN VE AĞIZLA BAŞLAR",cp:[{k:"始終",r:"SHIJŪ",m:"Her zaman, başından beri"},{k:"始動機",r:"SHIDŌKI",m:"Marş motoru"},{k:"初めて",r:"hajimete",m:"İlk kez"}],ex:[{s:"授業が九時に___まる。",tr:"Ders dokuzda başlar.",b:"始",br:"haji"}]},
  {n:305,ch:"指",mn:"Parmak / İşaret etmek",on:["SHI"],kun:["yubi", "sasu"],or:"Geç dönem karakter (Shuowen). 'El' ve fonetik unsur (parmaklar arasına bölünmek ya da göstermek çağrışımlı) içerir.",mm:"☀️ KİŞİ OTURUR VE PARMAGIYLA GÜNEŞE İŞARET EDER",cp:[{k:"指示",r:"SHIJI",m:"Talimat, gösterge"},{k:"親指",r:"oyayubi",m:"Başparmak"},{k:"指図",r:"sashiZU",m:"Talimat, yön"}],ex:[{s:"地図で場所を___した。",tr:"Haritada yeri işaret ettim.",b:"指",br:"yubi"}]},
  {n:306,ch:"歯",mn:"Diş / Dişler",on:["SHI"],kun:["ha"],or:"Geleneksel form. OBI formu dişleri gösteren ağzı tasvir eder. Bronz formda fonetik 'dur' (hizalanmış ya da sabit) üst bileşen olarak eklendi.",mm:"🍚 DİŞLER PİRİNCİN AĞIZDA DURMАСINI SAĞLAR",cp:[{k:"歯根",r:"SHIKON",m:"Diş kökü"},{k:"歯医者",r:"haISHA",m:"Diş hekimi"},{k:"歯車",r:"haguruma",m:"Dişli çark"}],ex:[{s:"毎食後に___を磨く。",tr:"Her yemekten sonra dişlerimi fırçalarım.",b:"歯",br:"ha"}]},
  {n:307,ch:"詩",mn:"Şiir",on:["SHI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Kelimeler' ve 'tapınak' (fonetik, 'ilerlemek' ya da 'düşünce, irade' çağrışımlı) unsurlarını içerir.",mm:"📖 TAPINAKTAKI SÖZLER ŞİİRSELDİR",cp:[{k:"詩人",r:"SHIJIN",m:"Şair"},{k:"詩的",r:"SHITEKI",m:"Şiirsel"},{k:"詩情",r:"SHIJŌ",m:"Şiirsel duygu"}],ex:[{s:"美しい___を書いた。",tr:"Güzel bir şiir yazdım.",b:"詩",br:"SHI"}]},
  {n:308,ch:"次",mn:"Sıradaki / Takip etmek",on:["JI", "SHI"],kun:["tsugi", "tsugu"],or:"OBI formu temelde 'ağzını açmak, esnemek' unsurunu içerir. İki çizgili fonetik unsur 'durmak' ya da 'düzenlemek' çağrışımlıdır. Katō esneyen kişinin nöbet beklediğini düşünür.",mm:"🧊 BUZDA ESNEYEREK! SIRAYI BEKLEYEN NE GELECEK?",cp:[{k:"三次",r:"SANJI",m:"Üçüncü (derece)"},{k:"次第に",r:"SHIDAI ni",m:"Giderek, yavaş yavaş"},{k:"相次いで",r:"aitsuide",m:"Art arda, peş peşe"}],ex:[{s:"___の電車は何時ですか？",tr:"Sonraki tren kaçta?",b:"次",br:"tsugi"}]},
  {n:309,ch:"事",mn:"Şey / Mesele / Eylem",on:["JI", "ZU"],kun:["koto"],or:"OBI ve bronz formlar var. Erken formlar 303 ve diğer karakterlerle aynıdır; mühür aşamasında şekil bakımından farklılaştı. Genel yorum: bayrak ve işaret taşıyan el; Katō ilan anlamını vurgular.",mm:"✋ ELİNDE ON KUTU TUTAN EL AKILDA KALAN BİR ŞEYDİR",cp:[{k:"大事",r:"DAIJI",m:"Önem"},{k:"好事家",r:"KŌZUKA",m:"Meraklı kişi"},{k:"出来事",r:"dekigoto",m:"Olay, hadise"}],ex:[{s:"大切な___を話した。",tr:"Önemli bir şey konuştum.",b:"事",br:"koto"}]},
  {n:310,ch:"持",mn:"Tutmak / Sahip olmak",on:["JI"],kun:["motsu"],or:"Bronz ve mühür formlar. 'El' ve 'tapınak' (fonetik, 'yönetmek' ya da 'kullanmak' çağrışımlı) unsurlarını içerir; 'ellerini kullanmak' ve dolayısıyla 'ele almak, tutmak' anlamına gelir.",mm:"🙏 TAPINAKTA ELLERİ TUT",cp:[{k:"持久",r:"JIKYŪ",m:"Dayanıklılık"},{k:"持ち主",r:"mochinushi",m:"Sahip, mal sahibi"},{k:"長持ち",r:"nagamochi",m:"Dayanıklılık"}],ex:[{s:"重い荷物を___った。",tr:"Ağır yük taşıdım.",b:"持",br:"mo"}]},
  {n:311,ch:"式",mn:"Tören / Biçim",on:["SHIKI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Balta/rende' (marangozlukla ilişkili) ve 'kazık' (hem anlamsal hem fonetik, 'işaret, kural' anlamı) unsurlarını içerir.",mm:"📐 KAZIGA GÖNYE UYGULAMAK İYİ BİR BIÇIMDIR",cp:[{k:"新式",r:"SHINSHIKI",m:"Yeni tip, yeni model"},{k:"方式",r:"HŌSHIKI",m:"Formül, yöntem"},{k:"葬式",r:"SŌSHIKI",m:"Cenaze töreni"}],ex:[{s:"結婚___に出席した。",tr:"Düğün törenine katıldım.",b:"式",br:"SHIKI"}]},
  {n:312,ch:"実",mn:"Gerçek / Meyve vermek",on:["JITSU"],kun:["mi", "minoru"],or:"Geleneksel form. Bronz form 'çatı', 'kabuk para' ve aralarındaki fonetik unsuru içerir; 'zenginlik dolu ev' anlamını verir. 'Meyve vermek' genişletilmiş anlamdır; 'gerçek' de muhtemelen böyledir.",mm:"🏠 EVDE ALTI KOLLU BÜYÜK BİR ADAM VAR — IŞTE GERÇEK!",cp:[{k:"実行",r:"JIKKŌ",m:"Uygulama, gerçekleştirme"},{k:"事実",r:"JIJITSU",m:"Gerçek, olgu"},{k:"実入り",r:"miiri",m:"Ürün, kâr"}],ex:[{s:"___際に行ってみた。",tr:"Gerçekten gidip gördüm.",b:"実",br:"JITSU"}]},
  {n:313,ch:"写",mn:"Kopyalamak / Aktarmak",on:["SHA"],kun:["utsusu", "utsuru"],or:"Geç dönem karakter (Shuowen). Geleneksel form 'çatı' ve kuş piktogramını içerir; fonetik unsur 'bir yerden başka yere taşımak' çağrışımlı. 'Kopyalamak' genişletilmiş anlamdır.",mm:"🏠 SIVRI ÇATI DÜZ ÇATI OLARAK KOPYALANMIŞ — YANLIŞ İZLENİM",cp:[{k:"写真",r:"SHASHIN",m:"Fotoğraf"},{k:"写実",r:"SHAJITSU",m:"Gerçekçilik"},{k:"複写機",r:"FUKUSHAKI",m:"Fotokopi makinesi"}],ex:[{s:"風景を___真に撮った。",tr:"Manzarayı fotoğrafladım.",b:"写",br:"sha"}]},
  {n:314,ch:"者",mn:"Kişi",on:["SHA"],kun:["mono"],or:"Bronz, mühür ve geleneksel form. Bronz form bir kaptan dışarı çıkıntı yapan odunu; muhtemelen yanıyor. Özgün anlam 'çok odun toplamak ve depolamak'. 'Kişi' ödünç anlamdır.",mm:"⚰️ ÇOĞU KİŞİ BİR GÜN TOPRAĞA GÖMÜLECEK",cp:[{k:"作者",r:"SAKUSHA",m:"Yazar"},{k:"後者",r:"KŌSHA",m:"Sonraki (kişi/şey)"},{k:"若者",r:"wakamono",m:"Genç insanlar"}],ex:[{s:"医___に相談した。",tr:"Doktora danıştım.",b:"者",br:"SHA"}]},
  {n:315,ch:"主",mn:"Efendi / Sahip / Ana",on:["SHU"],kun:["nushi", "omo"],or:"OBI formu fitili yanan lambayı tasvir eder; bronz formda yalnızca fitil görülür. Özgün anlam lamba. Antik zamanlarda evin reisi lambadan sorumluydu; dolayısıyla 'efendi, ana' anlamları gelişti.",mm:"👑 BIRAZ FAZLASI OLAN KRAL GERÇEK BİR EFENDİDİR",cp:[{k:"主人",r:"SHUJIN",m:"Efendi, koca"},{k:"地主",r:"JInushi",m:"Toprak sahibi"},{k:"主に",r:"omo ni",m:"Ağırlıklı olarak"}],ex:[{s:"お___さんに挨拶した。",tr:"Ev sahibiyle selamlaştım.",b:"主",br:"nushi"}]},
  {n:316,ch:"守",mn:"Korumak / Muhafaza etmek",on:["SHU", "SU"],kun:["mamoru"],or:"Bronz ve mühür formlar. 'Çatı, konut' ve 'ölçmek' (orijinal anlam 'el' veya 'kontrol etmek') unsurlarını içerir. Özgün anlam 'evde kontrol etmek, iş yapmak'; sonra 'korumak' anlamını kazandı.",mm:"🏠 ELİN ÖNLEMLERLE ÇATIYI KORU",cp:[{k:"保守",r:"HOSHU",m:"Muhafazakarlık"},{k:"留守番",r:"RUSUBAN",m:"Ev bekçisi"},{k:"子守",r:"komori",m:"Dadı, bebek bakıcısı"}],ex:[{s:"約束を___った。",tr:"Sözümü tuttum.",b:"守",br:"mamo"}]},
  {n:317,ch:"取",mn:"Almak / Tutmak",on:["SHU"],kun:["toru"],or:"OBI ve bronz formlar. 'Kulak' ve 'el' (anlamsal) unsurlarını içerir. Genellikle vahşi hayvanı kulağından tutarak yakalamak şeklinde yorumlanır. Alternatif görüşe göre savaşta düşman kulağı alınırdı.",mm:"👂 EL KULAĞIN KONTROLÜNÜ ALIR",cp:[{k:"取得",r:"SHUTOKU",m:"Edinim, kazanım"},{k:"取り出す",r:"toridasu",m:"Çıkarmak"},{k:"取引",r:"torihiki",m:"İşlem, alışveriş"}],ex:[{s:"本棚から本を___った。",tr:"Raftan kitap aldım.",b:"取",br:"to"}]},
  {n:318,ch:"酒",mn:"Alkol / Sake",on:["SHU"],kun:["sake", "saka-"],or:"OBI ve bronz formlar. OBI'de bir unsur su/sıvıdır; diğeri kapağı olan fermentasyon veya depolama kabının piktogramı. 169 (batı) ile karıştırılmamalı.",mm:"🍶 SAKE KAVANOZUNDAN ALKOL DAMLALARI",cp:[{k:"飲酒",r:"INSHU",m:"Alkol içmek"},{k:"酒場",r:"sakaba",m:"Bar, meyhane"},{k:"酒飲み",r:"sakenomi",m:"İçki içen kişi"}],ex:[{s:"友達と___を飲んだ。",tr:"Arkadaşımla içki içtim.",b:"酒",br:"sake"}]},
  {n:319,ch:"受",mn:"Almak / Kabul etmek",on:["JU"],kun:["ukeru"],or:"OBI ve bronz formlar. Karşılıklı duran iki el ve aralarında 'tekne' (fonetik, 'bir taraftan diğerine el vermek' çağrışımlı) içerir. Hem 'almak' hem 'vermek' için kullanılırdı; sonra ayrı grafik (729) ",mm:"🏃 EL BAŞKA ELİN KOŞU SOPASINI ALIYOR",cp:[{k:"受験者",r:"JUKENS HA",m:"Sınav adayı"},{k:"受け取り",r:"uketori",m:"Makbuz, fiş"},{k:"受付",r:"uketsuke",m:"Resepsiyon"}],ex:[{s:"プレゼントを___け取った。",tr:"Hediyeyi teslim aldım.",b:"受",br:"u"}]},
  {n:320,ch:"州",mn:"Eyalet / Kum topluluğu",on:["SHŪ"],kun:["su"],or:"OBI ve bronz formlar. Nehirde bir adacık ya da kum topluluğunu tasvir eder. Mühür yazısında tek adacık üçe dönüştü. Anlam sonradan büyük arazi parçaları için genişledi.",mm:"🌊 NEHIRLI VE KUM TOPLU EYAlet",cp:[{k:"本州",r:"HONSHŪ",m:"Honshū"},{k:"砂州",r:"SAsU",m:"Kum topluluğu"},{k:"九州",r:"KYŪSHŪ",m:"Kyūshū"}],ex:[{s:"アメリカの___を旅した。",tr:"Amerika'nın eyaletlerinde seyahat ettim.",b:"州",br:"SHŪ"}]},
  {n:321,ch:"拾",mn:"Toplamak / On (resmi)",on:["SHŪ", "JŪ"],kun:["hirou"],or:"Geç dönem karakter (Shuowen). 'El' ve 'birleştirmek' (fonetik, 'devam etmek' çağrışımlı) unsurlarından oluşur. Tōdō anlamsal olarak 'ellerle bir araya getirmek' der. 'Toplamak' genişletilmiş anlamdır.",mm:"🤝 BİRLEŞEN ELLER ŞEYLERİ TOPLAYABİLİR YA DA ONLARA KADAR SAYABİLİR",cp:[{k:"収拾",r:"SHŪSHŪ",m:"Kontrol, denetim"},{k:"拾い物",r:"hiroimono",m:"Ucuz bulgu"},{k:"拾一",r:"JŪICHI",m:"On bir (resmi)"}],ex:[{s:"ゴミを___った。",tr:"Çöp topladım.",b:"拾",br:"hiro"}]},
  {n:322,ch:"終",mn:"Bitmek / Son",on:["SHŪ"],kun:["owaru", "oweru"],or:"OBI ve bronz form ip uçlarındaki düğümleri gösterir; dolayısıyla 'son'. Mühür yazısından itibaren 'iplik/ipek' ve 'kış' (fonetik, 'biriktirmek, depolamak' çağrışımlı) unsurlarından oluşur.",mm:"🧵 İPLİKLER KIŞIN BITER",cp:[{k:"終点",r:"SHŪTEN",m:"Son durak"},{k:"終止符",r:"SHŪSHIFU",m:"Nokta (dil bilgisi)"},{k:"終わりに",r:"owari ni",m:"Sonunda, nihayetinde"}],ex:[{s:"授業が___わった。",tr:"Ders bitti.",b:"終",br:"o"}]},
  {n:323,ch:"習",mn:"Öğrenmek / Alıştırma",on:["SHŪ"],kun:["narau"],or:"OBI formu. Genel olarak 'kuş tüyleri' ve fonetik unsur (birikmek çağrışımlı) içerir; özgün anlam uçmak için kanat çırpıştıran kuş. Genişletilmiş anlam 'tekrar ve alıştırma; öğrenmek'tir.",mm:"🦅 BEYAZ KANATLARLA UÇMAYI ÖĞRENMEK",cp:[{k:"練習",r:"RENSHŪ",m:"Alıştırma, pratik"},{k:"習字",r:"SHŪJI",m:"Hat sanatı"},{k:"見習い",r:"minarai",m:"Çırak, stajyer"}],ex:[{s:"ピアノを___っている。",tr:"Piyano dersi alıyorum.",b:"習",br:"nara"}]},
  {n:324,ch:"集",mn:"Toplamak / Bir araya gelmek",on:["SHŪ"],kun:["atsumeru", "atsumaru"],or:"OBI ve bronz formlar var. Geleneksel form ağaç üzerinde üç kuşu gösterir; erken ve modern formlar yalnızca birini gösterir. 'Ağaçta toplanan kuşlar' anlamından 'toplamak, bir araya gelmek' gelir.",mm:"🐦 AĞAÇTA TOPLANAN KUŞLAR",cp:[{k:"集団",r:"SHŪDAN",m:"Grup"},{k:"編集",r:"HENSHŪ",m:"Düzenleme, editörlük"},{k:"集まり",r:"atsumari",m:"Toplantı, buluşma"}],ex:[{s:"切手を___めている。",tr:"Pul topluyorum.",b:"集",br:"atsu"}]},
  {n:325,ch:"住",mn:"İkamet etmek / Yaşamak",on:["JŪ"],kun:["sumu"],or:"Çok geç dönem karakter (Shirakawa, 229-589 AD arasına koyar). 'Kişi' ve 'efendi/ana' (fonetik, 'hareketsiz kalmak' çağrışımlı) unsurlarını içerir.",mm:"💡 LAMBAYA YAKIN KİŞİ BURADA YAŞIYOR",cp:[{k:"住所",r:"JŪSHO",m:"Adres"},{k:"住宅",r:"JŪTAKU",m:"Konut, ev"},{k:"住み手",r:"sumite",m:"Kiracı, sakin"}],ex:[{s:"東京に___んでいる。",tr:"Tokyo'da yaşıyorum.",b:"住",br:"su"}]},
  {n:326,ch:"重",mn:"Ağır / Katmak / ...kat",on:["JŪ", "CHŌ"],kun:["omoi", "kasaneru", "kasanaru"],or:"Daha basit bronz form 'kişi' ve 'çuval' (fonetik) unsurlarından oluşur. Daha karmaşık bronz form 'toprak/zemin' alt bileşenini ekler. Temel anlam 'içinde şeyler olan çuval taşıyan dik duran kişi'.",mm:"🚗 AĞIR ARAÇTA EKSTRİ TEKERLER VAR",cp:[{k:"重大",r:"JŪDAI",m:"Ciddiyet, ağırlık"},{k:"重さ",r:"omosa",m:"Ağırlık"},{k:"三重",r:"mie",m:"Üç katlı"}],ex:[{s:"この荷物はとても___い。",tr:"Bu yük çok ağır.",b:"重",br:"omo"}]},
  {n:327,ch:"宿",mn:"Konaklama / Barınak",on:["SHUKU"],kun:["yado", "yadoru"],or:"Daha basit OBI form dizüstü ya da yerde yatan kişiyi gösterir; daha karmaşık form 'çatı' ekler. Genel anlam bina içinde sandalyede ya da hasırın yanında oturan ya da yatan kişidir.",mm:"🏠 YÜZ KİŞİ AYNI ÇATI ALTINDA KONAKLIYOR",cp:[{k:"宿題",r:"SHUKUDAI",m:"Ödev"},{k:"宿屋",r:"yadoya",m:"Han, hostel"},{k:"下宿人",r:"GESHUKŪNIN",m:"Pansiyoner"}],ex:[{s:"旅館に___泊した。",tr:"Japon pansiyonunda konakladım.",b:"宿",br:"yado"}]},
  {n:328,ch:"所",mn:"Yer / Durum",on:["SHO"],kun:["tokoro"],or:"Bronz ve mühür formlar. 'Balta' ve 'kapı' (fonetik, 'odun kesmek sesi' çağrışımlı) olarak yorumlanır. 'Yer' anlamı ödünç kullanımdır; somut bir yerden soyut duruma genişledi.",mm:"🪓 KAPIYA BALTAYLA GİR — YER BULURSUN",cp:[{k:"場所",r:"baSHO",m:"Yer, mekan"},{k:"所有",r:"SHOYŪ",m:"Sahiplik"},{k:"居所",r:"idokoro",m:"Nerede olduğu"}],ex:[{s:"待ち合わせ___を決めた。",tr:"Buluşma yerini belirledik.",b:"所",br:"tokoro"}]},
  {n:329,ch:"暑",mn:"Sıcak (hava)",on:["SHO"],kun:["atsui"],or:"Geç dönem karakter (Shuowen). 'Güneş' ve 'kişi' (fonetik, 'yanmak' çağrışımlı) unsurlarını içerir. Ogawa 'kişi'yi anlamsal olarak da değerlendirir.",mm:"☀️ SICAN GÜNEŞ ALTINDA KİŞİ",cp:[{k:"酷暑",r:"KOKUSHO",m:"Yoğun sıcak"},{k:"避暑地",r:"HISHOCHI",m:"Serin tatil bölgesi"},{k:"暑さ",r:"atsusa",m:"Sıcaklık"}],ex:[{s:"夏は___くて大変だ。",tr:"Yaz çok sıcak ve zor.",b:"暑",br:"atsu"}]},
  {n:330,ch:"助",mn:"Yardım etmek",on:["JO"],kun:["tasukeru", "taskaru"],or:"Bronz form. 'Güç' ve 'daha fazla, ayrıca' (fonetik, 'yardım' ya da 'yardım etmek' çağrışımlı) unsurlarını içerir; 'güçle yardım etmek' ya da 'güç katmak' anlamına gelir.",mm:"💪 GÜCE DAHA FAZLA EKLEYEREK YARDIM ET",cp:[{k:"助手",r:"JOSHU",m:"Asistan"},{k:"助力",r:"JORYOKU",m:"Yardım, destek"},{k:"助け合い",r:"tasukeai",m:"Karşılıklı yardım"}],ex:[{s:"困っている人を___けた。",tr:"Zor durumda olan birine yardım ettim.",b:"助",br:"tasu"}]},
  {n:331,ch:"昭",mn:"Parlak / Aydınlık",on:["SHŌ"],kun:[],or:"Mühür formu. 'Güneş' ve 'çağırmak' (fonetik, 'parlak, berrak; parlamak' çağrışımlı) unsurlarını içerir.",mm:"☀️ GÜNEŞI ÇAĞIR VE PARLAK IŞIK DOLSUN",cp:[{k:"昭和",r:"SHŌWA",m:"Showa Dönemi"},{k:"昭代",r:"SHŌDAI",m:"Aydınlanmış dönem"},{k:"昭昭",r:"SHŌSHŌ",m:"Parlaklık"}],ex:[{s:"___和時代の映画を見た。",tr:"Showa döneminden film izledim.",b:"昭",br:"SHŌ"}]},
  {n:332,ch:"消",mn:"Söndürmek / Yok olmak",on:["SHŌ"],kun:["kieru", "kesu"],or:"Geç dönem karakter (Shuowen). 'Su' ve 'az, kıt, küçük' (fonetik) unsurlarını içerir. 'Su azalıyor' özgün anlam; kullanımla daha geneli ifade etmeye başladı. Modern form küçük ay olarak hatırlanabilir.",mm:"🌙 SU KÜÇÜK AYLIMIZDAN YOK OLDU",cp:[{k:"消費",r:"SHŌHI",m:"Tüketim"},{k:"消しゴム",r:"keshiGOMU",m:"Silgi"},{k:"消火器",r:"SHŌKAKI",m:"Yangın söndürücü"}],ex:[{s:"ろうそくの火を___した。",tr:"Mum ışığını söndürdüm.",b:"消",br:"ke"}]},
  {n:333,ch:"商",mn:"Ticaret / Satmak",on:["SHŌ"],kun:["akinau"],or:"OBI ve bronz formlar var. Yorumlar değişir: bazıları platform/sehpa üzerinde odun; daha ikna edici görüş alt kısmı hayvan ya da kadının arka tarafı olarak yorumlar. 'Ticaret' ödünç anlamdır.",mm:"🤔 HAYAL GÜCÜNÜ KULLAN!",cp:[{k:"商業",r:"SHŌGYŌ",m:"Ticaret"},{k:"商人",r:"SHŌNIN",m:"Tüccar"},{k:"商い",r:"akinai",m:"Ticaret, iş"}],ex:[{s:"___店街を歩いた。",tr:"Alışveriş caddesinde yürüdüm.",b:"商",br:"SHŌ"}]},
  {n:334,ch:"章",mn:"Rozet / Bölüm",on:["SHŌ"],kun:[],or:"Bronz ve mühür formlar. Suçluları ve köleleri net biçimde tanımlamak için dövme iğnesini tasvir eder. Dövme iğnesi 'işaret, nişan' anlamına geldi; genişletilmiş anlamlar 'yazı; yazının bölümleri'dir.",mm:"⏰ ROZETLERE AİT ERKEN BÖLÜM ÖNE ÇIKIYOR",cp:[{k:"記章",r:"KISHŌ",m:"Madalya, rozet"},{k:"文章",r:"BUNSHŌ",m:"Yazı, nesir"},{k:"章句",r:"SHŌKU",m:"Bölüm, pasaj"}],ex:[{s:"本の第一___を読んだ。",tr:"Kitabın ilk bölümünü okudum.",b:"章",br:"SHŌ"}]},
  {n:335,ch:"勝",mn:"Kazanmak / Üstün olmak",on:["SHŌ"],kun:["katsu", "masaru"],or:"Mühür formu. Geç dönem karakter (Shuowen). 'Güç' ve 'tekne tahtalarını birleştirmek' (fonetik, 'yukarı kaldırmak' çağrışımlı) unsurlarını içerir; 'güç kullanarak yukarı kaldırmak; dayanmak'. 'Kazanmak",mm:"🏆 BOYNUZLU GÜÇLÜ ETLİ ADAM KAZANIR",cp:[{k:"勝利",r:"SHŌRI",m:"Zafer"},{k:"勝負",r:"SHŌBU",m:"Kazan ya da kaybet, maç"},{k:"勝ち気",r:"kachiKI",m:"Kazanma isteği"}],ex:[{s:"試合に___った。",tr:"Maçı kazandım.",b:"勝",br:"ka"}]},
  {n:336,ch:"乗",mn:"Binmek / Yüklenmek",on:["JŌ"],kun:["noru", "seru"],or:"Geleneksel form. OBI formu ağacın en üst dallarına çökmüş bir kişiyi gösterir — tırmanmak/binmek. Katō bunu basit bir piktograf olarak görür.",mm:"🌳 İKİ KİŞİ BİNEREK GELİYOR",cp:[{k:"乗船",r:"JŌSEN",m:"Gemiye binme"},{k:"乗数",r:"JŌSŪ",m:"Çarpan"},{k:"乗り物",r:"norimono",m:"Araç, taşıt"}],ex:[{s:"電車に___った。",tr:"Trene bindim.",b:"乗",br:"no"}]},
  {n:337,ch:"植",mn:"Dikmek",on:["SHOKU"],kun:["ueru"],or:"Geç dönem karakter (Shuowen). 'Ağaç' ve 'doğrudan, dik' (hem anlamsal hem fonetik) unsurlarından oluşur; 'dik durmak, dimdik durmak' anlamı verir. Ogawa 'direk' özgün anlam olarak görür.",mm:"🌳 DİK DURAN AĞAÇ DİKİLİYOR",cp:[{k:"植物",r:"SHOKUBUTSU",m:"Bitki örtüsü, flora"},{k:"田植え",r:"taue",m:"Pirinç dikimi"},{k:"植民地",r:"SHOKUMINCHI",m:"Sömürge"}],ex:[{s:"庭に花を___えた。",tr:"Bahçeye çiçek diktim.",b:"植",br:"u"}]},
  {n:338,ch:"申",mn:"Söylemek / Açıklamak",on:["SHIN"],kun:["mōsu"],or:"OBI ve mühür formlar. OBI formu çatallı şimşeği; mühür formu insan omurgası ve birkaç kaburga kemiğini tasvir eder — iki farklı grafik şekli söz konusu. 'Söylemek' ödünç anlamdır.",mm:"⚡ GÜNEŞ ŞİMŞEKLE DELİNİYOR! NE SÖYLENEBİLİR Kİ?",cp:[{k:"申告",r:"SHINKOKU",m:"Beyan, bildirim"},{k:"申し込み",r:"mōshikomi",m:"Başvuru, kayıt"},{k:"申し訳",r:"mōshiwake",m:"Özür, gerekçe"}],ex:[{s:"___し訳ありません。",tr:"Özür dilerim.",b:"申",br:"mō"}]},
  {n:339,ch:"身",mn:"Vücut / Beden",on:["SHIN"],kun:["mi"],or:"OBI ve bazı bronz formlar hamile bir kadını tasvir eder; diğer bronz formlar bunu 'bin' fonetik unsurla ve 'hamile olmak' çağrışımıyla gösterir. Modern anlam 'vücut' genelleşmiş genişlemedir.",mm:"🤰 HAMİLE KADIN ŞIŞMIŞ VÜCUTla YÜRÜYOR",cp:[{k:"身体",r:"SHINTAI",m:"Vücut, beden"},{k:"自身",r:"JISHIN",m:"Kendisi, bizzat"},{k:"身分",r:"miBUN",m:"Statü, konum"}],ex:[{s:"___長を測った。",tr:"Boy ölçüsü aldım.",b:"身",br:"shin"}]},
  {n:340,ch:"神",mn:"Tanrı / Ruh / İlah",on:["SHIN", "JIN"],kun:["kami"],or:"Bronz formlar. İlk şimşeği tasvir eder. İkinci daha yaygın form şimşek bileşeni ve 'sunak/ilah' unsurlarını içerir; 'gök gürültüsü ya da gök gürültüsü tanrısı' anlamı verir, sonra yalnızca 'tanrı'.",mm:"⛩️ GÖK GÜRÜLTÜSÜ TANRISI SUNAKTA RUHSAL BİR ŞEY SÖYLİYOR",cp:[{k:"精神",r:"SEISHIN",m:"Ruh, tin"},{k:"神父",r:"SHINPU",m:"Rahip"},{k:"女神",r:"megami",m:"Tanrıça"}],ex:[{s:"___社にお参りした。",tr:"Tapınağı ziyaret ettim.",b:"神",br:"KAMI"}]},
  {n:341,ch:"真",mn:"Gerçek / Öz",on:["SHIN"],kun:["ma"],or:"OBI, bronz ve mühür formlar var. Yorumlar değişir: ters çevrilmiş kişi ve ters baş; ya da kaşık ve üç ayaklı kazan. Tōdō 'tamamen dolu olmak' kelime ailesine dahil eder. 'Gerçek' ödünç anlamdır.",mm:"🛠️ GERÇEK ŞU Kİ DONANIM ON PARÇAYA BÖLÜNMÜŞ",cp:[{k:"真実",r:"SHINJITSU",m:"Gerçek, doğruluk"},{k:"写真",r:"SHASHIN",m:"Fotoğraf"},{k:"真っ白",r:"masshiro",m:"Bembeyaz"}],ex:[{s:"___剣に勉強した。",tr:"Ciddiyetle ders çalıştım.",b:"真",br:"SHIN"}]},
  {n:342,ch:"深",mn:"Derin / Derinleştirmek",on:["SHIN"],kun:["fukai", "fukameru"],or:"Bronz form. 'Su' ve bir nehir adı fonetik unsur olarak 'derin' için ödünç alındı. Modern form ağaç ve delik unsurlarıyla hatırlanabilir.",mm:"🕳️ AĞAÇ YAKININ DERIN SU ÇUKURU",cp:[{k:"深淵",r:"SHIN'EN",m:"Derinlik, uçurum"},{k:"深海",r:"SHINKAI",m:"Derin deniz"},{k:"深入り",r:"fukairi",m:"Derine gitme"}],ex:[{s:"川は___くて危ない。",tr:"Nehir derin ve tehlikeli.",b:"深",br:"fuka"}]},
  {n:343,ch:"進",mn:"İlerleme / Ilerlemek",on:["SHIN"],kun:["susumu", "susumeru"],or:"OBI ve mühür formlar. 'Yürümek, gitmek' belirleyicisi ve 'kuş' (fonetik, 'ayakkabıyla dışarı çıkmak' çağrışımlı) unsurlarını içerir.",mm:"🐦 HAREKET EDEN KUŞ GİBİ İLERLE",cp:[{k:"前進",r:"ZENSHIN",m:"İlerleme, ilerlemek"},{k:"進化",r:"SHINKA",m:"Evrim, gelişme"},{k:"進言",r:"SHINGEN",m:"Tavsiye, öneri"}],ex:[{s:"まっすぐ___んだ。",tr:"Düz ilerledi.",b:"進",br:"susu"}]},
  {n:344,ch:"世",mn:"Dünya / Nesil",on:["SEI", "SE"],kun:["yo"],or:"Bronz ve mühür formlar. Genel olarak otuz (10 grafiği üç kez yazılmış) olarak yorumlanır; bir neslin yaklaşık otuz yıl sürmesi nedeniyle. 'Dünya, toplum' genişletilmiş anlamdır.",mm:"🌍 '32 NESLİNİN TUHAF DÜNYASI",cp:[{k:"世紀",r:"SEIKI",m:"Yüzyıl"},{k:"世話",r:"SEWA",m:"Bakım, özen"},{k:"世の中",r:"yononaka",m:"Toplum, dünyanın gidişatı"}],ex:[{s:"___界中を旅したい。",tr:"Tüm dünyayı gezmek istiyorum.",b:"世",br:"SE"}]},
  {n:345,ch:"整",mn:"Düzenlemek",on:["SEI"],kun:["totonoeru", "totonou"],or:"Bronz ve mühür formlar. 'Emir/bildiri' varyantı (kendisi 'düzgünce düzenlemek' anlamına gelir) ve 'doğru' (fonetik, 'sıraya koymak' çağrışımlı) unsurlarını içerir.",mm:"📜 EMİR DOĞRU DÜZENLEMEYİ ZORLAR",cp:[{k:"整理",r:"SEIRI",m:"Düzenleme, sıralama"},{k:"整備",r:"SEIBI",m:"Bakım, hazırlık"},{k:"微調整",r:"BICHŌSEI",m:"İnce ayar"}],ex:[{s:"部屋を___理した。",tr:"Odayı düzenledim.",b:"整",br:"SEI"}]},
  {n:346,ch:"昔",mn:"Eski zamanlar / Geçmiş",on:["SEKI", "SHAKU"],kun:["mukashi"],or:"OBI ve mühür formlar. Etimoloji tartışmalı. Katō ve Tōdō 'gün(ler)' ve 'biriktirmek' fonetik unsuru olarak yorumlar — 'birikmiş günler'. Modern formda üst kısım iki on ve bir olarak hatırlanabilir.",mm:"📅 YİRMİ BİR GÜN ÖNCE GEÇMIŞTI",cp:[{k:"昔日",r:"SEKIJITSU",m:"Eski günler"},{k:"昔風",r:"mukashiFŪ",m:"Eski tarz"},{k:"今昔",r:"KONJAKU",m:"Geçmiş ve günümüz"}],ex:[{s:"___話を聞かせてもらった。",tr:"Destan dinledim.",b:"昔",br:"mukashi"}]},
  {n:347,ch:"全",mn:"Tüm / Tam",on:["ZEN"],kun:["mattaku"],or:"Mühür formlar. Genel olarak 'kral/iş' 'yeşim, kıymetli taş' yerine geçer ve 'girmek' fonetik unsur olarak 'güzel, iyi' çağrışımıyla yer alır; özgün anlam 'kusursuz yeşim taşı' ve dolayısıyla 'tam, eks",mm:"👑 ŞAPKALI KRAL TAMAMEN EKSİKSİZ",cp:[{k:"全部",r:"ZENBU",m:"Hepsi, tamamı"},{k:"全身",r:"ZENSHIN",m:"Tüm vücut"},{k:"安全",r:"ANZEN",m:"Güvenlik"}],ex:[{s:"___力で走った。",tr:"Tüm gücümle koştum.",b:"全",br:"ZEN"}]},
  {n:348,ch:"相",mn:"Karşılıklı / Görünüş / Bakan",on:["SŌ", "SHŌ"],kun:["ai-"],or:"OBI ve bronz formlar. 'Göz' ve 'ağaç' (ya da dut ağacı) unsurlarından oluşur. 'Ağaca bakmak/incelemek' ve daha genel olarak 'bakmak/incelemek' özgün anlamdır. 'Karşılıklı', 'yardım', 'bakan' ödünç anl",mm:"🌳 BAKAN AĞACA BAKAR, AĞAÇ BAKANA BAKAR — KARŞILIKLI",cp:[{k:"相談",r:"SŌDAN",m:"Tartışma, görüşme"},{k:"相手",r:"aite",m:"Karşı taraf, muhatap"},{k:"首相",r:"SHUSHŌ",m:"Başbakan"}],ex:[{s:"友達に___談した。",tr:"Arkadaşıma danıştım.",b:"相",br:"SŌ"}]},
  {n:349,ch:"送",mn:"Göndermek",on:["SŌ"],kun:["okuru"],or:"Bronz ve mühür formlar var. 'Gitmek, yürümek' ve üst sağ unsur olarak 'tokmak' (fonetik, 'devam etmek' ya da 'itmek' çağrışımlı) içerir. Özgün anlam 'ardından yol boyunca yürümek'; 'göndermek' genişle",mm:"🌤️ CENNETTEN DIŞARIYA GÖNDERİLDİ!",cp:[{k:"放送",r:"HŌSŌ",m:"Yayın"},{k:"送金",r:"SŌKIN",m:"Para transferi"},{k:"見送る",r:"miokuru",m:"Uğurlamak"}],ex:[{s:"荷物を___った。",tr:"Paketi gönderdim.",b:"送",br:"oku"}]},
  {n:350,ch:"想",mn:"Fikir / Düşünce",on:["SŌ", "SO"],kun:[],or:"Geç dönem karakter (Shuowen). Mühür formu. 'Kalp, zihin' ve 'karşılıklı' (fonetik ve anlamsal, 'görmek, incelemek' çağrışımlı) unsurlarını içerir; 'zihinden görmek, düşünmek' anlamı verir.",mm:"🌳 BİR AĞACA BAKARKEN BİR FİKİR DOĞDU",cp:[{k:"着想",r:"CHAKUSŌ",m:"Fikir, konsept"},{k:"理想",r:"RISŌ",m:"İdeal"},{k:"愛想",r:"AISŌ",m:"Nezaket, dostluk"}],ex:[{s:"旅行の計___を立てた。",tr:"Seyahat planı yaptım.",b:"想",br:"SŌ"}]},
  {n:351,ch:"息",mn:"Nefes / Dinlenme / Faiz",on:["SOKU"],kun:["iki"],or:"Bronz formlar. 'Kendilik' (özgün anlam 'burun') ve 'kalp/zihin' (fonetik, 'ilerlemek' çağrışımlı) unsurlarını içerir; temel anlam 'nefes almak'. 'Dinlenme' genişletilmiş anlam; para faizi Han dönemind",mm:"👃 KALP NEFES ALMAK İÇİN BURUNA İHTİYAÇ DUYAR",cp:[{k:"休息",r:"KYŪSOKU",m:"Dinlenme, istirahat"},{k:"ため息",r:"tameiki",m:"Derin nefes, iç çekiş"},{k:"利息",r:"RISOKU",m:"Faiz (para)"}],ex:[{s:"深呼吸して___を整えた。",tr:"Derin nefes alıp nefesimi düzelttim.",b:"息",br:"iki"}]},
  {n:352,ch:"速",mn:"Hız / Hızlı",on:["SOKU"],kun:["hayai", "hayameru", "sumiyaka"],or:"Bronz ve mühür formlar. 'Gitmek, yürümek' ve 'demet' (fonetik, 'meşgul, huzursuz, aceleyle' çağrışımlı) unsurlarını içerir.",mm:"📦 DEMET YAPMAK İÇİN ÇOK HIZLI GİDİYOR",cp:[{k:"速記",r:"SOKKI",m:"Kısa yazı, steno"},{k:"時速",r:"JISOKU",m:"Saatte hız"},{k:"速やかに",r:"sumiyaka ni",m:"Hızla, ivediyle"}],ex:[{s:"この電車はとても___い。",tr:"Bu tren çok hızlı.",b:"速",br:"haya"}]},
  {n:353,ch:"族",mn:"Klan / Aile",on:["ZOKU"],kun:[],or:"OBI ve bronz formlar. Genel olarak 'ok' ve bayrak direği ile flama (fonetik, 'sivri, keskin' çağrışımlı) unsurlarından oluşur. Özgün anlam 'ok başı'. 'Aile' ödünç anlamdır.",mm:"🏹 YANINDAKİ OKU OLAN KİŞİ AİLEMİZDEN",cp:[{k:"家族",r:"KAZOKU",m:"Aile"},{k:"民族",r:"MINZOKU",m:"Etnik grup, millet"},{k:"種族",r:"SHUZOKU",m:"Kabile, soy"}],ex:[{s:"家___で旅行した。",tr:"Aileyle seyahat ettik.",b:"族",br:"ZOKU"}]},
  {n:354,ch:"他",mn:"Diğer",on:["TA"],kun:["hoka"],or:"Bronz ve mühür formlar. Başlangıçta 'diğer, başka kişi' büyük başlı yılan piktografıyla yazılırdı. Sonradan 'sırtlayıp taşımak' grafiği türetildi ve 'diğer' için kullanıldı.",mm:"🐍 O DİĞER KİŞİ BİR YILANDIR",cp:[{k:"他人",r:"TANIN",m:"Yabancı, başkası"},{k:"他国",r:"TAKOKU",m:"Yabancı ülke"},{k:"他国",r:"TAKOKU",m:"Yabancı ülke"}],ex:[{s:"___の人の意見も聞いた。",tr:"Başkalarının görüşlerini de dinledim.",b:"他",br:"TA"}]},
  {n:355,ch:"打",mn:"Vurmak / Çarpmak",on:["DA"],kun:["utsu"],or:"Mühür formu; geç dönem karakter (Shuowen). 'El' ve 'çivi' (fonetik, 'çarpmak' çağrışımlı) unsurlarından oluşur.",mm:"🔨 EL ÇİVİYE ÇARPIYOR",cp:[{k:"打者",r:"DASHA",m:"Beysbol vurucu"},{k:"打撃",r:"DAGEKI",m:"Darbe, çarpma"},{k:"打ち返す",r:"uchikaesu",m:"Geri vurmak"}],ex:[{s:"ボールを___った。",tr:"Topu vurdum.",b:"打",br:"u"}]},
  {n:356,ch:"対",mn:"Karşı / Zıt / Çift",on:["TAI", "TSUI"],kun:[],or:"OBI ve bronz formlar. Genel olarak 'eylem/meslek' (başlangıçta çan asan çerçeve) ve 'el' unsurlarından oluşur. İki tahta çerçeve birbirine bakıyordu; dolayısıyla 'çift, karşılık' anlamı.",mm:"📝 METİN MUHALEFETI ÖLÇÜYOR",cp:[{k:"反対",r:"HANTAI",m:"Muhalefet, karşı çıkma"},{k:"対象",r:"TAISHŌ",m:"Nesne, hedef"},{k:"対句",r:"TSŪIKU",m:"Beyit, nazire"}],ex:[{s:"二___一で負けた。",tr:"İki-bir kaybettik.",b:"対",br:"TAI"}]},
  {n:357,ch:"待",mn:"Beklemek",on:["TAI"],kun:["matsu"],or:"Bronz ve mühür formlar. 'Yol' ve 'tapınak' (fonetik, 'durmak' çağrışımlı) unsurlarını içerir.",mm:"⛩️ YOLUN YANINDAKI TAPINAKTA BEKLE",cp:[{k:"待機",r:"TAIKI",m:"Fırsat beklemek"},{k:"招待",r:"SHŌTAI",m:"Davet"},{k:"待ち伏せ",r:"machibuse",m:"Pusu"}],ex:[{s:"友達を一時間___った。",tr:"Arkadaşımı bir saat bekledim.",b:"待",br:"ma"}]},
  {n:358,ch:"代",mn:"Değiştirmek / Nesil / Ücret",on:["DAI", "TAI"],kun:["kawaru", "kawareru", "yo"],or:"Bronz ve mühür formlar. 'Kişi' ve 'kazık/işaret' (fonetik, 'değiştirmek' çağrışımlı) unsurlarından oluşur; 'yerine koyulan kişi' genel anlamı verir. Sonradan 'değiştirme, nesil, ücret' anlamlarına gen",mm:"🪵 KİŞİ KAZIKLA DEĞİŞTİRİLİYOR — BİR ÜCRET KARŞILIĞI",cp:[{k:"世代",r:"SEDAI",m:"Nesil, kuşak"},{k:"交代",r:"KŌTAI",m:"Değişim, nöbet değişimi"},{k:"部屋代",r:"heyaDAI",m:"Oda ücreti"}],ex:[{s:"千円で___わりに払った。",tr:"Bin yen yerine ödedim.",b:"代",br:"DAI"}]},
  {n:359,ch:"第",mn:"Derece / Sıra",on:["DAI"],kun:[],or:"Mühür formu; geç dönem karakter (Shuowen). 'Bambu' ve 'küçük erkek kardeş' (fonetik, 'sıra, dizi' çağrışımlı) unsurlarını içerir; özgün anlam 'mektup ya da kayıtları sıraya koymak'.",mm:"🎋 BAMBU KÜÇÜK ERKEk KARDEŞI SIRA BAKIMINDAN GEÇIYOR",cp:[{k:"第二課",r:"DANIKA",m:"Ders İki"},{k:"次第に",r:"SHIDAI ni",m:"Giderek, yavaş yavaş"},{k:"及第",r:"KYŪDAI",m:"Sınavı geçmek"}],ex:[{s:"___一章を読んだ。",tr:"Birinci bölümü okudum.",b:"第",br:"DAI"}]},
  {n:360,ch:"題",mn:"Konu / Başlık",on:["DAI"],kun:[],or:"Mühür formu. 'Baş' ve 'uygun, bu' (fonetik, 'başı traşlamak' çağrışımlı) unsurlarını içerir; traşlanmış baş büyük alın izlenimi verir; antik Çin'de kölelerin alınları işaretlenirdi — dolayısıyla 'başl",mm:"📋 BAŞLIK İÇİN UYGUN BİR BAŞLIK GEREKİYOR",cp:[{k:"問題",r:"MONDAI",m:"Problem, mesele"},{k:"題名",r:"DAIMEI",m:"Başlık"},{k:"話題",r:"WADAI",m:"Konu, gündem"}],ex:[{s:"宿___をやった。",tr:"Ödevi yaptım.",b:"題",br:"DAI"}]},
  {n:361,ch:"炭",mn:"Kömür / Odun kömürü",on:["TAN"],kun:["sumi"],or:"Mühür formu. Genel olarak 'ateş' ve fonetik unsur ('geri dönmek' çağrışımlı) içerir. Odun kömürü kontrollü koşullarda bir kez yakılmış ahşaptır; tekrar yakıt olarak kullanılabilir, dolayısıyla 'ateş g",mm:"🔥 DAĞLIK KAYALIKLARIN YANICI MALZEMESİ KÖMÜRDÜR",cp:[{k:"炭石",r:"TANSEKI",m:"Kömür"},{k:"炭素",r:"TANSO",m:"Karbon"},{k:"炭火",r:"sumibi",m:"Odun kömürü ateşi"}],ex:[{s:"炭酸水に___が入っている。",tr:"Soda suyunda karbon var.",b:"炭",br:"TAN"}]},
  {n:362,ch:"短",mn:"Kısa",on:["TAN"],kun:["mijikai"],or:"Mühür formu; geç dönem karakter (Shuowen). 'Ok' (marangoz gönyesinin kısaltması) ve 'küçük' (fonetik, 'küçük ölçüde kısa' çağrışımlı) unsurlarından oluşur. Sonuç 'kısa' anlamına dönüştü.",mm:"🏹 OK KABIN YANINA BILE KISA DÜŞÜYOR",cp:[{k:"短所",r:"TANSHO",m:"Kısa yön, eksiklik"},{k:"短気",r:"TANKI",m:"Çabuk sinirli"},{k:"手短に",r:"temijika ni",m:"Kısaca, özetle"}],ex:[{s:"この映画は___い。",tr:"Bu film kısa.",b:"短",br:"mijika"}]},
  {n:363,ch:"談",mn:"Konuşma / Sohbet",on:["DAN"],kun:[],or:"Mühür formu; geç dönem karakter (Shuowen). 'Kelimeler, dil' ve 'atlayan alevler' (fonetik, 'huzurlu' çağrışımlı) unsurlarını içerir; özgün anlam 'sakin bir şekilde söylemek'tir.",mm:"🕯️ ALEVLI BİR TARTIŞMA DEĞİL SOHBETTE SICAK SÖZLER",cp:[{k:"相談役",r:"SŌDAN'YAKU",m:"Danışman"},{k:"会談",r:"KAIDAN",m:"Konferans, görüşme"},{k:"談話",r:"DANWA",m:"Konuşma, sohbet"}],ex:[{s:"先生と___話した。",tr:"Öğretmenle görüştüm.",b:"談",br:"DAN"}]},
  {n:364,ch:"着",mn:"Gelmek / Giymek",on:["CHAKU"],kun:["tsuku", "kiru"],or:"Bu geç tarihli grafik 8. yüzyıl Çin karakterleri sözlüğünde halk varyantı olarak yer alır. Bambu ve kişi (fonetik, 'arasına koymak' çağrışımlı) unsurlarından türer. Japonca'da anlam aralığı 'giymek, v",mm:"🐑 KOYUNUN VARARAkEN YÜNLERİNİ GİYDİĞİNİ GÖRÜYORUM",cp:[{k:"到着",r:"TŌCHAKU",m:"Varış"},{k:"着物",r:"kimono",m:"Giysi, kimono"},{k:"付着",r:"FUCHAKU",m:"Yapışma"}],ex:[{s:"制服を___た。",tr:"Üniforma giydim.",b:"着",br:"ki"}]},
  {n:365,ch:"注",mn:"Dökmek / Not",on:["CHŪ"],kun:["sosogu"],or:"Geç dönem karakter (Shuowen). 'Su' ve 'efendi/ana' (fonetik, 'devam etmek' çağrışımlı) unsurlarını içerir; 'su damlalarının devamı' anlamı. Tōdō 'dik/sağlam durmak' kelime ailesine dahil eder.",mm:"💧 EFENDİ SÜTUN HALİNDE SU DÖKÜYOR VE NOT ALIYOR",cp:[{k:"注目",r:"CHŪMOKU",m:"Dikkat, ilgi"},{k:"注射",r:"CHŪSHA",m:"Enjeksiyon"},{k:"注釈",r:"CHŪSHAKU",m:"Açıklama notları"}],ex:[{s:"水を___いだ。",tr:"Su döktüm.",b:"注",br:"so"}]},
  {n:366,ch:"柱",mn:"Sütun / Direk",on:["CHŪ"],kun:["hashira"],or:"Geç dönem karakter (Shuowen). 'Ağaç, ahşap' ve 'efendi/ana' (fonetik, 'sağlam durma' çağrışımlı) unsurlarını içerir. Tōdō 'sağlam/dik durmak' kelime ailesine dahil eder.",mm:"🪵 USTA AHŞAP DİREK",cp:[{k:"柱石",r:"CHŪSEKI",m:"Direk, kiriş"},{k:"電柱",r:"DENCHŪ",m:"Telgraf direği"},{k:"柱石",r:"CHŪSEKI",m:"Temel taş"}],ex:[{s:"家の___が太い。",tr:"Evin direği kalın.",b:"柱",br:"hashira"}]},
  {n:367,ch:"丁",mn:"Blok / Tam / Çivi",on:["CHŌ", "TEI"],kun:[],or:"OBI ve mühür formlar. OBI formu çivi başını (genellikle kare biçimli) gösterir; mühür formu yan görünümdür. Sonradan 'metal' belirleyicisi eklenerek net 'çivi' anlamı oluşturuldu. TEI okunuşu 'nazik, ",mm:"⊤ BLOK TAM BİR T'DİR",cp:[{k:"丁度",r:"CHŌDO",m:"Tam, tamamen"},{k:"丁寧",r:"TEINEI",m:"Nezaket, kibarlık"},{k:"丁目",r:"CHŌme",m:"Şehir bloğu"}],ex:[{s:"一___目の角を曲がる。",tr:"Birinci cadde köşesinden dönüyorum.",b:"丁",br:"CHŌ"}]},
  {n:368,ch:"帳",mn:"Kayıt Defteri / Örtü",on:["CHŌ"],kun:[],or:"Geç dönem karakter (Shuowen). 'Kumaş' ve 'uzun' (fonetik, 'gergin' ya da 'uzun asılı bez' çağrışımlı) unsurlarını içerir. Yatak çevresine perde olarak çekilen kumaşı ifade ederdi.",mm:"📋 UZUN BEZ ÖRTÜSÜ KAYIT DEFTERİ OLARAK KULLANILIR",cp:[{k:"手帳",r:"teCHŌ",m:"Not defteri"},{k:"帳場",r:"CHŌba",m:"Kasiyer masası"},{k:"蚊帳",r:"kaya",m:"Sivrisinek ağı"}],ex:[{s:"手___にメモを書いた。",tr:"Deftere not yazdım.",b:"帳",br:"CHŌ"}]},
  {n:369,ch:"調",mn:"Araştırmak / Ton / Ayar",on:["CHŌ"],kun:["shiraberu", "totonoeru"],or:"Geç dönem karakter (Shuowen). 'Kelimeler, dil' ve 'etrafında' (fonetik, 'uyumlaştırmak' ya da 'iyice uzatmak' çağrışımlı) unsurlarını içerir.",mm:"🗣️ ETRAFINDA KONUŞARAK ARAŞTIR",cp:[{k:"調整",r:"CHŌSEI",m:"Ayarlama, düzenleme"},{k:"調べ",r:"shirabe",m:"Araştırma, soruşturma"},{k:"調子",r:"CHŌSHI",m:"Ton, durum"}],ex:[{s:"体の___子がいい。",tr:"Beden durumum iyi.",b:"調",br:"CHŌ"}]},
  {n:370,ch:"追",mn:"Kovalamak / Takip etmek",on:["TSUI"],kun:["ou"],or:"OBI ve bronz formlar. 'Gitmek/yürümek' ve 'kalça' (fonetik, 'arkadan devam etmek' çağrışımlı) unsurlarını içerir. Tōdō 'bir rota izlemek' kelime ailesine dahil eder.",mm:"🍑 TUHAF KÜÇÜK KUYRUKLU HAREKETLİ KALÇAyı TAKİP ET",cp:[{k:"追及",r:"TSUIKYŪ",m:"Soruşturma, sorgulama"},{k:"追放",r:"TSUIHŌ",m:"Sürgün, kovma"},{k:"追い払う",r:"oiharau",m:"Kovmak, uzaklaştırmak"}],ex:[{s:"犬が猫を___いかけた。",tr:"Köpek kediyi kovaladı.",b:"追",br:"o"}]},
  {n:371,ch:"定",mn:"Sabitlemek / Kurmak",on:["TEI", "JŌ"],kun:["sadameru", "sadamaru"],or:"Bronz ve mühür formlar. 'Çatı, bina' ve 'doğru' (fonetik, 'bir bina hazırlamak' çağrışımlı) unsurlarını içerir. Genişletilmiş anlamlar 'düzenlemek, karar vermek'tir.",mm:"🏠 ÇATIYI DOĞRU BİÇİMDE SABİTLE",cp:[{k:"定期",r:"TEIKI",m:"Sabit dönem, periyot"},{k:"不定",r:"FUTEI",m:"Belirsiz"},{k:"決定",r:"KETTEI",m:"Karar"}],ex:[{s:"待ち合わせの時間を___めた。",tr:"Buluşma saatini belirledik.",b:"定",br:"TEI"}]},
  {n:372,ch:"庭",mn:"Bahçe / Avlu",on:["TEI"],kun:["niwa"],or:"Mühür formu. 'Bina' ve 'imparatorluk sarayı' (fonetik, 'düz bir çizgide uzatmak' çağrışımlı) unsurlarını içerir. Özgün anlam sarayda resmi toplantıların yapıldığı açık alan; sonradan 'bahçe' anlamını ",mm:"🏯 SARAY AVLUSUNDA GÜZEL KAPALI BAHÇE",cp:[{k:"家庭",r:"KATEI",m:"Aile, hane"},{k:"庭園",r:"TEIEN",m:"Bahçe"},{k:"庭師",r:"niwaSHI",m:"Bahçıvan ustası"}],ex:[{s:"___に花を植えた。",tr:"Bahçeye çiçek diktim.",b:"庭",br:"niwa"}]},
  {n:373,ch:"笛",mn:"Flüt / Düdük",on:["TEKI"],kun:["fue"],or:"Geç dönem karakter (Shuowen). 'Bambu' ve 'neden' (fonetik, 'çıkarmak' ya da 'berrak' çağrışımlı) unsurlarını içerir. Tōdō bambu eklem içini oyarak içini boşaltmayı yorumlar.",mm:"🎵 BAMBU NEDEN FLÜT OLARAK KULLANILIR?",cp:[{k:"汽笛",r:"KITEKI",m:"Buharlı düdük"},{k:"笛手",r:"TEKISHU",m:"Flütçü"},{k:"口笛",r:"kuchibue",m:"Islık"}],ex:[{s:"フルートという___を吹く。",tr:"Flüt denen düdük çalıyorum.",b:"笛",br:"fue"}]},
  {n:374,ch:"鉄",mn:"Demir / Çelik",on:["TETSU"],kun:["kurogane"],or:"Mühür formu. Genel olarak 'metal' ve fonetik unsur ('siyah toprak, siyah, kızılkahverengi' çağrışımlı) içerir. Kızılkahverengi metal paslandığında bu rengi alan demir olarak yorumlanır.",mm:"⚒️ KAYIP METAL DEMİR ÇIKIYOR",cp:[{k:"鉄板",r:"TEPPAN",m:"Demir/çelik levha"},{k:"地下鉄",r:"CHIKATETSU",m:"Metro"},{k:"鉄橋",r:"TEKKYŌ",m:"Demir köprü"}],ex:[{s:"___道で旅をした。",tr:"Demiryoluyla seyahat ettim.",b:"鉄",br:"TETSU"}]},
  {n:375,ch:"転",mn:"Döndürmek / Yuvarlanmak",on:["TEN"],kun:["korogeru", "korogasu"],or:"Bronz, mühür ve geleneksel formlar. 'Araba/taşıt' ve fonetik unsur ('hareket etmek/değiştirmek' çağrışımlı) içerir; 'başka yere taşımak'. 'Dönmek/yuvarlanmak' genişletilmiş anlamdır.",mm:"🚗 ARAÇ İKİ BURNUN ÜZERİNDE YUVARLANIR — OFff!",cp:[{k:"転送",r:"TENSŌ",m:"İletme, yönlendirme"},{k:"運転",r:"UNTEN",m:"Sürüş"},{k:"自転車",r:"JITENSHA",m:"Bisiklet"}],ex:[{s:"自転車で___んだ。",tr:"Bisikletle düştüm.",b:"転",br:"koro"}]},
  {n:376,ch:"都",mn:"Başkent / Büyük şehir",on:["TO", "TSU"],kun:["miyako"],or:"Bronz ve mühür formlar. Genel olarak 'köy/kasaba' ve 'kişi' (fonetik, 'toplamak, birikmek' çağrışımlı) unsurlarından oluşur. Özgün anlam 'çok insan toplanan kapalı alan'; dolayısıyla 'başkent'.",mm:"🏙️ BAŞKENT SAĞDAKİ KÖY VE ÇOK KİŞİDİR",cp:[{k:"都市",r:"TOSHI",m:"Şehir"},{k:"首都",r:"SHUTO",m:"Başkent"},{k:"都合",r:"TSUGŌ",m:"Koşullar, uygunluk"}],ex:[{s:"東京は日本の首___だ。",tr:"Tokyo Japonya'nın başkentidir.",b:"都",br:"TO"}]},
  {n:377,ch:"度",mn:"Derece / Kez",on:["DO", "TAKU"],kun:["tabi"],or:"Mühür formu. 'El' ve fonetik unsur (parmakları açmak çağrışımlı) içerir; 'elle ölçmek' anlamı. Baş parmak ve orta parmak açılarak kısa mesafeler kabaca ölçülürdü. Sonradan 'derece' anlamı genelleşti.",mm:"🏠 EL BİNADA YİRMİ BİR DERECEYI ÖLÇÜYOR",cp:[{k:"程度",r:"TEIDO",m:"Derece, düzey"},{k:"温度",r:"ONDO",m:"Sıcaklık"},{k:"一度",r:"ICHIDO",m:"Bir kez"}],ex:[{s:"気温が三十___を超えた。",tr:"Sıcaklık otuz dereceyi geçti.",b:"度",br:"DO"}]},
  {n:378,ch:"投",mn:"Fırlatmak / Atmak",on:["TŌ"],kun:["nageru"],or:"Mühür formu; geç dönem karakter (Shuowen). 'El' ve 'sopa tutan el' (fonetik, 'sopayı atmak' çağrışımlı) unsurlarından oluşur.",mm:"🤸 SILAH ATMAK İÇİN İKİ FARKLI EL GEREKİR",cp:[{k:"投手",r:"TŌSHU",m:"Beysbol atıcısı"},{k:"投票",r:"TŌHYŌ",m:"Oy"},{k:"投げ出す",r:"nagedasu",m:"Fırlatmak, terk etmek"}],ex:[{s:"ボールを___げた。",tr:"Topu fırlattım.",b:"投",br:"na"}]},
  {n:379,ch:"豆",mn:"Fasulye / Minyatür",on:["TŌ", "ZU"],kun:["mame"],or:"OBI ve mühür formlar. Başlangıçta saplı yuvarlak kap piktografı; et ya da yiyecek servisi için kullanılırdı. Fasulye anlamına fonetik ödünç yoluyla geçildi; 'küçük' anlamı fasulyeden genişletildi.",mm:"🫘 SEHPADA KÜÇÜK BİR KUTU — FASULYE DOLU",cp:[{k:"豆腐",r:"TŌFU",m:"Tofu (fasulye peyniri)"},{k:"大豆",r:"DAIZU",m:"Soya fasulyesi"},{k:"豆本",r:"mameHON",m:"Minyatür kitap"}],ex:[{s:"___腐を食べた。",tr:"Tofu yedim.",b:"豆",br:"mame"}]},
  {n:380,ch:"島",mn:"Ada",on:["TŌ"],kun:["shima"],or:"Geç dönem karakter (Shuowen). 'Dağ' ve 'kuş' (fonetik, 'büyük dalgalar' çağrışımlı) unsurlarını içerir; 'denizle çevrili yüksek arazi' dolayısıyla 'ada'.",mm:"🐦 KUŞ DAĞLIK ADAYA KONUYOR",cp:[{k:"列島",r:"RETTŌ",m:"Takımadalar"},{k:"島民",r:"TŌMIN",m:"Ada halkı"},{k:"島国",r:"shimaguni",m:"Ada ülkesi"}],ex:[{s:"沖縄の___は美しい。",tr:"Okinawa adası güzeldir.",b:"島",br:"shima"}]},
  {n:381,ch:"湯",mn:"Sıcak su",on:["TŌ"],kun:["yu"],or:"Bronz ve mühür formlar. 'Su' ve fonetik unsur ('yüksekte parlayan güneş, sıcak' çağrışımlı) içerir. Modern form güneş ve ışınları olarak hatırlanabilir.",mm:"☀️ YÜKSELEN GÜNEŞİN IŞINLARI SUYU ISITIYOR",cp:[{k:"銭湯",r:"SENTŌ",m:"Halk banyosu"},{k:"湯気",r:"yuge",m:"Buhar"},{k:"茶の湯",r:"CHAnoyu",m:"Çay töreni"}],ex:[{s:"お___を沸かした。",tr:"Sıcak su kaynatıyorum.",b:"湯",br:"yu"}]},
  {n:382,ch:"登",mn:"Tırmanmak",on:["TŌ", "TO"],kun:["noboru"],or:"OBI ve bronz formlar var. Yorumlar değişir. Genellikle 'ağır basmak, adım atmak' ve 'yiyecek kabı' (fonetik, 'tırmanmak' çağrışımlı) olarak yorumlanır. 'Yüksek yiyecek kabı' ve 'komik ayaklar' hafıza ",mm:"🦶 İKİ KOMIK AYAK UZUN YIYECEK KABINA TIRMANIR",cp:[{k:"登場",r:"TŌJŌ",m:"Sahneye çıkış, görünüş"},{k:"登山",r:"TOZAN",m:"Dağcılık"},{k:"木登り",r:"kinobori",m:"Ağaca tırmanma"}],ex:[{s:"山に___った。",tr:"Dağa tırmandım.",b:"登",br:"nobo"}]},
  {n:383,ch:"等",mn:"Sınıf / Eşit / vs.",on:["TŌ"],kun:["hitoshii", "nado"],or:"Geç dönem karakter (Shuowen). 'Bambu' (bambu yazı tableti anlamında) ve 'tapınak' (fonetik, 'düzenlemek' çağrışımlı) unsurlarını içerir. 'Eşit' anlamı eşit boyuttaki bambu tabletlerini sıralamaktan ge",mm:"🎋 TAPINAKTAKI BAMBU TABLETLERİ SINIFLANDIRILIP EŞİT SAYILIR",cp:[{k:"一等",r:"ITTŌ",m:"Birinci sınıf"},{k:"上等",r:"JŌTŌ",m:"Üst sınıf, yüksek kalite"},{k:"等圧線",r:"TŌATSUSEN",m:"İzobar"}],ex:[{s:"一___賞を取った。",tr:"Birinci ödülü aldım.",b:"等",br:"TŌ"}]},
  {n:384,ch:"動",mn:"Hareket etmek",on:["DŌ"],kun:["ugoku", "ugokasu"],or:"Geç dönem karakter (Shuowen). 'Güç, kuvvet' ve 'ağır' (fonetik, 'sarsmak' çağrışımlı) unsurlarını içerir; 'güç uygulamak' ve dolayısıyla 'hareket etmek'.",mm:"💪 GÜÇ AĞIR NESNEYİ HAREKET ETTİRİR",cp:[{k:"動物",r:"DŌBUTSU",m:"Hayvan"},{k:"動機",r:"DŌKI",m:"Motif, güdü"},{k:"動き",r:"ugoki",m:"Hareket"}],ex:[{s:"体を___かすのが好きだ。",tr:"Beden hareket ettirmeyi seviyorum.",b:"動",br:"UGO"}]},
  {n:385,ch:"童",mn:"Çocuk",on:["DŌ"],kun:["warabe"],or:"Bronz ve mühür formlar. Bronz formda 'iğne' 'ağır' (fonetik) üzerinde ve 'göz' ortasında; eski Çin'de köleler alınlarına dövme yapılarak işaretlenirdi. Hem 'köle, hizmetçi' hem 'çocuk' anlamı taşırdı.",mm:"🏘️ ÇOCUK KÖYde AYAKTA DURUYOR",cp:[{k:"童話",r:"DŌWA",m:"Masal"},{k:"児童",r:"JIDŌ",m:"Çocuklar"},{k:"童心",r:"DŌSHIN",m:"Çocuk zihin"}],ex:[{s:"___話を子供に読んだ。",tr:"Çocuğa masal okudum.",b:"童",br:"DŌ"}]},
  {n:386,ch:"農",mn:"Tarım / Çiftçilik",on:["NŌ"],kun:[],or:"OBI, bronz ve mühür formlar. OBI'de genel olarak 'orman' ve 'istiridye kabuğu' unsurları bulunur; 'bitkiler ve bitkileri kesen keskin istiridye kabuğu'. Bronz formlarda 'tarla' eklenir.",mm:"🌾 TARLA TARLADA EĞİLEREK VE ORAK KULLANARAK ÇALIŞMAK",cp:[{k:"農場",r:"NŌJŌ",m:"Çiftlik"},{k:"農民",r:"NŌMIN",m:"Çiftçiler"},{k:"農業",r:"NŌGYŌ",m:"Tarım"}],ex:[{s:"___業が盛んな地域だ。",tr:"Tarımın geliştiği bölge.",b:"農",br:"NŌ"}]},
  {n:387,ch:"波",mn:"Dalga",on:["HA"],kun:["nami"],or:"Geç dönem karakter (Shuowen). 'Su' ve 'deri, post' (fonetik, 'yukarı aşağı hareket etmek, kabarmak' çağrışımlı) unsurlarını içerir. Tōdō 'kaplanmak; eğimli' kelime ailesine dahil eder.",mm:"🌊 DALGALAR SUYUN DERİSİNİ OLUŞTURUR",cp:[{k:"周波",r:"SHŪHA",m:"Frekans"},{k:"音波",r:"ONPA",m:"Ses dalgası"},{k:"波乗り",r:"naminori",m:"Sörf"}],ex:[{s:"海の___が高い。",tr:"Denizin dalgaları yüksek.",b:"波",br:"nami"}]},
  {n:388,ch:"配",mn:"Dağıtmak",on:["HAI"],kun:["kubaru"],or:"OBI ve mühür formlar. 'Şarap küpü/şarap' ve sağ tarafta diz çökmüş kişiyi gösterir. Ma özgün anlamı 'şaraba ihtiyaç duyan kişi' olarak yorumlar. Diğerleri 'dağıtmak' anlamını ödünç kullanım olarak gör",mm:"🍾 KENDİNE DAĞITMAK — DİZ ÇÖKEREK",cp:[{k:"心配",r:"SHINPAI",m:"Endişe, kaygı"},{k:"配達",r:"HAITATSU",m:"Teslimat"},{k:"配り手",r:"kubarite",m:"Kart dağıtıcı"}],ex:[{s:"荷物を___達した。",tr:"Paketi teslim ettim.",b:"配",br:"HI"}]},
  {n:389,ch:"倍",mn:"İki kat / Çarpan",on:["BAI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Kişi' ve fonetik unsur ('itiraz etmek, başkaldırmak' çağrışımlı) içerir. Özgün anlam 'itiraz etmek, başkaldırmak'; Tōdō 'çoğaltmak' için klasik referans verir.",mm:"😮 KİŞİ İKİ KATINI GÖRÜNCE AĞZI AÇIK AYAĞA KALKAR",cp:[{k:"五倍",r:"GOBAI",m:"Beş kat"},{k:"倍加",r:"BAIKA",m:"İkiye katlamak"},{k:"倍数",r:"BAISŪ",m:"Çarpan, kat"}],ex:[{s:"値段が二___になった。",tr:"Fiyat iki katına çıktı.",b:"倍",br:"BAI"}]},
  {n:390,ch:"箱",mn:"Kutu",on:[],kun:["hako"],or:"Geç dönem karakter (Shuowen). 'Bambu' ve 'karşılıklı' (fonetik, 'birbirine bakan' çağrışımlı) unsurlarını içerir. Özgün anlam öküz arabasının yük bölmesi; bu bölmenin kutu biçimine benzemesinden 'kutu",mm:"📦 BAMBU YANLAR KUTUDA KARŞILIKLI DURUR",cp:[{k:"小箱",r:"kobako",m:"Küçük kutu"},{k:"箱舟",r:"hakobune",m:"Sandık gemi, gemi"},{k:"箱入り",r:"hakoiri",m:"Kutuda, korunaklı"}],ex:[{s:"プレゼントを___に入れた。",tr:"Hediyeyi kutuya koydum.",b:"箱",br:"hako"}]},
  {n:391,ch:"畑",mn:"Kuru tarla",on:[],kun:["hata", "hatake"],or:"Japonya'da Çin karakterlerinin biçimsel ilkeleri temel alınarak oluşturulan sınırlı sayıdaki karakterlerden biri ('kokuji'). 'Ateş' ve 'tarla' unsurlarından oluşur; 'kolay yanan/kuruyan tarla' anlamı.",mm:"🔥 KURU TARLA KOLAYCA TUTUŞUR",cp:[{k:"茶畑",r:"CHAbatake",m:"Çay tarlası"},{k:"田畑",r:"tahata",m:"Tarla ve bahçe"},{k:"麦畑",r:"mugibatake",m:"Buğday tarlası"}],ex:[{s:"___で野菜を育てている。",tr:"Tarlada sebze yetiştiriyorum.",b:"畑",br:"hatake"}]},
  {n:392,ch:"発",mn:"Ateşlemek / Başlamak",on:["HATSU", "HOTSU"],kun:[],or:"Bronz, mühür ve geleneksel formlar. 'Yay' ve fonetik unsur (bir yay çözüldüğünde çıkan ses) içerir. 'Dışarı çıkmak, ayrılmak, başlamak' genişletilmiş anlamlardır.",mm:"🦶 İKİ KOMIK AYAK VE İKİ EĞİK BACAKLA ATEŞLEME",cp:[{k:"発表",r:"HAPPYŌ",m:"Duyuru, sunum"},{k:"発足",r:"HOSSOKU",m:"Açılış, kuruluş"},{k:"発電機",r:"HATSUDENKO",m:"Jeneratör"}],ex:[{s:"電車が___車した。",tr:"Tren hareket etti.",b:"発",br:"HATSU"}]},
  {n:393,ch:"反",mn:"Karşı koymak / Anti / Ters",on:["HAN", "TAN"],kun:["soru", "sorasu"],or:"OBI ve mühür formlar. Genel olarak 'el' ve fonetik unsur ('elleri kaldırmak, devirmek' çağrışımlı) içerir. 'Karşı koymak' genişletilmiş anlamdır.",mm:"🧗 KAYALIKLARA KARŞI DURAN EL",cp:[{k:"反応",r:"HAN'Ō",m:"Tepki, reaksiyon"},{k:"反核",r:"HANKAKU",m:"Anti-nükleer"},{k:"反物",r:"TANmono",m:"Kumaş (tekstil)"}],ex:[{s:"___対意見を言った。",tr:"Karşıt görüş söyledim.",b:"反",br:"HAN"}]},
  {n:394,ch:"坂",mn:"Eğim / Rampa",on:["HAN"],kun:["saka"],or:"Geç, Shuowen sonrası karakter. Genel olarak 'toprak/zemin' ve 'karşı koymak' (fonetik, 'eğimli' çağrışımlı) unsurlarından oluşur; 'eğimli zemin'.",mm:"⛰️ EĞIMLI ARAZIYE KARŞI KOYAN ZEMIN",cp:[{k:"急坂",r:"KYŪHAN",m:"Dik yokuş"},{k:"坂道",r:"sakamichi",m:"Yokuş"},{k:"下り坂",r:"kudarizaka",m:"İniş yokuşu"}],ex:[{s:"急な___を登った。",tr:"Dik yokuşu tırmandım.",b:"坂",br:"saka"}]},
  {n:395,ch:"板",mn:"Tahta / Levha",on:["HAN", "BAN"],kun:["ita"],or:"Mühür formunda mevcuttur; Shuowen'de yer almaz. Genel olarak 'ağaç, ahşap' ve 'karşı koymak' (fonetik, 'ince, düz' çağrışımlı) unsurlarından oluşur; 'düz tahta'.",mm:"🪵 KARŞILIKLI DURAN AHŞAP TAHTALAR",cp:[{k:"黒板",r:"KOKUBAN",m:"Kara tahta"},{k:"板紙",r:"itagami",m:"Mukavva"},{k:"板前",r:"itamae",m:"Aşçı"}],ex:[{s:"木の___でテーブルを作った。",tr:"Tahta ile masa yaptım.",b:"板",br:"ita"}]},
  {n:396,ch:"皮",mn:"Deri / Dış yüzey",on:["HI"],kun:["kawa"],or:"Bronz ve mühür formlar. 'El' ve fonetik unsur ('çıkarmak' çağrışımlı) içerir; özgün anlam 'hayvan derisini elle soymak'. Modern anlam aralığı 'hayvan derisi, deri, kürk, ten' olarak sınırlandı.",mm:"✋ EKSTRİ VURUŞLU DERILER",cp:[{k:"皮膚",r:"HIFU",m:"Ten"},{k:"皮肉",r:"HINIKU",m:"Alaycılık, ironi"},{k:"木の皮",r:"kinokawa",m:"Ağaç kabuğu"}],ex:[{s:"りんごの___をむいた。",tr:"Elmanın kabuğunu soyduk.",b:"皮",br:"kawa"}]},
  {n:397,ch:"悲",mn:"Üzgün / Hüzünlü",on:["HI"],kun:["kanashii", "kanashimu"],or:"Geç dönem karakter (Shuowen). 'Kalp, zihin' ve 'kuş kanatları, karşı koymak' (fonetik, 'üzgün, acı, keder' çağrışımlı) unsurlarını içerir. Genel anlam 'çatışan/karmaşık duygular'.",mm:"❤️ KALBİMİN KANATLARI VAR — YINE DE ÜZGÜNüm!",cp:[{k:"悲劇",r:"HIGEKI",m:"Trajedi"},{k:"悲鳴",r:"HIMEI",m:"Çığlık, ağlama sesi"},{k:"悲しみ",r:"kanashimi",m:"Keder, hüzün"}],ex:[{s:"悲しい映画を見て___しくなった。",tr:"Üzücü film izleyerek hüzünlendim.",b:"悲",br:"kana"}]},
  {n:398,ch:"美",mn:"Güzel",on:["BI"],kun:["utsukushii"],or:"OBI ve mühür formlar. 'Koyun' ve 'büyük' unsurlarını içerir; 'büyük/şişman koyun' anlamı. Bu olumlu çağrışımdan 'yemesi içmesi güzel' ve 'güzel' anlamları türedi.",mm:"🐑 GÜZEL ŞİŞMAN KOYUN",cp:[{k:"美人",r:"BIJIN",m:"Güzel kadın"},{k:"美術",r:"BIJUTSU",m:"Güzel sanatlar"},{k:"美学",r:"BIGAKU",m:"Estetik"}],ex:[{s:"___しい景色を見た。",tr:"Güzel manzara gördüm.",b:"美",br:"utsuku"}]},
  {n:399,ch:"鼻",mn:"Burun",on:["BI"],kun:["hana"],or:"OBI'de 'kendisi' anlamındaki daha basit grafik kullanılırdı. Mühür formu burun piktografı ve fonetik unsur (çıkıntı ya da 'iki şeyin bir arada' çağrışımlı) içerir.",mm:"👃 BURNU YİRMİ TARLADAN GEÇİYOR",cp:[{k:"鼻音",r:"BION",m:"Burun sesi"},{k:"鼻先",r:"hanasaki",m:"Burun ucu"},{k:"鼻薬",r:"hanagusuri",m:"Rüşvet (mecaz)"}],ex:[{s:"___をかんだ。",tr:"Burnumu sildim.",b:"鼻",br:"hana"}]},
  {n:400,ch:"筆",mn:"Yazı fırçası",on:["HITSU"],kun:["fude"],or:"OBI ve mühür formlar. Daha basit eski form yazı fırçası tutan eli gösterir; sonradan 'bambu' eklendi (fırçaların genellikle bambu sapı olduğunu yansıtır).",mm:"✍️ EL BAMBU YAZMA FIRCASINI TUTUYOR",cp:[{k:"鉛筆",r:"ENPITSU",m:"Kalem"},{k:"筆者",r:"HISSHA",m:"Yazar"},{k:"筆遣い",r:"fudezukai",m:"Hat kalemi kullanımı"}],ex:[{s:"___で字を書いた。",tr:"Kalemle yazı yazdım.",b:"筆",br:"HITSU"}]},
  {n:401,ch:"氷",mn:"Buz",on:["HYŌ"],kun:["kōri"],or:"OBI ve bronz formlar. OBI formu buzun çatlaklarını ya da düzensizliklerini tasvir eder. Bronz aşamada 'su' eklendi; Japonca standardı Tang Hanedanı'ndan itibaren yerleşti.",mm:"❄️ SUDAKI BİR ÇATLAK? — BU BUZ OLMALI",cp:[{k:"氷山",r:"HYŌZAN",m:"Buzdağı"},{k:"氷点",r:"HYŌTEN",m:"Donma noktası"},{k:"氷水",r:"kōrimizu",m:"Buzlu su"}],ex:[{s:"コップに___を入れた。",tr:"Bardağa buz koydum.",b:"氷",br:"kōri"}]},
  {n:402,ch:"表",mn:"Göstermek / Yüzey / Liste",on:["HYŌ"],kun:["omote", "arawasu"],or:"Mühür formu. 'Giysi' ve 'kürk, saç' unsurlarını içerir. 'Örtmek/kapatmak' ya da 'kürk üzerine giyilen dış giysi' anlamı verir. Ön yüzey ve göstermek genişletilmiş anlamlardır.",mm:"🧥 TUHAF EFENDİNİN GİYSİLERİ UZUN BİR LİSTEYİ GÖSTERİYOR",cp:[{k:"表面",r:"HYŌMEN",m:"Yüzey"},{k:"表現",r:"HYŌGEN",m:"Anlatım, ifade"},{k:"時刻表",r:"JIKOKUHYŌ",m:"Zaman çizelgesi"}],ex:[{s:"意見を___した。",tr:"Görüşümü ifade ettim.",b:"表",br:"HYŌ"}]},
  {n:403,ch:"秒",mn:"Saniye (zaman)",on:["BYŌ"],kun:[],or:"Geç dönem karakter (Shuowen). 'Tahıl bitkisi/hububat' ve 'az, küçük' (fonetik, 'ince, dar' ya da 'tahıl başağı' çağrışımlı) unsurlarını içerir; 'küçük' anlamından küçük zaman birimine 'saniye' anlamın",mm:"🌾 AĞIZDA BİR SANİYEDE YENİLEN AZ MİKTAR HUBUBAT",cp:[{k:"二秒",r:"NIBYŌ",m:"İki saniye"},{k:"秒針",r:"BYŌSHIN",m:"Saniye ibresi"},{k:"秒速",r:"BYŌSOKU",m:"Saniyedeki hız"}],ex:[{s:"十___後にスタートする。",tr:"On saniye sonra başlıyor.",b:"秒",br:"BYŌ"}]},
  {n:404,ch:"病",mn:"Hastalık",on:["BYŌ"],kun:["yamai", "yamu"],or:"Geç dönem karakter (Shuowen). 'Hasta yatağı' (hastalık belirleyicisi) ve fonetik unsur ('eklenmek' çağrışımlı) içerir; 'kötüleşen hastalık' anlamı verir.",mm:"🏥 ÜÇÜNCÜ KALİTE SAĞLIK HASTALIĞA GÖTÜRÜR",cp:[{k:"病気",r:"BYŌKI",m:"Hastalık"},{k:"病人",r:"BYŌNIN",m:"Hasta kişi"},{k:"黒死病",r:"KOKUSHIBYŌ",m:"Veba (kara ölüm)"}],ex:[{s:"___院に行った。",tr:"Hastaneye gittim.",b:"病",br:"BYŌ"}]},
  {n:405,ch:"品",mn:"Mal / Kalite / Tür",on:["HIN"],kun:["shina"],or:"OBI ve mühür formlar. Üç ağız unsuru içerir; 'çok konuşmak, pek çok kişi' anlamında. Yamada benzer şekilde genel bir anlam verir. Ma 'mal' anlamını ödünç kullanım olarak görür.",mm:"📦 KALİTELİ MALLARIN ÜÇ KUTUSU",cp:[{k:"商品",r:"SHŌHIN",m:"Ticari mal"},{k:"品質",r:"HINSHITSU",m:"Kalite"},{k:"品物",r:"shinamono",m:"Mal, eşya"}],ex:[{s:"この___物は高品質だ。",tr:"Bu ürün yüksek kaliteli.",b:"品",br:"SHIN"}]},
  {n:406,ch:"負",mn:"Yenilgi / Taşımak",on:["FU"],kun:["makeru", "makasu", "ou"],or:"Bronz ve mühür formlar. Genel olarak 'kişi' ve 'kabuk, para' (fonetik, 'sırt' çağrışımlı) içerir; 'birini sırtında taşımak'. Dönmek anlamından 'yenilgi' ödünç anlamdır.",mm:"🐚 YENİLEN KİŞİ KABUK PARAYI SIRTLAYARAK GİDİYOR",cp:[{k:"負傷",r:"FUSHŌ",m:"Yara"},{k:"負担",r:"FUTAN",m:"Yük, sorumluluk"},{k:"負け嫌い",r:"makegirai",m:"İnatçı, yenilgiyi kabullenemeyen"}],ex:[{s:"試合に___けた。",tr:"Maçı kaybettim.",b:"負",br:"ma"}]},
  {n:407,ch:"部",mn:"Bölüm / Kısım",on:["BU"],kun:[],or:"Geç dönem karakter (Shuowen). Sağ tarafta 'köy, yerleşim' belirleyicisi ve fonetik unsur (anlamı tartışmalı; Tōdō 'karşı koymak; bölmek' der) içerir.",mm:"🗣️ SAĞDA KÖYDE AĞZI AÇIK BÖLÜMÜN KARŞISINDA DUR",cp:[{k:"部分",r:"BUBUN",m:"Kısım, bölüm"},{k:"部長",r:"BUCHŌ",m:"Bölüm başkanı"},{k:"部屋",r:"heya",m:"Oda"}],ex:[{s:"サッカー___に入った。",tr:"Futbol kulübüne girdim.",b:"部",br:"BU"}]},
  {n:408,ch:"服",mn:"Giysi / Itaat etmek",on:["FUKU"],kun:[],or:"OBI ve mühür formlar. 'Tekne/oyulmuş kap' ve 'el' (fonetik ve anlamsal) unsurlarından oluşur. Ogawa ve Shirakawa 'diz çökmüş kişiye saldırmak' anlamını; Mizukami 'tekneye sıkı tahta bağlamak'tan 'giys",mm:"🌙 İTAATKAR EL GİYSİLERİ ASYIYE ASKI ALTINDA AYIN ALTına KOYUYOR",cp:[{k:"服装",r:"FUKUSŌ",m:"Giyim, kıyafet"},{k:"服従",r:"FUKUJŪ",m:"Teslimiyet, itaat"},{k:"服部",r:"Hattori",m:"Hattori (soyad)"}],ex:[{s:"新しい___を買った。",tr:"Yeni kıyafet satın aldım.",b:"服",br:"FUKU"}]},
  {n:409,ch:"福",mn:"İyi şans / Mutluluk",on:["FUKU"],kun:[],or:"OBI formları. İlk OBI formu 'sunak/ilah' ve 'şarap küpü dolu' piktogramını içerir. Genel anlam 'ritüelden tanrılardan alınan kutsal/uğurlu şarap'; sonradan 'tanrılardan gelen şey' ve dolayısıyla 'iyi ",mm:"⛩️ SUNAKTA TEK GİRİŞ TARLASINDA İYİ ŞANS",cp:[{k:"幸福",r:"KŌFUKU",m:"Mutluluk, saadet"},{k:"福引き",r:"FUKUbiki",m:"Piyango"},{k:"福音書",r:"FUKUINSHO",m:"İncil"}],ex:[{s:"___祉施設で働く。",tr:"Sosyal hizmet tesisinde çalışıyorum.",b:"福",br:"FUKU"}]},
  {n:410,ch:"物",mn:"Şey / Nesne",on:["BUTSU", "MOTSU"],kun:["mono"],or:"OBI ve mühür formlar. 'İnek' ve fonetik unsur (renkli fiyonklar, 'çeşitli' çağrışımlı) içerir; 'çeşitli renklerde (alacalı) inek'. Schuessler'e göre 'şey' anlamı OBI metinlerinde zaten mevcuttu.",mm:"🐄 BOYNUZLARINDA FİYONK OLAN İNEK — NE TUHAF ŞEY",cp:[{k:"人物",r:"JINBUTSU",m:"Kişi"},{k:"食物",r:"SHOKUMOTSU",m:"Yiyecek"},{k:"食べ物",r:"tabemono",m:"Yiyecek"}],ex:[{s:"買い___をした。",tr:"Alışveriş yaptım.",b:"物",br:"MONO"}]},
  {n:411,ch:"平",mn:"Düz / Eşit / Sakin",on:["HEI", "BYŌ"],kun:["taira", "hiratai"],or:"OBI ve bronz formlar. Alt iki çizgi su bitkisini gösterir. Yamada eğri biçiminin köksüzlüğü ve yüzmesini belirtir; bronz aşamada üst yatay çizgi eklendi. 'Sakin' daha da genişletilmiş anlamdır.",mm:"⚖️ TERAZILER DÜZ VE EŞITtir",cp:[{k:"平気",r:"HEIKI",m:"Sakinlik, soğukkanlılık"},{k:"平等",r:"BYŌDŌ",m:"Eşitlik"},{k:"平手",r:"hirate",m:"Avuç"}],ex:[{s:"___和な世界を願う。",tr:"Barışçıl bir dünya diliyorum.",b:"平",br:"HEI"}]},
  {n:412,ch:"返",mn:"Geri dönmek",on:["HEN"],kun:["kaesu", "kaeru"],or:"Bronz ve mühür formlar. 'Gitmek, yürümek' ve 'karşı koymak' (fonetik, 'dönmek, tersine gitmek' çağrışımlı) unsurlarını içerir.",mm:"↩️ HAREKETİ TERSINE ÇEVİR VE GERi DÖN",cp:[{k:"返事",r:"HENJI",m:"Yanıt, cevap"},{k:"返済",r:"HENSAI",m:"Geri ödeme"},{k:"仕返し",r:"shikaeshi",m:"Misilleme"}],ex:[{s:"本を図書館に___した。",tr:"Kitabı kütüphaneye iade ettim.",b:"返",br:"kae"}]},
  {n:413,ch:"勉",mn:"Çabalamak / Çalışmak",on:["BEN"],kun:[],or:"Geç dönem karakter (Shuowen). 'Güç, kuvvet' ve fonetik unsur (orijinal anlam 'doğum yapma çabası gösteren kadın') içerir. Tōdō 'büyük çabayla çıkarmak/üretmek' kelime ailesine dahil eder.",mm:"💪 KAÇMAK İÇİN GÜÇLE ÇABALA",cp:[{k:"勉強",r:"BENKYŌ",m:"Çalışmak, ders çalışmak"},{k:"勤勉",r:"KINBEN",m:"Çalışkanlık, gayret"},{k:"勉学",r:"BENGAKU",m:"Öğrenim, çalışma"}],ex:[{s:"___強のために図書館へ行く。",tr:"Ders çalışmak için kütüphaneye gidiyorum.",b:"勉",br:"BEN"}]},
  {n:414,ch:"放",mn:"Serbest bırakmak / Yaymak",on:["HŌ"],kun:["hanasu", "hanatsu"],or:"Bronz formlar. 'Sopayla vurmak' ve sol taraf (fonetik, 'serbest bırakmak, uzatmak' çağrışımlı) unsurlarını içerir. Genel anlam 'sopayla vurmak ve kovalamak'.",mm:"👊 BİRİNİ DÖVMEK BAZI KİŞİLER İÇİN BİR SERBEST BIRAKIŞ BİÇİMİDİR",cp:[{k:"解放",r:"KAIHŌ",m:"Kurtuluş, özgürleşme"},{k:"放射",r:"HŌSHA",m:"Radyasyon"},{k:"手放す",r:"tebanasu",m:"Bırakmak, serbest bırakmak"}],ex:[{s:"風船を空に___した。",tr:"Balonu gökyüzüne bıraktım.",b:"放",br:"hana"}]},
  {n:415,ch:"味",mn:"Tat / Zevk",on:["MI"],kun:["aji", "ajiwau"],or:"Geç dönem karakter (Shuowen). 'Ağız' ve fonetik unsur ('lezzetli' ya da 'iyi' çağrışımlı) içerir; 'tat, lezzet'. Bir özellik ya da niteliği ifade etmek için de kullanılır.",mm:"👄 TAT HENÜZ AĞIZA GELMEDİ",cp:[{k:"意味",r:"IMI",m:"Anlam"},{k:"興味",r:"KYŌMI",m:"İlgi, merak"},{k:"味見",r:"ajimi",m:"Tadımla"}],ex:[{s:"この料理はどんな___がしますか？",tr:"Bu yemek nasıl bir tat?",b:"味",br:"aji"}]},
  {n:416,ch:"命",mn:"Yaşam / Emir",on:["MEI", "MYŌ"],kun:["inochi"],or:"Bronz ve mühür formlar. 'Diz çökmüş kişi' ve fonetik unsur ('yüksek sesle bağırmak' çağrışımlı) ile 'ağız, konuşmak' içerir; 'diz çöken kişiye emir vermek'. 'Kader' ve 'yaşam' genişletilmiş anlamlardı",mm:"🗣️ YAŞAM BİR SÖZEL EMİRE BAĞLI OLABİLİR",cp:[{k:"命令",r:"MEIREI",m:"Emir, komut"},{k:"生命",r:"SEIMEI",m:"Yaşam, hayat"},{k:"命取り",r:"inochitori",m:"Ölümcül"}],ex:[{s:"___がけで助けた。",tr:"Canını feda ederek kurtardı.",b:"命",br:"inochi"}]},
  {n:417,ch:"面",mn:"Yüz / Görünüm / Maske",on:["MEN"],kun:["omo", "omote", "tsura"],or:"OBI, bronz ve mühür formlar. Yorumlar değişir. Yüzün önünde bir çizgi (yüz yüzeyi) ya da maske olarak yorumlanır. 'Yüz' ve 'görünüm' genişletilmiş anlamlardır.",mm:"🎭 ORTASINDA BÜYÜK GÖZ VE DÜZ ÜSTÜ OLAN YÜZ MASKESİ",cp:[{k:"外面",r:"GAIMEN",m:"Dış yüzey"},{k:"面白い",r:"omoshiroi",m:"İlginç, eğlenceli"},{k:"鼻面",r:"hanazura",m:"Yüz yüzeyi, buhun yakını"}],ex:[{s:"___接を受けた。",tr:"Mülakat oldum.",b:"面",br:"MEN"}]},
  {n:418,ch:"問",mn:"Sormak",on:["MON"],kun:["tou"],or:"OBI ve mühür formlar. 'Ağız' (konuşmak/çağırmak) ve 'kapı/geçit' (fonetik, 'saldırgan biçimde soru sormak' çağrışımlı) unsurlarını içerir; sonradan genel 'sormak' anlamını kazandı.",mm:"🚪 KAPIYA ÇAĞIRAN KİŞİYİ SOR",cp:[{k:"質問",r:"SHITSUMON",m:"Soru"},{k:"学問",r:"GAKUMON",m:"Öğrenme, bilim"},{k:"問屋",r:"toiya",m:"Toptancı"}],ex:[{s:"難しい___題を解いた。",tr:"Zor soruyu çözdüm.",b:"問",br:"MON"}]},
  {n:419,ch:"役",mn:"Rol / Hizmet / Görev",on:["YAKU", "EKI"],kun:[],or:"OBI, bronz ve mühür formlar. Genellikle 'gitmek/yürümek' ve 'büyük sopayla gitmek' içerir; 'sopayla çevresini dolaşmak'. OBI ve bronz formlarda iki kişi ya da diz çökmüş kişi mevcuttur.",mm:"🪄 GÖREVİNİ YAPMAK İÇİN ELİNDE SOPAYLA YOL AL",cp:[{k:"役人",r:"YAKUNIN",m:"Görevli, memur"},{k:"役者",r:"YAKUSHA",m:"Aktör"},{k:"兵役",r:"HEIEKI",m:"Askerlik hizmeti"}],ex:[{s:"市___所で手続きをした。",tr:"Belediyede işlem yaptım.",b:"役",br:"YAKU"}]},
  {n:420,ch:"薬",mn:"İlaç / İlaca ilişkin",on:["YAKU"],kun:["kusuri"],or:"Bronz, mühür ve geleneksel formlar. 'Bitki/çimen' ve fonetik unsur (orijinal anlam meşe ağacı ya da müzik aleti; 'iyileştirmek, tedavi etmek' çağrışımlı) içerir.",mm:"🌿 ŞİFALI BİTKİ ZEVk VERİR",cp:[{k:"薬局",r:"YAKKYOKU",m:"Eczane"},{k:"火薬",r:"KAYAKU",m:"Barut"},{k:"薬指",r:"kusuriyubi",m:"Yüzük parmağı"}],ex:[{s:"___局で薬を買った。",tr:"Eczaneden ilaç aldım.",b:"薬",br:"kusuri"}]},
  {n:421,ch:"由",mn:"Neden / Vasıta / Yol / Den",on:["YU", "YŪ"],kun:["yoshi"],or:"Mühür formu. Etimoloji tartışmalı. Katō ve Yamada bunu şarap yapımında sıvı sıkan sepet/çanta olarak yorumlar. Shirakawa küçük boyunlu şarap küpü olarak görür. 'Nedenden' gibi soyut anlamlar ödünç kul",mm:"🌾 TARLADA MATKAP İÇİN BİR NEDEN VAR",cp:[{k:"由来",r:"YURAI",m:"Köken, türeyiş"},{k:"理由",r:"RIYŪ",m:"Neden, gerekçe"},{k:"自由",r:"JIYŪ",m:"Özgürlük"}],ex:[{s:"理___を説明した。",tr:"Sebebini açıkladım.",b:"由",br:"YU"}]},
  {n:422,ch:"油",mn:"Yağ",on:["YU"],kun:["abura"],or:"OBI ve mühür formlar. Etimoloji tartışmalı. Yamada OBI formları listeler; 'su/sıvı' ve fonetik unsur (özgün olarak nehir adı) içerir. 'Yağ' ödünç anlamdır.",mm:"🌾 TARLADA YİYECEK SIVISI YAĞDIR",cp:[{k:"油田",r:"YUDEN",m:"Petrol sahası"},{k:"灯油",r:"TŌYU",m:"Gazyağı"},{k:"油絵",r:"aburaE",m:"Yağlıboya resim"}],ex:[{s:"サラダに___をかけた。",tr:"Salataya yağ döktüm.",b:"油",br:"abura"}]},
  {n:423,ch:"有",mn:"Sahip olmak / Var olmak",on:["YŪ", "U"],kun:["aru"],or:"OBI ve bronz formlar. Mizukami, Katō ve Yamada bronz formu 'et/beden' ve 'el' olarak yorumlar; 'elde eti tutmak' ya da 'elde tutmak'. OBI formları daha karmaşıktır.",mm:"🥩 VAR OLMAK ELİNDE ET TUTMAYA BAĞLIDIR",cp:[{k:"所有者",r:"SHOYŪSHA",m:"Sahip"},{k:"有無",r:"UMU",m:"Var olma"},{k:"有効",r:"YŪKŌ",m:"Geçerli"}],ex:[{s:"___名な場所を訪れた。",tr:"Ünlü bir yeri ziyaret ettim.",b:"有",br:"YŪ"}]},
