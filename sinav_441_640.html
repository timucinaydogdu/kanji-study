<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Büyük Sınav — Kanji #441–640</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#e8e8e7;--text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--p50:#EEEDFE;--p200:#AFA9EC;--p600:#534AB7;--p800:#3C3489;--p900:#26215C;--t50:#E1F5EE;--t400:#1D9E75;--t600:#0F6E56;--t800:#085041;--a50:#FAEEDA;--a600:#BA7517;--a800:#633806;--a900:#412402;--r50:#FCEBEB;--r600:#A32D2D;--r800:#501313;--rm:8px;--rl:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#242422;--bg3:#2e2e2c;--text:#f0f0ee;--text2:#b0b0ae;--text3:#707070;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);--p50:#26215C;--p200:#3C3489;--p600:#AFA9EC;--p800:#CECBF6;--p900:#EEEDFE;--t50:#04342C;--t600:#9FE1CB;--t800:#9FE1CB;--a50:#412402;--a800:#FAC775;--a900:#FAC775;--r50:#501313;--r600:#F09595;--r800:#FCEBEB;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg3);min-height:100vh;padding:2rem 1rem;}
.app{width:100%;max-width:680px;margin:0 auto;}
a.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);text-decoration:none;margin-bottom:1.25rem;}
a.back:hover{color:var(--text);}
.hero{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.5rem;margin-bottom:1.5rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.hero-chars{font-family:'Noto Serif JP',serif;font-size:28px;color:var(--p900);letter-spacing:6px;margin-bottom:8px;}
.hero-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px;}
.hero-sub{font-size:13px;color:var(--text2);margin-bottom:1rem;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hstat{background:var(--bg2);border-radius:var(--rm);padding:10px 8px;text-align:center;}
.hstat-val{font-size:20px;font-weight:600;color:var(--p800);}
.hstat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.start-btn{margin-top:1.25rem;width:100%;padding:14px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.start-btn:hover{background:var(--p800);}
/* TEST */
.twrap{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.thead{background:var(--a50);border-bottom:0.5px solid var(--a600);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.ttitle{font-size:14px;font-weight:500;color:var(--a900);}
.tscore{font-size:13px;color:var(--a800);}
.pstrip{height:5px;background:var(--bg2);}
.pstrip-fill{height:100%;background:linear-gradient(90deg,var(--p600),var(--t400));transition:width 0.4s;}
.tbody{padding:1.5rem;}
.tqlabel{display:inline-block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;padding:3px 10px;border-radius:20px;margin-bottom:12px;}
.tlc{background:var(--p50);color:var(--p800);}
.tlm{background:var(--t50);color:var(--t800);}
.tlr{background:var(--a50);color:var(--a800);}
.tq{font-size:15px;color:var(--text);line-height:1.6;}
.tchar{font-family:'Noto Serif JP',serif;font-size:72px;font-weight:700;color:var(--p900);text-align:center;margin:0.75rem 0 1rem;display:block;}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1.25rem;}
.topt{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--rm);padding:13px 16px;font-size:14px;cursor:pointer;color:var(--text);text-align:left;font-family:inherit;transition:background 0.15s;line-height:1.4;}
.topt:hover:not(:disabled){background:var(--p50);border-color:var(--p200);}
.topt.correct{background:var(--t50);border-color:var(--t400);color:var(--t800);font-weight:500;}
.topt.wrong{background:var(--r50);border-color:var(--r600);color:var(--r800);}
.tfb{margin-top:1rem;padding:10px 14px;border-radius:var(--rm);font-size:13px;line-height:1.5;display:none;}
.tfb.show{display:block;}
.tfb.ok{background:var(--t50);color:var(--t800);border-left:2px solid var(--t400);}
.tfb.bad{background:var(--r50);color:var(--r800);border-left:2px solid var(--r600);}
.tnext{margin-top:1.25rem;width:100%;padding:12px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:none;}
.tnext:hover{background:var(--p800);}
.tnext.show{display:block;}
/* RESULT */
.rwrap{padding:2rem 1.5rem;}
.r-top{text-align:center;margin-bottom:1.5rem;}
.remoji{font-size:52px;margin-bottom:0.75rem;}
.rscore{font-size:42px;font-weight:600;color:var(--p800);margin-bottom:0.25rem;}
.rlabel{font-size:16px;color:var(--text2);margin-bottom:1.5rem;}
.rbdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem;}
.rbc{background:var(--bg2);border-radius:var(--rm);padding:12px 8px;text-align:center;}
.rbv{font-size:24px;font-weight:600;}
.rbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.rg{color:var(--t600);}.rr{color:var(--r600);}.rgr{color:var(--text3);}
.tsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.5rem;}
.tsc{background:var(--bg2);border-radius:var(--rm);padding:10px 12px;}
.tsl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.tsv{font-size:15px;font-weight:500;color:var(--text);}
.slabel{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--text3);}
.btn-row{display:flex;gap:8px;margin-bottom:1.5rem;}
.rbtn{flex:1;padding:12px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
.rbtn:hover{background:var(--p800);}
.rbtn.sec{background:var(--bg2);color:var(--text);border:0.5px solid var(--border2);}
.wrong-list{margin-top:1.25rem;border-top:0.5px solid var(--border);padding-top:1.25rem;}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.wchar{font-family:'Noto Serif JP',serif;font-size:28px;font-weight:700;min-width:40px;color:var(--text);}
.winfo{flex:1;}
.wmean{font-size:13px;color:var(--text);font-weight:500;}
.wqtype{font-size:11px;color:var(--text2);margin-top:1px;}
.wanswers{font-size:12px;margin-top:3px;}
.wgiven{color:var(--r600);}
.wcorrect{color:var(--t600);}
</style>
</head>

  {n:456,ch:"課",mn:"Bölüm / Ders / Vergi",on:["KA"],kun:[],or:"Geç dönem karakter (Shuowen). 'Kelimeler/konuşma' ve 'meyve/sonuç' (fonetik, 'değerlendirmek' ya da 'bölmek' çağrışımlı) içerir. Ogawa'nın yorumunda 'işi bölmek' anlamından 'bölüm, ders, vergi' türer.",mm:"🍎 MEYVELİ BİR DERS SÖZLERLE",cp:[{k:"課税",r:"KAZEI",m:"Vergilendirme"},{k:"課長",r:"KACHŌ",m:"Bölüm başkanı"},{k:"第二課",r:"DANIKA",m:"İkinci ders"}],ex:[{s:"宿___をやった。",tr:"Ödevi yaptım.",b:"課",br:"KA"}]},
  {n:457,ch:"芽",mn:"Tomurcuk / Filiz",on:["GA"],kun:["me"],or:"OBI ve mühür formlar. 'Bitki' ve 'diş, azı dişi' (fonetik, 'iç içe geçmiş, dolanmış' çağrışımlı) içerir; 'diş gibi filiz, tomurcuk'. Ogawa 'çıkıntı yapmak, fırlamak' çağrışımını önerir.",mm:"🌿 BİTKİ DİŞ GİBİ TOMURCUKLAR ÇIKARIYOR",cp:[{k:"発芽",r:"HATSU GA",m:"Çimlenme, filizlenme"},{k:"新芽",r:"SHINme",m:"Tomurcuk, filiz"},{k:"芽生える",r:"mebaeru",m:"Filizlenmek, tomurcuklanmak"}],ex:[{s:"春になると___が出る。",tr:"İlkbaharda tomurcuklar çıkar.",b:"芽",br:"me"}]},
  {n:458,ch:"改",mn:"Reform / Değiştirmek",on:["KAI"],kun:["aratameru", "aratamaru"],or:"OBI ve mühür formlar. 'Sopayla vurmak' ve sol taraf (yılan ya da kendisi fonetik olarak) içerir. Japonca yorumda 'şeytanı kovmak' ritüelinden 'reform' anlamına gelir.",mm:"🐍 REFORMU SAĞLAMAK İÇİN YILANI DÖV",cp:[{k:"改革",r:"KAIKAKU",m:"Reform, yenileşme"},{k:"改正",r:"KAISEI",m:"Değişiklik, düzeltme"},{k:"改めて",r:"aratamete",m:"Bir kez daha, resmi olarak"}],ex:[{s:"計画を___めた。",tr:"Planı revize ettim.",b:"改",br:"arata"}]},
  {n:459,ch:"械",mn:"Makine / Araç",on:["KAI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Ağaç/odun' ve fonetik unsur ('uyarmak, azar' anlamında) içerir; 'uyarmak için kullanılan ahşap araç' ve dolayısıyla kelepçe. Genişletilmiş anlamla 'makine, araç'.",mm:"⚔️ İKİ ELLİ AHŞAP MIZRAK KULLANIŞLI BİR ARAÇTIR",cp:[{k:"機械",r:"KIKAI",m:"Makine, aygıt"},{k:"機械化",r:"KIKAIKA",m:"Mekanizasyon"},{k:"器械",r:"KIKAI",m:"Alet"}],ex:[{s:"機___の使い方を覚えた。",tr:"Makinenin kullanımını öğrendim.",b:"械",br:"KAI"}]},
  {n:460,ch:"害",mn:"Zarar / Hasar",on:["GAI"],kun:[],or:"Bronz ve mühür formlar. Bronz form ters çevrilmiş sepet ve 'kafatası' (fonetik) olarak yorumlanır. 'Örtmek ve engellemek' ya da 'başı örtmek' genel anlamı verir. 'Zarar, hasar' ödünç anlamdır.",mm:"🤐 CANLI AĞZI ÖRTMEK ZARAR VEREBİLİR",cp:[{k:"損害",r:"SONGAI",m:"Hasar, kayıp"},{k:"殺害",r:"SATSUGAI",m:"Cinayet"},{k:"妨害",r:"BŌGAI",m:"Engelleme, aksaklık"}],ex:[{s:"台風が___をもたらした。",tr:"Tayfun zarar getirdi.",b:"害",br:"GAI"}]},
  {n:461,ch:"街",mn:"Yol / Kasaba / Alan",on:["GAI", "KAI"],kun:["machi"],or:"Geç dönem karakter (Shuowen). 'Gitmek/kavşak' ve fonetik unsur (tarla köşesi; tarihsel olarak 'çatallanmak' ya da 'birleşmek' anlamı) içerir. 'Birleşen yollar' anlamından 'kasaba, alan' gelişti.",mm:"🏙️ KAVŞAKTAKI YERLEŞİK KASABADA TOPRAK YIĞILMIŞ",cp:[{k:"市街",r:"SHIGAI",m:"Kasaba, şehir"},{k:"街道",r:"KAIDŌ",m:"Anayol, cadde"},{k:"街頭",r:"GAITŌ",m:"Sokak"}],ex:[{s:"___を散歩した。",tr:"Şehirde yürüyüş yaptım.",b:"街",br:"machi"}]},
  {n:462,ch:"各",mn:"Her / Her biri",on:["KAKU"],kun:["ono-ono"],or:"OBI ve mühür formlar. 'İnen ayak' ve 'ağız/giriş' (fonetik, 'yüksek bir yerden inmek' çağrışımlı) içerir. 'Her biri' ödünç anlamdır. Shirakawa 'tanrıların ruhlarının yukarıdan inmesi' yorumunu önerir.",mm:"👣 HERBİRİMİZ AĞZIMIZA AYAK KOYMUŞUZDUR",cp:[{k:"各駅",r:"KAKUEKI",m:"Her istasyon"},{k:"各国",r:"KAKKOKU",m:"Her ülke"},{k:"各自",r:"KAKUJI",m:"Her biri, ayrı ayrı"}],ex:[{s:"___自が意見を述べた。",tr:"Herkes görüşünü söyledi.",b:"各",br:"KAKU"}]},
  {n:463,ch:"覚",mn:"Hatırlamak / Uyanmak",on:["KAKU"],kun:["oboeru", "sameru", "mezameru"],or:"Geç dönem karakter (Shuowen). 'Görmek' ve fonetik unsur (evin çatısını bağlayan eller; 'açık, net' çağrışımlı) içerir; 'gözlerin önünde netleşmek'. Genişletilmiş anlamlar 'anlamak, hatırlamak, uyanmak",mm:"🏠 UYANDIKTAN SONRA SÜSLEMLİ ÇATIYI HATIRLARSAM GÜZEL",cp:[{k:"自覚",r:"JIKAKU",m:"Öz farkındalık"},{k:"目覚め",r:"mezame",m:"Uyanış"},{k:"覚え書き",r:"oboegaki",m:"Not, memorandum"}],ex:[{s:"単語を___えた。",tr:"Kelimeyi ezberledim.",b:"覚",br:"obo"}]},
  {n:464,ch:"完",mn:"Tam / Tamamlamak",on:["KAN"],kun:[],or:"Geç dönem karakter (Shuowen). 'Çatı, ev' ve 'kaynak, kök' (fonetik, 'çit, duvar' çağrışımlı) içerir; 'evi tamamen çevreleyen çit/duvar'. Genişletilmiş anlam 'tamamen çevreleyen' ve dolayısıyla 'tam, e",mm:"🏠 TAMAMEN ÖZGÜN ÇATI",cp:[{k:"完成",r:"KANSEI",m:"Tamamlanma"},{k:"未完",r:"MIKAN",m:"Tamamlanmamış"},{k:"完全",r:"KANZEN",m:"Mükemmel, tam"}],ex:[{s:"仕事が___成した。",tr:"İş tamamlandı.",b:"完",br:"KAN"}]},
  {n:465,ch:"官",mn:"Hükümet / Yetkili",on:["KAN"],kun:[],or:"OBI ve mühür formlar. 'Çatı, ev' ve 'kalça' (fonetik, 'çalışmak' çağrışımlı) içerir; 'birinin çalıştığı bina'. Oturarak yapılan büro işini ima eder; dolayısıyla 'hükümet ofisi, yetkili'.",mm:"🪑 HÜKÜMETTEKİ YETKİLİ BİNADA OTURURKEN ÇALIŞIYOR",cp:[{k:"警官",r:"KEIKAN",m:"Polis memuru"},{k:"官僚",r:"KANRYŌ",m:"Bürokrasi"},{k:"官庁",r:"KANCHŌ",m:"Hükümet ofisi"}],ex:[{s:"政府の___僚と話した。",tr:"Hükümet yetkilisiyle konuştum.",b:"官",br:"KAN"}]},
  {n:466,ch:"管",mn:"Boru / Kontrol etmek",on:["KAN"],kun:["kuda"],or:"Geç dönem karakter (Shuowen). 'Bambu' ve 'yetkili bulunan bina' (fonetik, 'delmek, nüfuz etmek' çağrışımlı) içerir; 'delinmiş bambu borusu'. Ayrıca 'üflemeli müzik aleti'. 'Kontrol' genişletilmiş anla",mm:"🎵 YETKİLİ TARAFINDAN KONTROL EDİLEN BAMBU BORU",cp:[{k:"管理",r:"KANRI",m:"Yönetim, kontrol"},{k:"気管",r:"KIKAN",m:"Nefes borusu"},{k:"管理",r:"KANRI",m:"Yönetim"}],ex:[{s:"水道___が壊れた。",tr:"Su borusu bozuldu.",b:"管",br:"KAN"}]},
  {n:467,ch:"関",mn:"Bariyer / Bağlantı",on:["KAN"],kun:["seki"],or:"Bronz, mühür ve geleneksel formlar. 'Çift kapı' ve fonetik unsur (tezgahtaki mekik; 'yana döndürmek' ya da 'delmek' çağrışımlı) içerir; 'kapıyı yandan sürgüyle kapatmak'. 'Bağlantı' genişletilmiş anla",mm:"⛪ CENNETIN KAPILARI BİR BARİYERDİR — GÖNDERİLDİ",cp:[{k:"関東",r:"KANTŌ",m:"Kanto bölgesi"},{k:"関心",r:"KANSHIN",m:"İlgi, alaka"},{k:"関の山",r:"sekinoyama",m:"Birinin azami çabası"}],ex:[{s:"駅の___係者に聞いた。",tr:"İstasyon görevlisine sordum.",b:"関",br:"KAN"}]},
  {n:468,ch:"観",mn:"Gözlemlemek / İzlemek",on:["KAN"],kun:[],or:"Mühür ve geleneksel formlar. '(Gözle) görmek' ve fonetik unsur (tepeli kuş; 'dönmek, çevresine bakmak' çağrışımlı) içerir; 'her tarafa bakmak'. 'Gözlemek, seyretmek' temel anlamlardır.",mm:"🐦 KUŞ İZLEYİCİ TEPELI KUŞU GÖZLEMLIYOR",cp:[{k:"観光",r:"KANKŌ",m:"Turizm, gezi"},{k:"観察",r:"KANSATSU",m:"Gözlem"},{k:"観客",r:"KANKYAKU",m:"Seyirci"}],ex:[{s:"景___を楽しんだ。",tr:"Manzaranın tadını çıkardım.",b:"観",br:"KAN"}]},
  {n:469,ch:"願",mn:"Dilek / İstek",on:["GAN"],kun:["negau"],or:"Geç dönem karakter (Shuowen). 'Baş' ve fonetik unsur ('ovacık/düzlük'; 'büyük' çağrışımlı) içerir; 'büyük baş'. 'Dilek, istek' ödünç anlamdır.",mm:"🌄 AÇIK OVADA BAŞIMI YATIRMAK İSTİYORUM",cp:[{k:"志願者",r:"SHIGANSHA",m:"Başvurucu, aday"},{k:"願望的",r:"GANBŌTEKI",m:"Hevesli, arzulu"},{k:"願い事",r:"negaigoto",m:"Dua, dilek"}],ex:[{s:"お___いがあります。",tr:"Bir ricam var.",b:"願",br:"nega"}]},
  {n:470,ch:"希",mn:"Arzu / Nadir",on:["KI", "KE"],kun:[],or:"Bronz ve mühür formlar. İşlemeli kumaş ve dolanmış iplikler içerir. Yamada 'nadir' anlamını, Ogawa ise 'ince dokuma' ve dolayısıyla 'son derece küçük; nadir' anlamını ödünç kullanım olarak görür.",mm:"🧵 İÇ İÇE GEÇMİŞ KUMAŞ İPLİKLERİ ARZULANIR AMA NADİRDİR",cp:[{k:"希望",r:"KIBŌ",m:"Umut, istek"},{k:"希求",r:"KIKYŪ",m:"Arzu, istek"},{k:"希薄",r:"KIHAKU",m:"İnce, seyrek"}],ex:[{s:"___望を持って前に進む。",tr:"Umutla ilerleyeceğim.",b:"希",br:"KI"}]},
  {n:471,ch:"季",mn:"Mevsim / Genç",on:["KI"],kun:[],or:"OBI ve mühür formlar. 'Tahıl bitkisi' ve 'çocuk' (anlamsal ve fonetik, 'genç' çağrışımlı) içerir; 'genç tahıl' anlamı verir. 'Mevsim' anlamı tahıl yetiştirme süresinden (üç ay) türemişir.",mm:"🌾 MEVSİMDE TAHIL BİTKİLERİ GENÇ ÇOCUKLAR GİBİ BÜYÜR",cp:[{k:"季節",r:"KISETSU",m:"Mevsim"},{k:"四季",r:"SHIKI",m:"Dört mevsim"},{k:"季刊",r:"KIKAN",m:"Üç aylık yayın"}],ex:[{s:"四___節それぞれが美しい。",tr:"Dört mevsimin her biri güzel.",b:"季",br:"KI"}]},
  {n:472,ch:"紀",mn:"Kronik / Başlangıç",on:["KI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Kendisi' ('iplik uzunluğu'; başlangıcı ima eder) ve 'iplik' belirleyicisi içerir. Yamada da fonetik rol üstlenir; 'başlangıç' buradan türer. 'Kronik, kayıt' ödünç ya da ",mm:"🧵 BAŞLANGICIN KRONIGI KENDİNDEN İPLİKLERLE BAŞLAR",cp:[{k:"紀元",r:"KIGEN",m:"Epoch, çağ"},{k:"紀行",r:"KIKŌ",m:"Seyahat yazısı"},{k:"五世紀",r:"GOSEIKI",m:"Beşinci yüzyıl"}],ex:[{s:"二十一世___が始まった。",tr:"Yirmi birinci yüzyıl başladı.",b:"紀",br:"KI"}]},
  {n:473,ch:"喜",mn:"Sevinmek / Mutlu",on:["KI"],kun:["yorokobu"],or:"OBI ve mühür formlar. Genellikle 'ağız' ve fonetik unsur (toprağın içinden yeni fışkıran bitkiler; 'ağza koymak' çağrışımlı) içerir. Ogawa büyük davulu müzik aleti sehpasında görür; 'müzik çalmak ve z",mm:"😋 AĞIZDA ON FASULYE OLMAK MUTLULUKTUR",cp:[{k:"喜劇",r:"KIGEKI",m:"Komedi"},{k:"歓喜",r:"KANKI",m:"Neşe, sevinç"},{k:"大喜び",r:"ōyorokobi",m:"Büyük sevinç"}],ex:[{s:"良い知らせに___んだ。",tr:"İyi habere sevindim.",b:"喜",br:"yoroko"}]},
  {n:474,ch:"旗",mn:"Bayrak",on:["KI"],kun:["hata"],or:"Geç dönem karakter (Shuowen). 'Bayrak direği ve dalgalanan afiş' ve fonetik unsur ('savurma sepeti'; 'bir araya toplamak' çağrışımlı) içerir; 'birliklerin altında toplandığı bayrak'.",mm:"🚩 SAVURMA SEPETİNİN YANINDA KİŞİ BAYRAK TUTUYOR",cp:[{k:"国旗",r:"KOKKI",m:"Ulusal bayrak"},{k:"旗持ち",r:"hatamochi",m:"Bayrak taşıyıcı"},{k:"旗魚",r:"kajiki",m:"Kılıçbalığı"}],ex:[{s:"国の___を高く掲げた。",tr:"Ülkenin bayrağını yükseğe astı.",b:"旗",br:"hata"}]},
  {n:475,ch:"器",mn:"Kap / Alet / Yetenek",on:["KI"],kun:["utsuwa"],or:"Bronz, mühür ve geleneksel formlar. 'Köpek' ve 'çok ağız' (ayrıca fonetik; 'nefes' çağrışımlı) içerir; 'yazın sıcakta ağzı açık nefes alan köpek'. 'Kap(lar)' genişletilmiş anlamdır.",mm:"📦 DÖRT BÜYÜK KUTU GİBİ KAPLARIN FAYDALI ALETLER",cp:[{k:"器具",r:"KIGU",m:"Alet, gereç"},{k:"食器",r:"SHOKKI",m:"Sofra takımı"},{k:"器用",r:"KIYŌ",m:"Beceri, maharet"}],ex:[{s:"食___を洗った。",tr:"Bulaşıkları yıkadım.",b:"器",br:"utsuwa"}]},
  {n:476,ch:"機",mn:"Dokuma tezgahı / Makine / Fırsat",on:["KI"],kun:["hata"],or:"Bronz ve mühür formlar. 'Ağaç/odun' ve fonetik unsur (dikey tezgah ipliğini kontrol eden mekanizma) içerir. Tōdō 'minik mekanik aygıt' olarak değerlendirir. 'Fırsat' genişletilmiş anlamdır.",mm:"🕸️ KAÇ KEZ AHŞAP DOKUMA TEZGAHI KULLANILIR?",cp:[{k:"機能",r:"KINŌ",m:"İşlev, fonksiyon"},{k:"機会",r:"KIKAI",m:"Fırsat, imkan"},{k:"機織り",r:"hataori",m:"Dokuma"}],ex:[{s:"洗濯___を回した。",tr:"Çamaşır makinesini çalıştırdım.",b:"機",br:"KI"}]},
  {n:477,ch:"議",mn:"Tartışma / Görüşme",on:["GI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Kelimeler/konuşma' ve fonetik unsur ('güzel dans ya da görünüm'; 'eleştirmek' ya da 'doğru' çağrışımlı) içerir; 'tartışmak' genel anlamı verir.",mm:"🗣️ TARTIŞMADA ADIL SÖZLER GEREKİR",cp:[{k:"議論",r:"GIRON",m:"Tartışma, müzakere"},{k:"会議",r:"KAIGI",m:"Konferans, toplantı"},{k:"議会",r:"GIKAI",m:"Meclis, parlamento"}],ex:[{s:"会___で決定した。",tr:"Toplantıda karar verildi.",b:"議",br:"GI"}]},
  {n:478,ch:"求",mn:"İstemek / Aramak",on:["KYŪ"],kun:["motomeru"],or:"OBI, bronz ve mühür formlar. Kürkten yapılmış bir giysinin (daha sonra 444 'giysi' ile yazılan) piktogramına dayanır. 'Aramak' ödünç anlamdır.",mm:"💧 BENEKLI KÜRK ARAMAK İÇİN SUYU GEÇ",cp:[{k:"要求",r:"YŌKYŪ",m:"Talep, istek"},{k:"追求",r:"TSUIKYŪ",m:"Arayış, takip"},{k:"求職",r:"KYŪSHOKU",m:"İş arama"}],ex:[{s:"助けを___めた。",tr:"Yardım istedim.",b:"求",br:"moto"}]},
  {n:479,ch:"泣",mn:"Ağlamak",on:["KYŪ"],kun:["naku"],or:"OBI ve mühür formlar. OBI ve ilk mühür formu 'göz' ve 'su/sıvı' (göz yaşları) içerir. İkinci mühür form 'su/sıvı' ve 'ayakta durmak' içerir; Tōdō 'hıçkıra hıçkıra ağlamak' yorumunu yapar.",mm:"💧 AYAKTA DURURKEN SULU GÖZYAŞLARI",cp:[{k:"泣訴",r:"KYŪSO",m:"Yalvarmak, y懇etmek"},{k:"泣き虫",r:"nakimushi",m:"Ağlayan çocuk"},{k:"泣き出す",r:"nakidasu",m:"Ağlamaya başlamak"}],ex:[{s:"悲しくて___いた。",tr:"Üzülüp ağladım.",b:"泣",br:"na"}]},
  {n:480,ch:"救",mn:"Kurtarmak / Kefaret",on:["KYŪ"],kun:["sukuu"],or:"Bronz ve mühür formlar. 'Sopayla vurmak' ve 'kürk giysi' (fonetik, 'durmak, dinlenmek' çağrışımlı; özgün anlam 'istemek') içerir; 'durdurmak'. 'Yardım' ödünç anlamdır.",mm:"🏹 DÖVÜLMEK — KURTARMA TALEP ET",cp:[{k:"救命浮輪",r:"KYŪMEIBU I",m:"Can simidi"},{k:"救援",r:"KYŪEN",m:"Kurtarma, yardım"},{k:"救い出す",r:"sukuidasu",m:"Kurtarmak, çıkarmak"}],ex:[{s:"溺れた人を___った。",tr:"Boğulan kişiyi kurtardım.",b:"救",br:"suku"}]},
  {n:481,ch:"給",mn:"Sağlamak / Temin etmek",on:["KYŪ"],kun:["tamau"],or:"Geç dönem karakter (Shuowen). 'İplik' (orijinalde ipek ipliği) ve 'birleştirmek' (hem anlamsal hem fonetik) içerir; 'kopuk iplik bağlamak'. İpek ipliğindeki kopukları hızla birleştirmeden 'tamamlamak,",mm:"🧵 SAĞLANAN BİRLEŞTİRİLMİŞ İPLİKLER",cp:[{k:"供給",r:"KYŌKYŪ",m:"Arz, tedarik"},{k:"月給",r:"GEKKYŪ",m:"Aylık ücret"},{k:"給付",r:"KYŪFU",m:"Ödeme, katkı"}],ex:[{s:"毎月___料をもらう。",tr:"Her ay maaş alırım.",b:"給",br:"KYŪ"}]},
  {n:482,ch:"挙",mn:"Kaldırmak / Teklif etmek / Birlikte",on:["KYO"],kun:["ageru", "kozotte"],or:"Bronz, mühür ve geleneksel formlar. 'El' ve fonetik unsur ('vermek'; 'yüksek kaldırmak' çağrışımlı) içerir; 'elleriyle yüksek kaldırmak'. 'Hepsi birlikte' genişletilmiş anlamdır.",mm:"🏋️ EL YÜKLÜ MASAYI KALDIRIYOR — NE EYLEM!",cp:[{k:"挙手",r:"KYOSHU",m:"El kaldırma"},{k:"選挙",r:"SENKYO",m:"Seçim"},{k:"一挙に",r:"IKKYO ni",m:"Bir hamlede"}],ex:[{s:"手を___げて発言した。",tr:"El kaldırıp söz aldım.",b:"挙",br:"a"}]},
  {n:483,ch:"漁",mn:"Balık avlamak / Balıkçılık",on:["GYO", "RYŌ"],kun:[],or:"OBI ve mühür formlar. 'Su' ve 'balık' içerir; 'suda balık' ve dolayısıyla 'balık avlamak'. Bazı OBI formlarında dört balık; bronz formda iki el eklenmiş.",mm:"🎣 BALIK AVLAMAK SUDA BALIK TUTMAK DEMEKTİR",cp:[{k:"漁船",r:"GYOSEN",m:"Balıkçı teknesi"},{k:"漁師",r:"RYŌSHI",m:"(Profesyonel) balıkçı"},{k:"漁業",r:"GYOGYŌ",m:"Balıkçılık endüstrisi"}],ex:[{s:"___師が魚を取った。",tr:"Balıkçı balık tuttu.",b:"漁",br:"GYO"}]},
  {n:484,ch:"共",mn:"Birlikte / Beraber",on:["KYŌ"],kun:["tomo"],or:"OBI, bronz ve mühür formlar. İki elin bir nesneyi (muhtemelen ortası delikli yeşim diski) takdim etmesi. 'Sağlamak' genişletilmiş anlamdır; 'hepsi birlikte' ön-Han döneminden beri kullanılır.",mm:"🌿 BİTKİ VE MASA BİRLİKTE UYUM İÇİNDE",cp:[{k:"共通",r:"KYŌTSŪ",m:"Ortaklık, ortak"},{k:"共食い",r:"tomogui",m:"Yamyamlık"},{k:"共同",r:"KYŌDŌ",m:"Ortak, müşterek"}],ex:[{s:"___に頑張ろう。",tr:"Birlikte çabalayalım.",b:"共",br:"tomo"}]},
  {n:485,ch:"協",mn:"İşbirliği yapmak",on:["KYŌ"],kun:[],or:"Geç dönem karakter (Shuowen). 'Güç'ün üç katı ve fonetik unsur 'on, birçok' (Katō; 'toplamak' çağrışımlı) içerir. OBI formunda güç üçlenmiş. 'Güçleri bir araya getirip işbirliği yapmak'.",mm:"💪 ON ÜÇ GÜÇLÜ KOL İŞBİRLİĞİ YAPARAK",cp:[{k:"協定",r:"KYŌTEI",m:"Anlaşma, protokol"},{k:"協力",r:"KYŌRYOKU",m:"İşbirliği"},{k:"協会",r:"KYŌKAI",m:"Dernek, birlik"}],ex:[{s:"___力して仕事を終えた。",tr:"İşbirliği yaparak işi bitirdik.",b:"協",br:"KYŌ"}]},
  {n:486,ch:"鏡",mn:"Ayna",on:["KYŌ"],kun:["kagami"],or:"Geç dönem karakter (Shuowen). 'Metal' ve fonetik unsur ('son; görünüm, şekil' anlamındaki CO) içerir. Eski Çin'de aynalar bronz diskten yapılırdı ve zenginlere özgüydü.",mm:"🔮 METAL AYNADA BÜKÜK BACAKLARIN SESİ!?",cp:[{k:"望遠鏡",r:"BŌENKYŌ",m:"Teleskop"},{k:"鏡台",r:"KYŌDAI",m:"Tuvalet masası"},{k:"手鏡",r:"tekagami",m:"El aynası"}],ex:[{s:"___で顔を見た。",tr:"Aynada yüzüme baktım.",b:"鏡",br:"kagami"}]},
  {n:487,ch:"競",mn:"Yarışmak / Teklif vermek",on:["KYŌ", "KEI"],kun:["kisou", "seru"],or:"Bronz ve mühür formlar. 'İki kişi takip eder' ve 'tartışma' (kelimeler ikiye katlanmış) içerir; özgün anlam 'iki kişi tartışır', sonra 'yarışmak'. Mühür sonrası formda bileşenler şekil değiştirdi.",mm:"👦 İKİ AĞABEY KARŞI KARŞIYA DURARAK YARIŞIYOR",cp:[{k:"競争",r:"KYŌSŌ",m:"Yarışma, rekabet"},{k:"競馬",r:"KEIBA",m:"At yarışı"},{k:"競り売り",r:"seriuri",m:"Açık arttırma"}],ex:[{s:"マラソンで___争した。",tr:"Maratonda yarıştım.",b:"競",br:"KYŌ"}]},
  {n:488,ch:"極",mn:"Son derece / Kutup",on:["KYOKU", "GOKU"],kun:["kiwameru", "kiwamaru"],or:"Geç dönem karakter (Shuowen). 'Ağaç/odun' ve fonetik unsur ('acele etmek; en yüksek yerde' çağrışımlı) içerir; 'bina içindeki en yüksek yerdeki ahşap, ana kiriş'. Genişletilmiş anlam 'aşırı uç, kutup'",mm:"🔨 İKİ ÇUBUK ARASINDA DELİKTE TUTTURULAN KAREMSAL EL",cp:[{k:"北極",r:"HOKKYOKU",m:"Kuzey Kutbu"},{k:"至極",r:"SHIGOKU",m:"Son derece, aşırı"},{k:"消極",r:"SHŌKYOKU",m:"Katot"}],ex:[{s:"北___点に近い場所だ。",tr:"Kuzey kutbuna yakın bir yer.",b:"極",br:"KYOKU"}]},
  {n:489,ch:"訓",mn:"Öğreti / Kun okuyuş",on:["KUN"],kun:[],or:"Geç dönem karakter (Shuowen). 'Kelimeler' ve 'nehir' (fonetik, 'takip etmek' çağrışımlı) içerir; 'sözlerle takip ettirmek, öğretmek'. Japonca'da kanji'nin yerli Japonca okunuşu 'kun' için özel anlam t",mm:"🌊 ÖĞRETI SIRASINDA KELIMELER NEHIR GİBİ AKAR",cp:[{k:"訓読み",r:"KUNyomi",m:"Kun okuyuşu"},{k:"訓練",r:"KUNREN",m:"Eğitim, antrenman"},{k:"教訓的",r:"KYŌKUNTEKI",m:"Öğretici, aydınlatıcı"}],ex:[{s:"新入社員の___練をした。",tr:"Yeni çalışanların eğitimini yaptım.",b:"訓",br:"KUN"}]},
  {n:490,ch:"軍",mn:"Ordu / Askeri",on:["GUN"],kun:[],or:"Bronz ve mühür formlar. 'Taşıt/savaş arabası' ve 'çevreleme/sarma' unsuru içerir; 'dairesel koruyucu kamp oluşturan arabalar' anlamını verir; bu antik bir askeri uygulama.",mm:"🚗 KAPALI ASKERI ARAÇLAR",cp:[{k:"空軍",r:"KŪGUN",m:"Hava kuvvetleri"},{k:"軍人",r:"GUNJIN",m:"Asker, er"},{k:"米軍",r:"BEIGUN",m:"Amerikan ordusu"}],ex:[{s:"___隊が行進した。",tr:"Ordu yürüyüş yaptı.",b:"軍",br:"GUN"}]},
  {n:491,ch:"郡",mn:"Kaza / İlçe",on:["GUN"],kun:["kōri"],or:"Geç dönem karakter (Shuowen). 'Köy/yerleşim' ve 'lord' (fonetik, 'toplamak, biriktirmek' çağrışımlı) içerir; 'bir lordun yerleşim topluluğu'. Hem Çin'de hem Japonya'da idari birim olarak kullanıldı.",mm:"🏡 KÖY, KAZANIN LORD'UNUN YÖNETİMİNE BAĞLI",cp:[{k:"郡部",r:"GUNBU",m:"Kırsal bölge"},{k:"郡山",r:"Kōriyama",m:"Kōriyama (yer adı)"},{k:"郡部",r:"GUNBU",m:"Kırsal bölge"}],ex:[{s:"田舎の___に住んでいる。",tr:"Kırsal ilçede yaşıyorum.",b:"郡",br:"GUN"}]},
  {n:492,ch:"径",mn:"Patika / Doğrudan",on:["KEI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Yol, gitmek' ve fonetik unsur (tezgahta gerilmiş iplik; 'düz' çağrışımlı) içerir; 'doğrudan yol, patika'. Katō 'küçük' olarak yorumlar.",mm:"🤲 DOĞRUDAN PATIKA ELLERI YERDE HAREKET ETTİRMEKLE GEÇİLİR",cp:[{k:"直径",r:"CHOKKEI",m:"Çap"},{k:"径路",r:"KEIRO",m:"Güzergah, rota"},{k:"小径",r:"SHŌKEI",m:"Kısa yol"}],ex:[{s:"円の直___を測った。",tr:"Dairenin çapını ölçtüm.",b:"径",br:"KEI"}]},
  {n:493,ch:"型",mn:"Tür / Model / Kalıp",on:["KEI"],kun:["kata"],or:"Bronz ve mühür formlar. 'Toprak/kil' ve 'başlatmak' ya da 'cezalandırmak' (fonetik) içerir; 'metal eşya dökmek için kalıp'. 'Model' genişletilmiş anlamdır.",mm:"🏺 TOPRAĞI CEZALANDIRMAK MODEL YARATIR",cp:[{k:"原型",r:"GENKEI",m:"Prototip, ilk örnek"},{k:"大型",r:"ōgata",m:"Büyük boy"},{k:"典型的",r:"TENKEITEKI",m:"Tipik, örnek"}],ex:[{s:"新___のスマホを買った。",tr:"Yeni model akıllı telefon aldım.",b:"型",br:"KATA"}]},
  {n:494,ch:"景",mn:"Manzara / Sahne / Parlak",on:["KEI", "KE"],kun:[],or:"Geç dönem karakter (Shuowen). 'Güneş' ve 'başkent' (fonetik, 'ışık' ya da 'sınır belirlemek' çağrışımlı) içerir. Işık ve gölge arasındaki net sınırdan 'manzara, sahne' anlamı türedi.",mm:"☀️ PARLAK GÜNEŞLI BAŞKENT GÜZEl BİR MANZARADIR",cp:[{k:"光景",r:"KŌKEI",m:"Manzara, görüntü"},{k:"景気",r:"KEIKI",m:"Canlılık, iş koşulları"},{k:"景色",r:"KESHIKI",m:"Manzara, doğal güzellik"}],ex:[{s:"美しい___色を眺めた。",tr:"Güzel manzaraya baktım.",b:"景",br:"KEI"}]},
  {n:495,ch:"芸",mn:"Sanat / Beceri / Bitki dikmek",on:["GEI"],kun:[],or:"OBI ve mühür formlar. Başlangıçta 'diz çöküp bir şey dikmek'; sonradan 'bitki/çimen' eklendi. En sonunda 'söylemek, bulut' fonetik olarak eklendi. 'Sanat/beceri' genişletilmiş anlamlardır.",mm:"🌿 ONLAR DİYOR Kİ DİKMEK BECERİKLİ BİR SANATTIR",cp:[{k:"芸術",r:"GEIJUTSU",m:"Sanat"},{k:"手芸",r:"SHUGEI",m:"El sanatı, el işi"},{k:"芸者",r:"GEISHA",m:"Geisha"}],ex:[{s:"伝統___能を鑑賞した。",tr:"Geleneksel sanatı izledim.",b:"芸",br:"GEI"}]},
  {n:496,ch:"欠",mn:"Eksiklik / Boşluk",on:["KETSU"],kun:["kaku", "kakeru"],or:"OBI ve mühür formlar. OBI formu diz çöken ve esneyen kişinin piktogramı. Mühür formu 'tencere' ve fonetik unsur ('açmak' çağrışımlı) içerir; 'kırık tencere'. 'Eksiklik' genişletilmiş anlamdır.",mm:"🏠 EVDE İNSANLAR EKSIK",cp:[{k:"欠席者",r:"KESSEKISHA",m:"Devamsız"},{k:"欠点",r:"KETTEN",m:"Kusur, hata"},{k:"欠け目",r:"kakeme",m:"Kırık, gedik"}],ex:[{s:"会議に___席した。",tr:"Toplantıya katılmadım.",b:"欠",br:"kake"}]},
  {n:497,ch:"結",mn:"Bağlamak / Sonuç",on:["KETSU"],kun:["musubu", "yuu", "waeru"],or:"Geç dönem karakter (Shuowen). 'İplik' ve fonetik unsur ('iyi şans'; 'bükmek' ya da 'sıkıca bağlamak' çağrışımlı) içerir; 'iplikte düğüm atmak'. Genişletilmiş anlamlar 'birleşmek, bağlamak'.",mm:"⚔️ SAMURAYLARIN AĞZINI İPLİKLE BAĞ",cp:[{k:"結婚",r:"KEKKON",m:"Evlilik"},{k:"結果",r:"KEKKA",m:"Sonuç"},{k:"結び目",r:"musubime",m:"Düğüm"}],ex:[{s:"ひもを___んだ。",tr:"İpi bağladım.",b:"結",br:"musu"}]},
  {n:498,ch:"建",mn:"İnşa etmek / Dikmek",on:["KEN", "KON"],kun:["tatsu", "teru"],or:"Bronz ve mühür formlar. 'Dik tutulan kalem/fırça' ve fonetik unsur ('yavaş ilerlemek' ya da 'ileriye gitmek' çağrışımlı) içerir; 'yazı fırçasını hareket ettirmek'. Sonradan 'dik tutmak, dikmek, inşa e",mm:"✏️ EL İLERLEYEREK KALEMİ DİK TUTUYOR",cp:[{k:"建設",r:"KENSETSU",m:"İnşaat"},{k:"建立",r:"KONRYŪ",m:"Kuruluş, inşa"},{k:"建物",r:"tatemono",m:"Bina"}],ex:[{s:"家を___てた。",tr:"Ev inşa ettim.",b:"建",br:"ta"}]},
  {n:499,ch:"健",mn:"Sağlıklı",on:["KEN"],kun:["sukoyaka"],or:"Geç dönem karakter (Shuowen). 'Kişi' ve 'inşa etmek, dikmek' (fonetik, 'güçlü' çağrışımlı) içerir; 'güçlü kişi'. Anlam 'güçlü'den 'sağlıklı'ya genişledi.",mm:"🧍 SAĞLIKLI KİŞİ DİK DURUR",cp:[{k:"健康",r:"KENKŌ",m:"Sağlık"},{k:"健全",r:"KENZEN",m:"Sağlamlık, sağlıklı"},{k:"壮健",r:"SŌKEN",m:"Sağlıklı, güçlü"}],ex:[{s:"___康に気をつけている。",tr:"Sağlığıma dikkat ediyorum.",b:"健",br:"KEN"}]},
  {n:500,ch:"験",mn:"Sınav / Denemek",on:["KEN"],kun:[],or:"Geç dönem karakter (Shuowen). 'At' ve fonetik unsur ('insanlar ortak görüş üzerinde anlaşıyor'; 'toplamak ve kontrol altına almak' çağrışımlı) içerir. 'Sınamak, denemek' temel anlamdır.",mm:"🐎 KAPAĞI ALTINDA AT SINAYOR",cp:[{k:"試験",r:"SHIKEN",m:"Sınav, deneme"},{k:"実験",r:"JIKKEN",m:"Deney"},{k:"経験",r:"KEIKEN",m:"Deneyim, tecrübe"}],ex:[{s:"経___を積んだ。",tr:"Deneyim edindim.",b:"験",br:"KEN"}]},
  {n:501,ch:"固",mn:"Sert / Katı / Sağlam",on:["KO"],kun:["katai", "katameru", "katamaru"],or:"'Çevre/duvar' (kale surları) ve 'eski' (fonetik, 'sağlam, katı' çağrışımlı) içerir; 'kale surlarını sağlamca savunmak'. Anlam 'sert, katı'ya genelleşti.",mm:"🏰 ESKİ ÇEVRELEYEN DUVARLAR SERT VE SAĞLAMDIR",cp:[{k:"固体",r:"KOTAI",m:"Katı hâl"},{k:"強固",r:"KYŌKO",m:"Sağlamlık"},{k:"固まり",r:"katamari",m:"Küme, yığın"}],ex:[{s:"コンクリートが___まった。",tr:"Beton sertleşti.",b:"固",br:"kata"}]},
  {n:502,ch:"功",mn:"Liyakat / Hizmet",on:["KŌ", "KU"],kun:[],or:"'Güç, çaba' ve 'alet' (fonetik, 'çalışmak' çağrışımlı) içerir; 'çalışmaya güç harcamak' ve dolayısıyla 'liyakatli'.",mm:"💪 GÜÇ VE ALET KULLANIMI LİYAKATLİ HİZMET DEMEKTİR",cp:[{k:"成功",r:"SEIKŌ",m:"Başarı"},{k:"功罪",r:"KŌZAI",m:"Artı ve eksiler"},{k:"功労",r:"KŌRŌ",m:"Köklü hizmet"}],ex:[{s:"努力が___を奏した。",tr:"Çaba karşılık buldu.",b:"功",br:"KŌ"}]},
  {n:503,ch:"好",mn:"Sevmek / İyi / Güzel",on:["KŌ"],kun:["suku", "konomu"],or:"'Kadın' ve 'çocuk' içerir. Geleneksel yorumda 'çocuğa bakan kadın' > 'sevmek'. Alternatif: 'güzel kadın' > 'sevmek'.",mm:"👩‍👦 KADIN ÇOCUĞU SEVER — NE GÜZEL ŞEY",cp:[{k:"好意",r:"KŌUI",m:"İyi niyet"},{k:"好きな",r:"suki na",m:"Sevilen"},{k:"好色",r:"KŌSHOKU",m:"Şehvet düşkünlüğü"}],ex:[{s:"___きな食べ物は何ですか？",tr:"Sevdiğin yiyecek nedir?",b:"好",br:"su"}]},
  {n:504,ch:"候",mn:"Hava / İşaret / Hizmet etmek",on:["KŌ"],kun:["sōrō"],or:"'Kişi' ve fonetik unsur ('karşılayıp selamlamak' çağrışımlı) içerir. 'Hava' ve 'işaret' genişletilmiş anlamlardır.",mm:"🏹 KİŞİLER OK İŞARETİYLE HAVA İŞARETLERİNE İŞARET EDİYOR",cp:[{k:"気候",r:"KIKŌ",m:"İklim"},{k:"候補",r:"KŌHO",m:"Adaylık"},{k:"候文",r:"sōrōBUN",m:"Tarihi yazı stili"}],ex:[{s:"天___が不安定だ。",tr:"Hava durumu kararsız.",b:"候",br:"KŌ"}]},
  {n:505,ch:"航",mn:"Deniz yolculuğu / Yelken açmak",on:["KŌ"],kun:[],or:"'Tekne' ve fonetik unsur ('yan; boyun') içerir; 'yan yana bağlanmış tekneler'. Anlam 'seyretmek'e genişledi.",mm:"⛵ MASA GİBİ TEKNE YOLCULUĞU",cp:[{k:"航空",r:"KŌKŪ",m:"Havacılık"},{k:"航海",r:"KŌKAI",m:"Deniz yolculuğu"},{k:"航路",r:"KŌRO",m:"Rota"}],ex:[{s:"船で海を___行した。",tr:"Gemiyle denizde yolculuk ettim.",b:"航",br:"KŌ"}]},
  {n:506,ch:"康",mn:"Barış / Sağlık",on:["KŌ"],kun:[],or:"OBI ve bronz formlar tokmakla tahıl döven iki eli tasvir eder. 'Barış' ve 'sağlık' ödünç anlamlardır.",mm:"🏠 BİNADA SAĞLIKLI KEPEĞİ TOKMAKLA DÖVEN EL",cp:[{k:"小康",r:"SHŌKŌ",m:"Geçici rahatlama"},{k:"不健康",r:"FUKENKŌ",m:"Sağlıksız"},{k:"健康体",r:"KENKŌTAI",m:"Sağlıklı beden"}],ex:[{s:"健___を保つために運動する。",tr:"Sağlığı korumak için egzersiz yaparım.",b:"康",br:"KŌ"}]},
  {n:507,ch:"告",mn:"İlan etmek / Bilgilendirmek",on:["KOKU"],kun:["tsugeru"],or:"'Ağız/kelimeler' ve 'öküz' içerir. Alternatif yorumda 'öne sürmek' çağrışımlı fonetik unsur.",mm:"🐄 KUYRUKSUZ İNEK HAKKINDA AĞIZLA BİLGİ VER",cp:[{k:"広告",r:"KŌKOKU",m:"Reklam"},{k:"告白",r:"KOKUHAKU",m:"İtiraf"},{k:"予告",r:"YOKOKU",m:"Önceden haber"}],ex:[{s:"結果を報___した。",tr:"Sonucu raporladım.",b:"告",br:"KOKU"}]},
  {n:508,ch:"差",mn:"Fark / İşaret etmek",on:["SA"],kun:["sasu"],or:"'Sol' (fonetik, 'düzensiz' çağrışımlı) ve genç ağaçtaki filizler içerir. 'Düzensiz sarkık filizler' > 'fark, ayrılık'.",mm:"🐑 SOLDAKİ KOYUN FARKLIYDI",cp:[{k:"時差",r:"JISA",m:"Zaman farkı"},{k:"差別",r:"SABETSU",m:"Ayrımcılık"},{k:"差し込む",r:"sashikomu",m:"Takmak"}],ex:[{s:"気温に___がある。",tr:"Sıcaklıkta fark var.",b:"差",br:"SA"}]},
  {n:509,ch:"菜",mn:"Sebze / Kolza",on:["SAI"],kun:["na"],or:"'Bitki/çimen' ve 'el meyve/sebze toplayan' içerir; 'toplanacak yenebilir bitki'. Japonca'da ayrıca 'kolza' özel anlamını taşır.",mm:"🥬 EL AĞACIN YAKININDA SEBZE KOPARTIYOR",cp:[{k:"野菜",r:"YASAI",m:"Sebze"},{k:"菜の花",r:"nanohana",m:"Kolza çiçeği"},{k:"菜食",r:"SAISHOKU",m:"Vejetaryen beslenme"}],ex:[{s:"野___をたくさん食べる。",tr:"Çok sebze yerim.",b:"菜",br:"SAI"}]},
  {n:510,ch:"最",mn:"En / -in en",on:["SAI"],kun:["mottomo"],or:"'Miğfer/başlık' ve 'almak' (anlamsal ve fonetik) içerir; 'yasa dışı ele geçirmek'. 'En' ödünç anlamdır. Üst kısım şekil değişimiyle 'güneş' gibi görünür.",mm:"☀️ EN YÜKSEKTE GÜNEŞİ ALE GEÇİR",cp:[{k:"最大",r:"SAIDAI",m:"En büyük"},{k:"最後",r:"SAIGO",m:"En son"},{k:"最新",r:"SAISHIN",m:"En yeni"}],ex:[{s:"___近忙しい。",tr:"Son zamanlarda meşgulüm.",b:"最",br:"SAI"}]},
  {n:511,ch:"材",mn:"Kereste / Kaynak",on:["ZAI"],kun:[],or:"'Ağaç/odun' ve fonetik unsur ('kullanmak' ya da 'kesmek' çağrışımlı) içerir; 'kullanışlı odun'. Sonradan 'kaynak' anlamı genelleşti.",mm:"🌳 HER YAŞTA AĞAÇ KULLANIŞLI BİR KERESTE KAYNAĞI",cp:[{k:"材木",r:"ZAIMOKU",m:"Kereste, odun"},{k:"材料",r:"ZAIRYŌ",m:"Malzeme, veri"},{k:"人材",r:"JINZAI",m:"Yetenekli kişi"}],ex:[{s:"木___で家具を作った。",tr:"Tahtadan mobilya yaptım.",b:"材",br:"ZAI"}]},
  {n:512,ch:"昨",mn:"Dün / Geçmiş",on:["SAKU"],kun:[],or:"'Gün' ve fonetik unsur ('biriktirmek' çağrışımlı) içerir; 'birkaç gün önce'. 'Dün, geçmiş' anlamı sonradan yerleşti.",mm:"📅 GEÇMİŞ DÜNLERDEN OLUŞUR",cp:[{k:"昨日",r:"SAKUJITSU",m:"Dün"},{k:"昨夜",r:"SAKUYA",m:"Dün gece"},{k:"昨年",r:"SAKUNEN",m:"Geçen yıl"}],ex:[{s:"___日の夜は寒かった。",tr:"Dün gece soğuktu.",b:"昨",br:"SAKU"}]},

  {n:514,ch:"刷",mn:"Basmak / Ovmak",on:["SATSU"],kun:["suru"],or:"'Bıçak/kesmek' ve fonetik unsur ('kazımak' çağrışımlı) içerir; 'bıçakla kazımak'. Matbaacılık tahta bloklar üzerine kazıma gerektirirdi.",mm:"🍑 GÜZEL KESİLMİŞ BASKILI DOKUMA",cp:[{k:"印刷",r:"INSATSU",m:"Baskı, matbaa"},{k:"刷新",r:"SASSHIN",m:"Yenileme, reform"},{k:"校正刷り",r:"KŌSEIzuri",m:"Baskı provası"}],ex:[{s:"資料を印___した。",tr:"Materyali bastım.",b:"刷",br:"SATSU"}]},

  {n:524,ch:"司",mn:"Yönetmek / Resmi",on:["SHI"],kun:["tsukasadoru"],or:"'Ağız/giriş' ve 'yere uzanmış kişi' ya da 'çömelmiş kişi' içerir. Tōdō 'küçük açıklığı ovmak' kelime ailesine dahil eder.",mm:"🏛️ RESMİ KİŞİ KÖŞEDE BİR GİRİŞİ YÖNETİYOR",cp:[{k:"司法",r:"SHIHŌ",m:"Yargı, hukuk"},{k:"司令部",r:"SIREIBU",m:"Karargâh"},{k:"司会者",r:"SHIKAISYA",m:"Sunucu, moderatör"}],ex:[{s:"上___に報告した。",tr:"Üstüme rapor verdim.",b:"司",br:"SHI"}]},

  {n:528,ch:"辞",mn:"Kelime / İstifa etmek",on:["JI"],kun:["yameru"],or:"'İğne' (dövme için) ve 'dolanmış ipliği çözen iki el' içerir. Modern form 'iğne' ve 'dil'. 'Kelime' ve 'istifa' ödünç anlamlardır.",mm:"💉 İĞNE GİBİ KESKİN DİL İSTİFA SÖZÜNÜ SÖYLER",cp:[{k:"辞書",r:"JISHO",m:"Sözlük"},{k:"辞職",r:"JISHOKU",m:"İstifa"},{k:"修辞学",r:"SHŪJIGAKU",m:"Retorik"}],ex:[{s:"英和___書を使った。",tr:"İngilizce-Japonca sözlük kullandım.",b:"辞",br:"JI"}]},

  {n:573,ch:"兆",mn:"İşaret / Uğur / Trilyon",on:["CHŌ"],kun:["kizashi", "kizasu"],or:"OBI ve mühür formlar. Fal için ısıtılan kaplumbağa kabuğundaki çatlakları gösteren piktogram. Çatlak desenleri geleceği tahmin etmede kullanılırdı. 'Trilyon' ödünç anlamdır.",mm:"🐢 SIRT SIRTA KAPLUMBAĞA KABUKLARI MİLYARLARCA UĞUR GÖSTERİYOR",cp:[{k:"兆候",r:"CHŌKŌ",m:"İşaret, belirti"},{k:"前兆",r:"ZENCHŌ",m:"Uğursuz işaret, önceden belirti"},{k:"億兆",r:"OKUCHŌ",m:"Kitleler, halk"}],ex:[{s:"経済回復の___しが見えた。",tr:"İyileşmenin işaretleri görüldü.",b:"兆",br:"CHŌ"}]},
  {n:574,ch:"腸",mn:"Bağırsak",on:["CHŌ"],kun:["harawata"],or:"Geç dönem karakter (Shuowen). 'Et/beden' ve fonetik unsur ('güneş yükseliyor; uzun' çağrışımlı) içerir; 'uzun beden parçası' > 'bağırsak'.",mm:"☀️ ETLİ BAĞIRSAKLAR YÜKSELEN GÜNEŞE MARUZ KALIYOR",cp:[{k:"腸線",r:"CHŌSEN",m:"Bağırsak teli (kedi)"},{k:"腸炎",r:"CHŌEN",m:"Bağırsak iltihabı"},{k:"大腸",r:"DAICHŌ",m:"Kalın bağırsak"}],ex:[{s:"胃___の調子が悪い。",tr:"Mide bağırsak durumum kötü.",b:"腸",br:"CHŌ"}]},
  {n:575,ch:"低",mn:"Alçak / Düşük",on:["TEI"],kun:["hikui"],or:"Geç dönem karakter (Shuowen). 'Kişi' ve tartışmalı unsur ('tepecik tabanı' ya da 'tabağın dibine dokunan kaşık' > 'aşağı, düşük') içerir. Analizler farklılık gösterse de anlam 'kısa, alçak'.",mm:"👥 O KLANIN İNSANLARI ÇOK ALÇAKTA — GERÇEKTEN EN ALTTA",cp:[{k:"最低",r:"SAITEI",m:"En düşük, minimum"},{k:"低利",r:"TEIRI",m:"Düşük faiz oranı"},{k:"低落",r:"TEIRAKU",m:"Düşüş, gerileme"}],ex:[{s:"この山は___い。",tr:"Bu dağ alçak.",b:"低",br:"hiku"}]},

  {n:577,ch:"停",mn:"Durmak",on:["TEI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Kişi' ve fonetik unsur ('yüksek katlı ev ya da han') içerir; 'bir ev/handa kalmak'. Genişletilmiş anlam 'kalmak, durmak'.",mm:"🏨 KİŞİ YÜKSEK HANDA KALIYOR",cp:[{k:"停止",r:"TEISHI",m:"Durma, durdurma"},{k:"停車場",r:"TEISHAJO",m:"Durak, istasyon"},{k:"停電",r:"TEIDEN",m:"Elektrik kesintisi"}],ex:[{s:"バス___留所で待った。",tr:"Otobüs durağında bekledim.",b:"停",br:"TEI"}]},
  {n:578,ch:"的",mn:"Hedef / ...gibi / Sıfat eki",on:["TEKI"],kun:["mato"],or:"Geç dönem karakter (Shuowen). 'Güneş' ve fonetik unsur ('kepçe/ölçü birimi'; 'beyaz, parlak' çağrışımlı) içerir; 'parlak beyaz güneş ışığı'. 'Hedef' anlamı hedeflerin beyaz oluşundan gelir.",mm:"🥄 BEYAZ KEPÇE İYİ BİR HEDEF OLUŞTURUR",cp:[{k:"目的",r:"MOKUTEKI",m:"Hedef, amaç"},{k:"理想的",r:"RISŌTEKI",m:"İdeal"},{k:"的外れ",r:"matohazure",m:"Hedefe uymayan"}],ex:[{s:"弓で___を射た。",tr:"Yay ile hedefe vurdum.",b:"的",br:"MATO"}]},

  {n:580,ch:"伝",mn:"İletmek / Aktarmak",on:["DEN"],kun:["tsutaeru", "tsutawaru"],or:"OBI, mühür ve geleneksel formlar. 'Kişi' ve fonetik unsur ('değiştirmek; bir öncekinin yerini almak' ya da 'başka yere taşımak' çağrışımlı) içerir; 'iletmek, aktarmak'.",mm:"👃 İKİ KİŞİ BURUN BURUNA BİRŞEY İLETİYOR",cp:[{k:"伝説",r:"DENSETSU",m:"Efsane, destan"},{k:"伝記",r:"DENKI",m:"Biyografi"},{k:"伝え聞く",r:"tsutaekiku",m:"Söylentiden duymak"}],ex:[{s:"大切な___統を守る。",tr:"Önemli geleneği koruyorum.",b:"伝",br:"DEN"}]},

  {n:583,ch:"灯",mn:"Işık / Lamba",on:["TŌ"],kun:["hi"],or:"Geç, Shuowen sonrası karakter. 'Alev/ateş' ve fonetik unsur ('tırmanmak'; 'yükselmek' ya da 'yanmak' çağrışımlı) içerir; 'ışık, lamba'.",mm:"🔩 YANAN ÇİVİ IŞIK VERIYOR!?",cp:[{k:"灯台",r:"TŌDAI",m:"Deniz feneri"},{k:"電灯",r:"DENTŌ",m:"Elektrik lambası"},{k:"灯心",r:"TŌSHIN",m:"Fitil"}],ex:[{s:"街___が点いた。",tr:"Sokak lambası yandı.",b:"灯",br:"TŌ"}]},
  {n:584,ch:"堂",mn:"Salon / Tapınak",on:["DŌ"],kun:[],or:"Geç dönem karakter (Shuowen). 'Toprak/zemin' ve fonetik unsur ('duman yükselen pencere'; 'yüksek, uzun' çağrışımlı) içerir. Başlangıçta yüksek yerde bina anlamında kullanıldı.",mm:"🏛️ GÖRKEMLI SALON SAĞLAM TOPRAĞA İNŞA EDİLDİ",cp:[{k:"講堂",r:"KŌDŌ",m:"Amfi, konferans salonu"},{k:"食堂",r:"SHOKUDŌ",m:"Yemekhane"},{k:"堂々たる",r:"DŌDŌtaru",m:"Heybetli, görkemli"}],ex:[{s:"食___で昼食を食べた。",tr:"Yemekhanede öğle yemeği yedim.",b:"堂",br:"DŌ"}]},
  {n:585,ch:"働",mn:"Çalışmak",on:["DŌ"],kun:["hataraku"],or:"Japonya'da türetilen karakter (kokuji). 'Kişi' ve 'hareket etmek' içerir. ON okunuşu DŌ, 動 karakteriyle analoji yapılarak oluşturuldu.",mm:"🏃 ÇALIŞAN İNSANLAR HAREKET HALİNDE",cp:[{k:"労働",r:"RŌDŌ",m:"Emek, iş"},{k:"働き手",r:"hatarakite",m:"Çalışkan kişi"},{k:"働き口",r:"hatarakiguchi",m:"İş imkânı"}],ex:[{s:"一生懸命___いた。",tr:"Çok çalıştım.",b:"働",br:"hatara"}]},
  {n:586,ch:"特",mn:"Özel",on:["TOKU"],kun:[],or:"Geç dönem karakter (Shuowen). 'Öküz/inek' ve fonetik unsur ('tapınak'; 'tek genç erkek' çağrışımlı) içerir; 'boğa'. Boğalar kurban için seçilirdi ve en iyileri tercih edilirdi; dolayısıyla 'özel'.",mm:"🐂 TAPINAKTAKI BOĞA ÖZEL BİR ŞEYDİR",cp:[{k:"特徴",r:"TOKUCHŌ",m:"Özellik, nitelik"},{k:"特長",r:"TOKUCHŌ",m:"Güçlü yön"},{k:"独特",r:"DOKUTOKU",m:"Özgünlük, kendine has"}],ex:[{s:"___別なプレゼントをした。",tr:"Özel bir hediye verdim.",b:"特",br:"TOKU"}]},
  {n:587,ch:"得",mn:"Kazanmak / Potansiyel",on:["TOKU"],kun:["eru", "uru"],or:"OBI ve mühür formlar. OBI formu 'kabuk para birimi' ve 'el' içerir; 'elde servet elde etmek'. 'Yol boyunca servet kazanmak' anlamından genelleşerek 'kazanmak'. 'Potansiyel' genişletilmiş anlamdır.",mm:"📅 BİR GÜN BOYUNCA HAREKETLERDEKİ KAZANIMLARI ÖLÇTÜR",cp:[{k:"得点",r:"TOKUTEN",m:"Puan, skor"},{k:"所得",r:"SHOTOKU",m:"Gelir"},{k:"あり得る",r:"ariuru",m:"Mümkün, olası"}],ex:[{s:"良い点数を___た。",tr:"İyi puan aldım.",b:"得",br:"e"}]},
  {n:588,ch:"毒",mn:"Zehir",on:["DOKU"],kun:[],or:"Geç dönem karakter (Shuowen). 'Bitki' ve fonetik unsur ('ahlaksız eylem'; 'zarar' çağrışımlı) içerir; 'insanlara zarar veren bitkiler' > 'zehir'.",mm:"🌿 ANNE ZEHİRE RAĞMEN YAŞIYOR",cp:[{k:"有毒",r:"YŪDOKU",m:"Zehirli, toksik"},{k:"気の毒",r:"KInoDOKU",m:"Üzücü, yazık"},{k:"毒蛇",r:"DOKUhebi",m:"Zehirli yılan"}],ex:[{s:"この植物には___がある。",tr:"Bu bitkide zehir var.",b:"毒",br:"DOKU"}]},
  {n:589,ch:"熱",mn:"Isı / Sıcak",on:["NETSU"],kun:["atsui"],or:"Mühür formu. 'Alev/ateş' ve fonetik unsur ('maya şaraptaki ısı yükselmesi' > 'sıcak buhar/sıcak' çağrışımlı) içerir. Alternaitf yorum: anlamsal ve fonetik 'güç, enerji' > 'yakmak için ısı'.",mm:"🔥 TOPRAK YIĞINLARi ÇEVRESINDE ATES HOT OLUYOR",cp:[{k:"熱心",r:"NESSHIN",m:"Şevk, coşku"},{k:"熱帯",r:"NETTAI",m:"Tropikal bölge"},{k:"耐熱",r:"TAINETSU",m:"Isıya dayanıklı"}],ex:[{s:"風邪をひいて___が出た。",tr:"Soğuk algınlığından ateşim çıktı.",b:"熱",br:"netsu"}]},
  {n:590,ch:"念",mn:"Düşünce / Endişe",on:["NEN"],kun:[],or:"Bronz ve mühür formlar. 'Kalp/zihin' ve fonetik unsur ('şimdi'; 'sıkıca tutmak' çağrışımlı) içerir; 'ziinde sıkıca tutmak' > 'düşünmek, kaygılanmak'.",mm:"💭 ŞİMDİ KALP BİR ENDIŞE OLARAK DÜŞÜNÜLÜYOR",cp:[{k:"念力",r:"NENRIKI",m:"İrade gücü"},{k:"念入りな",r:"NENiri na",m:"Dikkatli, özenli"},{k:"念仏",r:"NENBUTSU",m:"Budist dua"}],ex:[{s:"___入りに準備した。",tr:"Özenle hazırlandım.",b:"念",br:"NEN"}]},
  {n:591,ch:"敗",mn:"Yenilmek / Mağlubiyet",on:["HAI"],kun:["yaburu", "yabukeru"],or:"OBI ve mühür formlar. 'Vurmak, dövmek' ve fonetik unsur ('kabuk para birimi'; 'yok etmek' çağrışımlı) içerir; 'kabuk parayla dövmek'. 'Yenilmek' genişletilmiş anlamdır.",mm:"🐚 KABUK VURAN ELLE YENİLGİYE UĞRADI",cp:[{k:"敗戦",r:"HAISEN",m:"Savaşı kaybetmek"},{k:"敗走",r:"HAISŌ",m:"Bozguna uğramak, kaçmak"},{k:"敗北",r:"HAIBOKU",m:"Yenilgi, mağlubiyet"}],ex:[{s:"試合に___れた。",tr:"Maçı kaybettim.",b:"敗",br:"yabu"}]},
  {n:592,ch:"梅",mn:"Erik ağacı",on:["BAI"],kun:["ume"],or:"Bronz ve mühür formlar. 'Ağaç/odun' ve fonetik unsur ('her birinde; bol genç bitkiler' > 'hamile olmak/doğurmak' çağrışımlı) içerir. Ekşi erik meyh. sabah bulantısına iyi gelirdi.",mm:"🌸 HER AĞAÇ BİR ERİK AĞACI OLMALIDIR",cp:[{k:"梅花",r:"BAIKA",m:"Erik çiçeği"},{k:"梅酒",r:"umeSHU",m:"Erik şarabı"},{k:"梅雨",r:"BAIU",m:"Yağmur mevsimi (Japonya)"}],ex:[{s:"___の花が咲いた。",tr:"Erik çiçeği açtı.",b:"梅",br:"ume"}]},
  {n:593,ch:"博",mn:"Geniş / Kapsamlı",on:["HAKU", "BAKU"],kun:[],or:"Bronz ve mühür formlar. Sol kısım 'on' (fonetik ödünç anlamda 'toplamak'); sağ kısım fonetik unsur ('yaymak' çağrışımlı) içerir; 'büyük ölçekte toplamak/bir araya getirmek'. 'Kumarbazlık' genişletilmi",mm:"🎲 ON ÖZEL NOKTA KAPSAMLI KUMARDA KAZAN",cp:[{k:"博士",r:"HAKASE",m:"Doktor (akademik)"},{k:"博徒",r:"BAKUTO",m:"Kumarbaz"},{k:"博物館",r:"HAKUBUTSUKAN",m:"Müze"}],ex:[{s:"___物館を見学した。",tr:"Müzeyi gezdim.",b:"博",br:"HAKU"}]},
  {n:594,ch:"飯",mn:"Pişmiş pirinç / Yemek",on:["HAN"],kun:["meshi"],or:"Bronz ve mühür formlar. 'Yiyecek/yemek' ve fonetik unsur ('karşı koymak'; 'yemek' ya da 'bölmek' çağrışımlı) içerir; 'yemek yemek'. İlk anlamı pişmiş pirinç ya da darı, sonradan genel yiyecek.",mm:"🍚 PİŞİRİLMİŞ PİRİNÇ YEMEYE KARŞI MI?",cp:[{k:"ご飯",r:"GOHAN",m:"Pirinç, yemek (saygılı)"},{k:"昼飯",r:"hirumeshi",m:"Öğle yemeği"},{k:"飯田",r:"Iida",m:"Iida (soyad)"}],ex:[{s:"朝___を食べた。",tr:"Kahvaltı yaptım.",b:"飯",br:"meshi"}]},
  {n:595,ch:"飛",mn:"Uçmak",on:["HI"],kun:["tobu"],or:"OBI ve mühür formlar. Kanatlarını açmış uçan kuşun piktogramı. Mizukami uzaktaki uçan kuşları gösteren olası bir OBI formunu belirtir.",mm:"🐦 İKİ UZUN GAGALİ TURNİK UZUN KAMIŞLAR ARASINDA UÇUYOR",cp:[{k:"飛行機",r:"HIKŌKI",m:"Uçak"},{k:"飛語",r:"HIGO",m:"Asılsız söylenti"},{k:"飛び出す",r:"tobidasu",m:"Fırlayıp çıkmak"}],ex:[{s:"鳥が空を___んでいる。",tr:"Kuş gökyüzünde uçuyor.",b:"飛",br:"to"}]},
  {n:596,ch:"費",mn:"Harcamak / Maliyet",on:["HI"],kun:["tsuiyasu"],or:"Bronz ve mühür formlar. 'Kabuk para birimi' ve fonetik unsur ('bağlamayı çözmek'; 'dağıtmak' çağrışımlı) içerir; 'kabuk para dağıtmak/harcamak'. Anlam 'maliyet'e genişledi.",mm:"💸 SARI İPİ ÇÖZ VE PARAYI HARCA",cp:[{k:"費用",r:"HIYŌ",m:"Maliyet, gider"},{k:"消費者",r:"SHŌHISHA",m:"Tüketici"},{k:"生活費",r:"SEIKATSUSHI",m:"Geçim giderleri"}],ex:[{s:"生活___が高い。",tr:"Geçim masrafı yüksek.",b:"費",br:"HI"}]},
  {n:597,ch:"必",mn:"Zorunlu olarak / Mutlaka",on:["HITSU"],kun:["kanarazu"],or:"Bronz ve mühür formlar. 'Halberd' ve fonetik unsur (saplara sıkıca bağlanmış bambu çubukları) içerir; 'güçlendirilmiş silah sapı'. 'Kesinlikle, mutlaka' genişletilmiş anlamdır.",mm:"❤️ KALBE MILTAŞ GEÇMESİNİN MUTLAKA SONUÇLARI OLUR",cp:[{k:"必要",r:"HITSUYŌ",m:"Gereklilik, zorunluluk"},{k:"必死",r:"HISSHI",m:"Çaresizlik, ölümüne çabalama"},{k:"必然",r:"HITSUZEN",m:"Kaçınılmazlık"}],ex:[{s:"___ず返事をします。",tr:"Mutlaka cevap veririm.",b:"必",br:"HITSU"}]},
  {n:598,ch:"票",mn:"Oy / Etiket / İşaret",on:["HYŌ"],kun:[],or:"Geç dönem karakter (Shuowen). 'Alev/ateş' ve fonetik unsur ('uçmak, yükselmek' çağrışımlı) içerir; 'kıvılcımlar uçar'. Shirakawa cenaze yakmayla ilişkilendirir. 'Oy, etiket' ödünç anlamlardır.",mm:"📋 OY BATIDA GÖSTERİLİYOR",cp:[{k:"票決",r:"HYŌKETSU",m:"Oy çokluğu kararı"},{k:"投票",r:"TŌHYŌ",m:"Oy kullanmak"},{k:"伝票",r:"DENPYŌ",m:"Fiş, makbuz"}],ex:[{s:"選挙で___を入れた。",tr:"Seçimde oy kullandım.",b:"票",br:"HYŌ"}]},
  {n:599,ch:"標",mn:"İşaret / Levha",on:["HYŌ"],kun:["shirushi"],or:"Geç dönem karakter (Shuowen). 'Ağaç/odun' ve fonetik unsur ('ağacın en üst dalları/dalcıklar' çağrışımlı) içerir; 'ağacın ince tepe dalları'. 'İşaret, levha' ödünç ya da genişletilmiş anlamdır.",mm:"🌲 O AĞACIN YANINDA BATI'YI GÖSTEREN BİR LEVHA VAR",cp:[{k:"標準",r:"HYŌJUN",m:"Standart, ölçüt"},{k:"里程標",r:"RITEIHYŌ",m:"Kilometre taşı"},{k:"標識",r:"HYŌSHIKI",m:"Trafik işareti"}],ex:[{s:"目___を立てた。",tr:"Hedef koydum.",b:"標",br:"HYŌ"}]},
  {n:600,ch:"不",mn:"Değil / -siz / -suz",on:["FU", "BU"],kun:[],or:"OBI ve mühür formlar. Başlangıçta çiçeğin dibini koruyan bir kaliksin piktogramıydı. Ancak çok erken dönemde (OBI) 'değil' anlamı için fonetik ödünç olarak kullanıldı.",mm:"✖️ BİR KEZ VUR, SONRA ÜÇ KEZ DAHA — KESIN HAYIR",cp:[{k:"不明",r:"FUMEI",m:"Belirsiz, bilinmez"},{k:"不平",r:"FUHEI",m:"Şikâyet, sitem"},{k:"不気味",r:"BUKIMI",m:"Ürkütücü, esrarengiz"}],ex:[{s:"___思議な現象が起きた。",tr:"Gizemli bir olay yaşandı.",b:"不",br:"FU"}]},
  {n:601,ch:"夫",mn:"Koca / Erkek",on:["FU", "FŪ"],kun:["otto"],or:"OBI ve mühür formlar. Yetişkin bir erkeği gösterir (OBI metinlerinde kullanıma göre Katō bunu büyük erkek olarak yorumlar). Üst yatay çizgi yetişkinliğe ulaşmayı simgeleyen saç tokasını temsil eder.",mm:"👑 KOCA KAFASINA SAP GEÇİRİLMİŞ BÜYÜK ADAMDIR!?",cp:[{k:"人夫",r:"NINPU",m:"İşçi, amele"},{k:"加藤夫人",r:"KATŌ FUJIN",m:"Bayan Katō"},{k:"夫婦",r:"FŪFU",m:"Evli çift"}],ex:[{s:"___婦で旅行した。",tr:"Eşimle seyahat ettik.",b:"夫",br:"FU"}]},
  {n:602,ch:"付",mn:"Eklemek / Uygulamak",on:["FU"],kun:["tsuku", "tsukeru"],or:"Bronz ve mühür formlar. 'Kişi' ve fonetik unsur ('bir kişiyi arkadan tutmak' çağrışımlı; 'iliştirmek' anlamı) içerir. Mühür aşamasında fonetik 'el' ile standardize edildi.",mm:"🤝 KİŞİNİN ARKASINDAN TUTULAN BİR EL VAR",cp:[{k:"付着",r:"FUCHAKU",m:"Yapışma, tutunma"},{k:"付き合う",r:"tsukiau",m:"Birlikte olmak, ilişki kurmak"},{k:"名付ける",r:"nazukeru",m:"Ad vermek, isimlendirmek"}],ex:[{s:"ラベルを___けた。",tr:"Etiket yapıştırdım.",b:"付",br:"tsu"}]},
  {n:603,ch:"府",mn:"Hükümet merkezi",on:["FU"],kun:[],or:"Mühür formu. 'Çatı/bina' ve fonetik unsur ('eklemek'; 'toplamak, bir araya getirmek' çağrışımlı) içerir; 'eşyaların toplandığı bina' > 'belge deposu' > 'hükümet ofisi'.",mm:"🏛️ HÜKÜMET MERKEZİNE BAĞLI BÜYÜK BİNA",cp:[{k:"政府",r:"SEIFU",m:"Hükümet"},{k:"府県",r:"FUKEN",m:"Prefektörler"},{k:"京都府",r:"KYŌTO-FU",m:"Kyoto Prefektörü"}],ex:[{s:"大阪___に住んでいる。",tr:"Osaka'da yaşıyorum.",b:"府",br:"FU"}]},
  {n:604,ch:"副",mn:"Yardımcı / Vekil-",on:["FUKU"],kun:[],or:"Mühür formu. 'Bıçak' ve fonetik unsur ('geniş ağızlı kavanos') içerir; 'bıçakla kesmek'. 'İkiye bölmek' anlamından 'ikincil, yardımcı' anlamı türedi.",mm:"🔪 TARLAYA GİREN TEK KAPIDA KESİLEN YARDIMCI",cp:[{k:"副業",r:"FUKUGYŌ",m:"İkinci iş, yan iş"},{k:"副詞",r:"FUKUSHI",m:"Zarf (dilbilgisi)"},{k:"副領事",r:"FUKURYŌJI",m:"Başkonsolos yardımcısı"}],ex:[{s:"___社長が会議を開いた。",tr:"Genel müdür yardımcısı toplantı açtı.",b:"副",br:"FUKU"}]},
  {n:605,ch:"粉",mn:"Toz / Un",on:["FUN"],kun:["kona", "ko"],or:"Geç dönem karakter (Shuowen). 'Pirinç' ve fonetik unsur ('bölmek'; 'parçalamak' çağrışımlı) içerir; 'pirinç işlenirken oluşan küçük parçacıklar' > 'un, toz'.",mm:"🌾 PİRİNCİ BÖLMEK ÇOK TOZA YOL AÇAR",cp:[{k:"花粉",r:"KAFUN",m:"Polen"},{k:"粉々",r:"konagona",m:"Paramparça, parçalar hâlinde"},{k:"麦粉",r:"mugiko",m:"Buğday unu"}],ex:[{s:"小麦___でパンを作った。",tr:"Un ile ekmek yaptım.",b:"粉",br:"kona"}]},
  {n:606,ch:"兵",mn:"Asker / Silah",on:["HEI", "HYŌ"],kun:[],or:"OBI ve mühür formlar. OBI formu balta benzeri aletleri iki eliyle tutan kişiyi gösterir; 'düzleştirme aleti kullanmak'. Genişletilmiş anlamlar 'düşmanı vurmak', 'silah', 'asker'.",mm:"⚔️ ASKER MASADAN BALTA ALARAK SİLAH OLARAK KULLANIR",cp:[{k:"兵士",r:"HEISHI",m:"Asker, er"},{k:"歩兵",r:"HOHEI",m:"Piyade"},{k:"兵器",r:"HEIKI",m:"Silah"}],ex:[{s:"___士が守っている。",tr:"Asker koruyor.",b:"兵",br:"HEI"}]},
  {n:607,ch:"別",mn:"Ayrılmak / Farklı / Özel",on:["BETSU"],kun:["wakareru"],or:"Geç dönem karakter (Shuowen). 'Bıçak' ve fonetik unsur ('kafatası' ya da 'oksipital kemik' ya da 'kemik') içerir; 'eti kemikten bıçakla ayırmak'. 'Özel' ödünç anlamdır.",mm:"🔪 ÖZEL GÜÇLE AÇILIŞI BÖLMEK İÇİN BLAKELIVE KULLAN",cp:[{k:"別名",r:"BETSUMEI",m:"Diğer ad, takma ad"},{k:"特別",r:"TOKUBETSU",m:"Özel, hususi"},{k:"別れ",r:"wakare",m:"Ayrılık, veda"}],ex:[{s:"友達と___れた。",tr:"Arkadaşımla ayrıldım.",b:"別",br:"waka"}]},
  {n:608,ch:"辺",mn:"Çevre / Sınır",on:["HEN"],kun:["atari", "be"],or:"Bronz ve mühür formlar. 'Yürümek/gitmek' ve fonetik unsur ('görememe' ya da 'burnun her iki yanı' > 'sınır' çağrışımlı) içerir; 'sınır boyunca yürümek'. 'Çevre, yakın' genişletilmiş anlamdır.",mm:"🔪 HAREKET SINIRI KESİP GEÇİYOR",cp:[{k:"辺境",r:"HENKYŌ",m:"Sınır bölgesi, ücra"},{k:"近辺",r:"KINPEN",m:"Çevre, yakın"},{k:"川辺",r:"kawabe",m:"Nehir kıyısı"}],ex:[{s:"この___に公園がある。",tr:"Bu civarda park var.",b:"辺",br:"HEN"}]},
  {n:609,ch:"変",mn:"Değişmek / Tuhaf",on:["HEN"],kun:["kaeru", "kawaru"],or:"Mühür ve geleneksel formlar. 'Vurmak' ve fonetik unsur ('iplik dolanmış'; 'devirerek farklı bir şeye dönüştürmek' çağrışımlı) içerir. 'Tuhaf' genişletilmiş anlamdır.",mm:"🦵 ÇAPRAZ BACAKLIYKEN TUHAF KIRMIZIYA DEĞİŞ",cp:[{k:"変成",r:"HENSEI",m:"Dönüşüm, başkalaşım"},{k:"大変",r:"TAIHEN",m:"Çok, son derece"},{k:"変わり者",r:"kawarimono",m:"Acayip/tuhaf kişi"}],ex:[{s:"天気が___わった。",tr:"Hava değişti.",b:"変",br:"ka"}]},
  {n:610,ch:"便",mn:"Rahatlık / Posta / Hizmet",on:["BEN", "BIN"],kun:["tayori"],or:"Geç dönem karakter (Shuowen). 'Kişi' ve fonetik unsur ('değişmek'; 'hizmetçi kullanmak' çağrışımlı) içerir; 'hizmetçi kullanmak'. 'Bedensel atık' ise mecaz olarak genişletilmiş anlamdır.",mm:"📬 DEĞİŞEN POSTACI KULLANIŞLİ HİZMET SUNUYOR",cp:[{k:"便利",r:"BENRI",m:"Uygun, kullanışlı"},{k:"便所",r:"BENJO",m:"Tuvalet (kaba)"},{k:"郵便",r:"YŪBIN",m:"Posta, postalanmış"}],ex:[{s:"郵___で送った。",tr:"Postayla gönderdim.",b:"便",br:"BIN"}]},
  {n:611,ch:"包",mn:"Sarmak / Örtmek",on:["HŌ"],kun:["tsutsumu"],or:"OBI ve mühür formlar. 'Eğilip öne sarılan ve bir şeyi kapsayan kişi' ve fonetik unsur ('rahminde bebek' çağrışımlı) içerir; 'hamile olmak' ve dolayısıyla 'örtmek, sarmak'.",mm:"🐍 YILAN GİBİ EMBRİYO RAHİMDE SARILIYOR",cp:[{k:"小包",r:"kozutsumi",m:"Paket, koli"},{k:"包囲",r:"HŌI",m:"Çevrelemek, kuşatmak"},{k:"包帯",r:"HŌTAI",m:"Sargı, bandaj"}],ex:[{s:"プレゼントを___んだ。",tr:"Hediyeyi sardım.",b:"包",br:"tsutsu"}]},
  {n:612,ch:"法",mn:"Yasa / Kural",on:["HŌ", "HATSU"],kun:[],or:"Bronz ve mühür formlar. 'Su' ve fonetik unsur ('çevrelemek, çevreleyerek suyun akmasını engellemek' çağrışımlı) içerir. Temel anlam 'çerçeve/yapı oluşturmak' > 'yöntem, kural, yasa'.",mm:"⚖️ YASA SUYUN GİTMESİNİ GEREKTİRİYOR",cp:[{k:"法学",r:"HŌGAKU",m:"Hukuk"},{k:"文法",r:"BUNPŌ",m:"Dilbilgisi"},{k:"不法",r:"FUHŌ",m:"Yasa dışı"}],ex:[{s:"交通___規を守る。",tr:"Trafik kurallarına uyuyorum.",b:"法",br:"HŌ"}]},
  {n:613,ch:"望",mn:"Dilemek / Ummak / Bakmak",on:["BŌ", "MŌ"],kun:["nozomu", "nozomashii"],or:"OBI, bronz ve mühür formlar. Karmaşık bir evrim geçirdi. OBI formu 'parmak ucunda duran ve uzağa bakan abartılmış gözlü kişi' gösterir; 'uzağa bakmak' ve 'dolunay'. 'Umut etmek' genişletilmiş anlamdır",mm:"🌕 KRAL AYA BAKIYOR, ÖLÜMÜ DİLİYOR",cp:[{k:"失望",r:"SHITSUBŌ",m:"Hayal kırıklığı, ümitsizlik"},{k:"願望",r:"GANMŌ",m:"Dilek, istek"},{k:"望みて",r:"nozomite",m:"Talip, aday"}],ex:[{s:"将来の___みを語った。",tr:"Gelecek umutlarımı anlattım.",b:"望",br:"nozomu"}]},
  {n:614,ch:"牧",mn:"Otlak / Mera",on:["BOKU"],kun:["maki"],or:"OBI ve mühür formlar. 'İnek/öküz' ve fonetik unsur ('sopa ile vurmak'; 'sopayla sürü yönetmek' çağrışımlı) içerir; 'sopayla sığır güden' > 'otlamak' ve 'sürünün otladığı arazi'.",mm:"🐄 SOPAYLA İNEĞİ OTLAĞA SÜREN EL",cp:[{k:"牧場",r:"BOKUJŌ",m:"Çiftlik, otlak"},{k:"放牧",r:"HŌBOKU",m:"Otlatmak, mera"},{k:"牧鳥",r:"makibatori",m:"Mera kırlangıcı"}],ex:[{s:"___場で馬を見た。",tr:"Çiftlikte at gördüm.",b:"牧",br:"BOKU"}]},
  {n:615,ch:"末",mn:"Son / Uç",on:["MATSU", "BATSU"],kun:["sue"],or:"Ağacın tepesine odaklanmayı gösteren üst yatay çizgiyle ağaç piktogramı. Yorumlar farklılık gösterse de anlam fiziksel ve soyut 'uç, son'dur.",mm:"🌳 AĞACIN UCU BÜYÜK BİR SONA SAHİP",cp:[{k:"週末",r:"SHŪMATSU",m:"Hafta sonu"},{k:"末っ子",r:"suekko",m:"En küçük çocuk"},{k:"始末",r:"SHIMATSU",m:"Çözme, yönetme"}],ex:[{s:"週___に旅行する。",tr:"Hafta sonu seyahat edeceğim.",b:"末",br:"MATSU"}]},
  {n:616,ch:"満",mn:"Dolu / Doldurmak",on:["MAN"],kun:["michiru", "masu"],or:"Geç dönem karakter (Shuowen). 'Su' ve fonetik unsur ('kabak iki yarısını birleştirmek'; 'tamamen doldurmak' çağrışımlı) içerir; 'su taşana kadar doldurmak' > 'dolu'.",mm:"🌿 HEM OT HEM DE SU DOLDURABILIR",cp:[{k:"満月",r:"MANGETSU",m:"Dolunay"},{k:"満足",r:"MANZOKU",m:"Tatmin, memnuniyet"},{k:"不満",r:"FUMAN",m:"Memnuniyetsizlik"}],ex:[{s:"電車が___員だった。",tr:"Tren doluydu.",b:"満",br:"MAN"}]},
  {n:617,ch:"未",mn:"Olgunlaşmamış / Henüz değil",on:["MI"],kun:["mada"],or:"OBI ve mühür formlar. OBI formları ekstra üst çizgilerle lüks büyümeyi gösteren ağacı temsil eder. Ancak çok erken dönemde 'henüz değil' için fonetik ödünç olarak kullanıldı.",mm:"🌱 OLGUNLAŞMAMIS AĞACIN KÜÇÜK UCU HENÜZ BİTMEDİ",cp:[{k:"未来",r:"MIRAI",m:"Gelecek"},{k:"未知",r:"MICHI",m:"Bilinmeyen"},{k:"未来",r:"MIRAI",m:"Gelecek"}],ex:[{s:"___来の夢を語った。",tr:"Gelecek hayallerimi anlattım.",b:"未",br:"MI"}]},
  {n:618,ch:"脈",mn:"Damar / Nabız",on:["MYAKU"],kun:[],or:"Mühür formlar. İlk form 'kan' ve 'kol nehri' (anlamsal ve fonetik); ikinci form 'et/beden' ve fonetik içerir. Her iki form da 'damar' anlamına geliyor, ikincisi baskın hâle geldi.",mm:"🌊 DAMARLAR ETİN İÇİNDE AKAN KOL IRMAKLARI",cp:[{k:"脈管",r:"MYAKKAN",m:"Kan damarı"},{k:"鉱脈",r:"KŌMYAKU",m:"Maden damarı"},{k:"山脈",r:"SANMYAKU",m:"Dağ silsilesi"}],ex:[{s:"山___が続いている。",tr:"Dağ silsilesi devam ediyor.",b:"脈",br:"MYAKU"}]},
  {n:619,ch:"民",mn:"Halk / Kitle",on:["MIN"],kun:["tami"],or:"Bronz ve mühür formlar. Yorumlar farklılık gösterir: ya buz delgisinin piktogramı ya da köle/suçlunun gözünü kör etme cezasının tasviri. 'Halk, kitle' ödünç anlamdır.",mm:"👤 HALK, BİR KLANDAN DAHA ÖZLÜDÜR",cp:[{k:"国民",r:"KOKUMIN",m:"Millet, ülke halkı"},{k:"民間",r:"MINKAN",m:"Özel sektör"},{k:"民主的",r:"MINSHUTEKI",m:"Demokratik"}],ex:[{s:"___主主義を守る。",tr:"Demokrasiyi koruyorum.",b:"民",br:"MIN"}]},
  {n:620,ch:"無",mn:"Değil / Yok / Olmak",on:["MU", "BU"],kun:["nai", "nashi"],or:"Bronz ve mühür formlar. Başlangıçta 'dans' grafiğiyle aynı şekildeydi. Benzer sesli başka bir kelimeyi temsil etmek için fonetik ödünç olarak kullanıldı ve 'olmamak' anlamı hâkim oldu.",mm:"🌾 BAĞLANMIŞ BUĞDAY DEMETİ YAKILDI, ARTIK YOK",cp:[{k:"無料",r:"MURYŌ",m:"Ücretsiz, bedava"},{k:"無事",r:"BUJI",m:"Güvende, hasarsız"},{k:"無駄",r:"MUDA",m:"Boşuna"}],ex:[{s:"___理をしないでください。",tr:"Kendinizi zorlamayın.",b:"無",br:"MU"}]},
  {n:621,ch:"約",mn:"Söz / Yaklaşık / Özetlemek",on:["YAKU"],kun:[],or:"Mühür formu. 'İplik/kordon' ve fonetik unsur ('ladlele kaba şarap/çorba koymak'; 'bağlamak, tutturmak' çağrışımlı) içerir; 'ipi sıkıca bağlamak'. Anlaşmalar bağlamadan türemiştir. 'Yaklaşık' ise azalt",mm:"🥄 KEPÇEYE İPLİKLERI BAĞLAMA SÖZU VERME",cp:[{k:"約束",r:"YAKUSOKU",m:"Söz, vaat"},{k:"節約",r:"SETSUYAKU",m:"Tasarruf etmek"},{k:"約10人",r:"YAKUJŪNIN",m:"Yaklaşık 10 kişi"}],ex:[{s:"レストランを予___した。",tr:"Restoran rezervasyonu yaptım.",b:"約",br:"YAKU"}]},
  {n:622,ch:"勇",mn:"Cesur / Yiğit",on:["YŪ"],kun:["isamu", "isamashii"],or:"Bronz ve mühür formlar. Bronz form 'halberd' ve 'güç' içerir. Mühür formda fonetik unsur 'fışkırmak' çağrışımlıdır; 'güç fışkırır' > 'cesaret'.",mm:"🧓 BÜKÜK YAŞLI ADAM HÂLÂ CESUR VE YİĞİT",cp:[{k:"勇者",r:"YŪSHA",m:"Kahraman, yiğit"},{k:"勇気",r:"YŪKI",m:"Cesaret, yüreklilik"},{k:"勇み足",r:"isamiashi",m:"Aceleci adım, ataklanma"}],ex:[{s:"___気を出して挑戦した。",tr:"Cesaret gösterip meydan okudum.",b:"勇",br:"YŪ"}]},

function build(){
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const sh=a=>[...a].sort(()=>Math.random()-0.5);
  const dMn=(ex,n)=>sh(K.filter(k=>k.ch!==ex.ch)).slice(0,n).map(k=>k.mn);
  const dCh=(ex,n)=>sh(K.filter(k=>k.ch!==ex.ch)).slice(0,n).map(k=>k.ch);
  const dCpM=(ex,n)=>{const p=[];K.filter(k=>k.ch!==ex.ch).forEach(k=>k.cp.forEach(c=>p.push(c.m)));return sh(p).slice(0,n);};
  const dRd=(ex,n)=>{const p=[];K.filter(k=>k.ch!==ex.ch).forEach(k=>[...k.on,...k.kun].forEach(r=>{if(r)p.push(r);}));return sh(p).slice(0,n);};
  const qs=[];
  // KA: 80 soru
  sh([...K]).slice(0,80).forEach(k=>{
    const ans=k.mn;
    const d=sh(dMn(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'ka',lb:'Kanji → Anlam',lc:'tlm',ch:k.ch,
      q:'Bu kanji ne anlama gelir?',ans,opts:sh([ans,...d]),sc:true});
  });
  // CM: 80 soru
  const cmPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    const ans=cp.m;
    const d=sh(dCpM(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length>=5)cmPool.push({k,cp,ans,d});
  }));
  sh(cmPool).slice(0,80).forEach(({k,cp,ans,d})=>{
    qs.push({tp:'cm',lb:'Bileşik → Anlam',lc:'tlc',ch:k.ch,
      q:'"'+cp.k+'" ('+cp.r+') kelimesinin anlamı nedir?',
      ans,opts:sh([ans,...d]),sc:false});
  });
  // BF: 35 soru
  const bfPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    if(!cp.k.includes(k.ch))return;
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length>=5)bfPool.push({k,cp,d});
  }));
  sh(bfPool).slice(0,35).forEach(({k,cp,d})=>{
    const blank=cp.k.replace(k.ch,'___');
    qs.push({tp:'bf',lb:'Boşluk Doldurma',lc:'tlr',ch:k.ch,
      q:'"'+blank+'" ('+cp.m+') — boşluğa hangi kanji gelir?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
  });
  // EX: 35 soru
  const exPool=K.filter(k=>k.ex&&k.ex.length>0);
  let exC=0;
  sh(exPool).forEach(k=>{
    if(exC>=35)return;
    const ex=k.ex[0];
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length<5)return;
    const q=ex.s.replace(new RegExp(ex.b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'___');
    qs.push({tp:'ex',lb:'Cümle → Kanji',lc:'tlr',ch:k.ch,
      q:'"'+q+'" — boşluk hangi kanji?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
    exC++;
  });
  // CK: 35 soru
  const ckPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    const ans=k.mn;
    const d=sh(dMn(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length>=5)ckPool.push({k,cp,ans,d});
  }));
  sh(ckPool).slice(0,35).forEach(({k,cp,ans,d})=>{
    qs.push({tp:'ck',lb:'Bileşikteki Anlam',lc:'tlm',ch:k.ch,
      q:'"'+cp.k+'" kelimesindeki "'+k.ch+'" kanjisi ne anlama gelir?',
      ans,opts:sh([ans,...d]),sc:false});
  });
  // KR: 18 soru
  const krPool=K.filter(k=>(k.on.length+k.kun.length)>0);
  let krC=0;
  sh(krPool).forEach(k=>{
    if(krC>=18)return;
    const rds=[...k.on,...k.kun].filter(Boolean);
    if(!rds.length)return;
    const ans=rnd(rds);
    const d=sh(dRd(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'kr',lb:'Kanji → Okunuş',lc:'tlr',ch:k.ch,
      q:'Bu kanjinin okunuşlarından biri nedir?',
      ans,opts:sh([ans,...d]),sc:true});
    krC++;
  });
  // RK: 17 soru
  const rkPool=K.filter(k=>k.on.length>0);
  let rkC=0;
  sh(rkPool).forEach(k=>{
    if(rkC>=17)return;
    const rd=rnd(k.on);
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'rk',lb:'Okunuş → Kanji',lc:'tlm',ch:k.ch,
      q:'"'+rd+'" okunuşuna sahip kanji hangisidir?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
    rkC++;
  });
  return sh(qs);
}

let tqs=[],ti=0,sc=0,ans={};
function startExam(){
  tqs=build(); ti=0; sc=0; ans={};
  document.getElementById('heroWrap').style.display='none';
  document.getElementById('rv').style.display='none';
  document.getElementById('tv').style.display='block';
  renderQ();
}
function renderQ(){
  const q=tqs[ti],tot=tqs.length,pct=Math.round(ti/tot*100);
  const typeCols={tlm:'var(--p600)',tlc:'var(--t400)',tlr:'var(--a600)'};
  const tc=typeCols[q.lc]||'var(--p600)';
  document.getElementById('tv').innerHTML=`
    <div class="tw">
      <div class="tprog">
        <div class="tpbar"><div class="tpfill" style="width:${pct}%"></div></div>
        <div class="tpnum">${ti+1} / ${tot}</div>
      </div>
      <div class="tcard">
        <div class="tlabel" style="color:${tc}">${q.lb}</div>
        ${q.sc?`<div class="tkanji">${q.ch}</div>`:''}
        <div class="tq">${q.q}</div>
        <div class="topts">
          ${q.opts.map((o,i)=>`<button class="topt" onclick="doAns(${i})">${o}</button>`).join('')}
        </div>
        <div class="tfb" id="fb" style="display:none"></div>
        <button class="tnext" id="nq" onclick="nextQ()" style="display:none">
          ${ti===tot-1?'Sonuçları Gör →':'Sonraki →'}
        </button>
      </div>
    </div>`;
}
function doAns(i){
  const q=tqs[ti];
  const sel=q.opts[i];
  const ok=sel===q.ans;
  if(ok)sc++;
  ans[ti]={q:q.q,ch:q.ch,ans:q.ans,sel,ok,tp:q.tp,lb:q.lb};
  document.querySelectorAll('.topt').forEach((b,j)=>{
    b.disabled=true;
    if(j===i)b.classList.add(ok?'ok':'ng');
    if(q.opts[j]===q.ans&&!ok)b.classList.add('show');
  });
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='tfb '+(ok?'ok':'ng');
  fb.textContent=ok?'✅ Doğru!':'❌ Yanlış — Doğru: '+q.ans;
  document.getElementById('nq').style.display='block';
}
function nextQ(){
  ti++;
  if(ti>=tqs.length){showR();return;}
  renderQ();
}
function showR(){
  const tot=tqs.length;
  const pct=Math.round(sc/tot*100);
  const emoji=pct>=90?'🏆':pct>=70?'🎯':pct>=50?'📚':'💪';
  const lbl=pct>=90?'Mükemmel':pct>=70?'İyi':pct>=50?'Gelişiyor':'Devam Et';
  const typeMap={};
  tqs.forEach((q,i)=>{
    if(!typeMap[q.tp])typeMap[q.tp]={lb:q.lb,ok:0,tot:0};
    typeMap[q.tp].tot++;
    if(ans[i]&&ans[i].ok)typeMap[q.tp].ok++;
  });
  const tsum=Object.values(typeMap).map(t=>
    `<div class="tsrow"><span class="tslb">${t.lb}</span><span class="tspct">${t.ok}/${t.tot}</span></div>`
  ).join('');
  document.getElementById('tv').style.display='none';
  const rv=document.getElementById('rv');
  rv.style.display='block';
  rv.innerHTML=`
    <div class="rcard">
      <div class="remoji">${emoji}</div>
      <div class="rscore">${sc} / ${tot}</div>
      <div class="rlabel">${lbl} · %${pct}</div>
      <div class="rstats">
        <div class="rsbox"><div class="rsbv rg">${sc}</div><div class="rsbl">Doğru</div></div>
        <div class="rsbox"><div class="rsbv rr">${tot-sc}</div><div class="rsbl">Yanlış</div></div>
        <div class="rsbox"><div class="rsbv">${tot}</div><div class="rsbl">Toplam</div></div>
      </div>
      <div class="slabel">Tip Bazında Sonuç</div>
      <div class="tsum">${tsum}</div>
      <button class="rbtn" onclick="location.reload()">Tekrar Başla</button>
      <a class="rbtn" href="index.html" style="display:inline-block;margin-top:8px">Ana Sayfa</a>
    </div>`;
}
