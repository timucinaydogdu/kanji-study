<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Büyük Sınav — Kanji #1–80 (First Grade)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#e8e8e7;--text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--p50:#EEEDFE;--p200:#AFA9EC;--p600:#534AB7;--p800:#3C3489;--p900:#26215C;--t50:#E1F5EE;--t400:#1D9E75;--t600:#0F6E56;--t800:#085041;--a50:#FAEEDA;--a600:#BA7517;--a800:#633806;--a900:#412402;--r50:#FCEBEB;--r600:#A32D2D;--r800:#501313;--rm:8px;--rl:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#242422;--bg3:#2e2e2c;--text:#f0f0ee;--text2:#b0b0ae;--text3:#707070;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);--p50:#26215C;--p200:#3C3489;--p600:#AFA9EC;--p800:#CECBF6;--p900:#EEEDFE;--t50:#04342C;--t600:#9FE1CB;--t800:#9FE1CB;--a50:#412402;--a800:#FAC775;--a900:#FAC775;--r50:#501313;--r600:#F09595;--r800:#FCEBEB;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg3);min-height:100vh;padding:2rem 1rem;}
.app{width:100%;max-width:680px;margin:0 auto;}
a.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);text-decoration:none;margin-bottom:1.25rem;}
a.back:hover{color:var(--text);}
.hero{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.5rem;margin-bottom:1.5rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.hero-chars{font-family:'Noto Serif JP',serif;font-size:28px;color:var(--p900);letter-spacing:6px;margin-bottom:8px;}
.hero-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px;}
.hero-sub{font-size:13px;color:var(--text2);margin-bottom:1rem;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hstat{background:var(--bg2);border-radius:var(--rm);padding:10px 8px;text-align:center;}
.hstat-val{font-size:20px;font-weight:600;color:var(--p800);}
.hstat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.start-btn{margin-top:1.25rem;width:100%;padding:14px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.start-btn:hover{background:var(--p800);}
/* TEST */
.twrap{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.thead{background:var(--a50);border-bottom:0.5px solid var(--a600);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.ttitle{font-size:14px;font-weight:500;color:var(--a900);}
.tscore{font-size:13px;color:var(--a800);}
.pstrip{height:5px;background:var(--bg2);}
.pstrip-fill{height:100%;background:linear-gradient(90deg,var(--p600),var(--t400));transition:width 0.4s;}
.tbody{padding:1.5rem;}
.tqlabel{display:inline-block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;padding:3px 10px;border-radius:20px;margin-bottom:12px;}
.tlc{background:var(--p50);color:var(--p800);}
.tlm{background:var(--t50);color:var(--t800);}
.tlr{background:var(--a50);color:var(--a800);}
.tq{font-size:15px;color:var(--text);line-height:1.6;}
.tchar{font-family:'Noto Serif JP',serif;font-size:72px;font-weight:700;color:var(--p900);text-align:center;margin:0.75rem 0 1rem;display:block;}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1.25rem;}
.topt{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--rm);padding:13px 16px;font-size:14px;cursor:pointer;color:var(--text);text-align:left;font-family:inherit;transition:background 0.15s;line-height:1.4;}
.topt:hover:not(:disabled){background:var(--p50);border-color:var(--p200);}
.topt.correct{background:var(--t50);border-color:var(--t400);color:var(--t800);font-weight:500;}
.topt.wrong{background:var(--r50);border-color:var(--r600);color:var(--r800);}
.tfb{margin-top:1rem;padding:10px 14px;border-radius:var(--rm);font-size:13px;line-height:1.5;display:none;}
.tfb.show{display:block;}
.tfb.ok{background:var(--t50);color:var(--t800);border-left:2px solid var(--t400);}
.tfb.bad{background:var(--r50);color:var(--r800);border-left:2px solid var(--r600);}
.tnext{margin-top:1.25rem;width:100%;padding:12px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:none;}
.tnext:hover{background:var(--p800);}
.tnext.show{display:block;}
/* RESULT */
.rwrap{padding:2rem 1.5rem;}
.r-top{text-align:center;margin-bottom:1.5rem;}
.remoji{font-size:52px;margin-bottom:0.75rem;}
.rscore{font-size:42px;font-weight:600;color:var(--p800);margin-bottom:0.25rem;}
.rlabel{font-size:16px;color:var(--text2);margin-bottom:1.5rem;}
.rbdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem;}
.rbc{background:var(--bg2);border-radius:var(--rm);padding:12px 8px;text-align:center;}
.rbv{font-size:24px;font-weight:600;}
.rbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.rg{color:var(--t600);}.rr{color:var(--r600);}.rgr{color:var(--text3);}
.tsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.5rem;}
.tsc{background:var(--bg2);border-radius:var(--rm);padding:10px 12px;}
.tsl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.tsv{font-size:15px;font-weight:500;color:var(--text);}
.slabel{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--text3);}
.btn-row{display:flex;gap:8px;margin-bottom:1.5rem;}
.rbtn{flex:1;padding:12px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
.rbtn:hover{background:var(--p800);}
.rbtn.sec{background:var(--bg2);color:var(--text);border:0.5px solid var(--border2);}
.wrong-list{margin-top:1.25rem;border-top:0.5px solid var(--border);padding-top:1.25rem;}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.wchar{font-family:'Noto Serif JP',serif;font-size:28px;font-weight:700;min-width:40px;color:var(--text);}
.winfo{flex:1;}
.wmean{font-size:13px;color:var(--text);font-weight:500;}
.wqtype{font-size:11px;color:var(--text2);margin-top:1px;}
.wanswers{font-size:12px;margin-top:3px;}
.wgiven{color:var(--r600);}
.wcorrect{color:var(--t600);}
</style>
</head>

  {n:53,ch:"草",mn:"Çimen / Bitki",on:["SŌ"],kun:["kusa"],or:"Geç dönem karakter (Shuowen). Üst kısım bitkinin kısa formu, alt kısım 早 (erken, hızlı) fonetik unsur olarak palamut anlamı verdi; ancak erken dönemde çimen/bitki anlamı baskın hale geldi.",mm:"🌿 ÇİMEN HIZLA BÜYÜR",cp:[{k:"雑草",r:"ZASSŌ",m:"Yabani ot"},{k:"草書",r:"SŌSHO",m:"Kursif yazı"},{k:"草地",r:"kusaCHI",m:"Çayırlık, otlak"}],ex:[{s:"___原を歩いた。",tr:"Çimenlikte yürüdüm.",b:"草",br:"kusa"}]},
  {n:54,ch:"足",mn:"Bacak / Ayak / Yetmek",on:["SOKU"],kun:["ashi", "tariru"],or:"OBI formu dizden ayağa kadar bir bacağın piktogramıdır. Bu aşamada 正 (doğru) ile sıklıkla aynı şekilde yazılırdı. Yetmek anlamı ödünç kullanımdır.",mm:"🦵 YUVARLAK DİZ VE AYAK BACAĞI GÖSTERİR",cp:[{k:"不足",r:"FUSOKU",m:"Yetersizlik, eksiklik"},{k:"足首",r:"ashikubi",m:"Ayak bileği"},{k:"足音",r:"ashioto",m:"Ayak sesi"}],ex:[{s:"___が痛くて歩けない。",tr:"Ayağım ağrıyor yürüyemiyorum.",b:"足",br:"ashi"}]},
  {n:55,ch:"村",mn:"Köy",on:["SON"],kun:["mura"],or:"Geç dönem karakter, Shuowen sözlüğünde yer almaz. Ogawa bunu bir cila ağacının varyantı olarak değerlendirir. Köy anlamı fonetik ödünç yoluyla kazanıldı; 木 (ağaç) ve ölçü anlamındaki unsurdan oluşur.",mm:"🌲 AĞAÇLARI ÖLÇEREK KÖY KURARSUN",cp:[{k:"村長",r:"SONCHŌ",m:"Köy muhtarı"},{k:"農村",r:"NŌSON",m:"Tarım köyü"},{k:"村人",r:"murabito",m:"Köylü"}],ex:[{s:"小さな___に住んでいる。",tr:"Küçük bir köyde yaşıyorum.",b:"村",br:"mura"}]},
  {n:56,ch:"大",mn:"Büyük",on:["DAI", "TAI"],kun:["kii", "ōkii"],or:"Kolları ve bacakları açık yetişkin bir insanın piktogramına dayanır. Büyük anlamı genişletilmiş bir anlam olarak kullanılır.",mm:"🙆 KİŞİ KOL VE BACAKLARINI AÇINCA BÜYÜK GÖRÜNÜR",cp:[{k:"大会",r:"TAIKAI",m:"Büyük toplantı, turnuva"},{k:"大学",r:"DAIGAKU",m:"Üniversite"},{k:"大声",r:"ōgoe",m:"Yüksek ses"}],ex:[{s:"___きな犬が走ってきた。",tr:"Büyük bir köpek koşarak geldi.",b:"大",br:"ōki"}]},
  {n:57,ch:"男",mn:"Erkek / Adam",on:["DAN", "NAN"],kun:["otoko"],or:"OBI formu 田 (tarla) ve 力 (güç) unsurlarından oluşur. Güç başlangıçta bir sabanı temsil etmiş olabilir; ancak erken formlar tarlada çalışan bir kol gösterir — erkeklerle ilişkilendirilir.",mm:"💪 ERKEK TARLADA GÜÇ SAĞLAR",cp:[{k:"男子",r:"DANSHI",m:"Erkek çocuk, oğlan"},{k:"長男",r:"CHŌNAN",m:"En büyük oğul"},{k:"男気",r:"otokogi",m:"Mertlik, yiğitlik"}],ex:[{s:"___の人が道を聞いた。",tr:"Bir adam yol sordu.",b:"男",br:"otoko"}]},
  {n:58,ch:"竹",mn:"Bambu",on:["CHIKU"],kun:["take"],or:"OBI formu alçak, çizgili bir bambu bitkisinin piktogramına dayanır (Mizukami ve Katō). Bambu anlamı genel kullanıma genişledi. Bileşik karakterlerde ⺮ biçimini alır.",mm:"🎋 İKİ BAMBU SEGMENTI",cp:[{k:"爆竹",r:"BAKUCHIKU",m:"Havai fişek (maytap)"},{k:"竹馬",r:"takeuma",m:"Bambu bacaklar (kukla at)"},{k:"竹藪",r:"takeyabu",m:"Bambu korusu"}],ex:[{s:"___林の中を歩く。",tr:"Bambu ormanında yürümek.",b:"竹",br:"take"}]},
  {n:59,ch:"中",mn:"Orta / İçeri / Çin",on:["CHŪ"],kun:["naka"],or:"OBI formları iki kategoride görülür: modern forma benzer olanlar ve flama eklenmiş olanlar — ikincisi bayrak gibi görünür. Temel anlam orta, içeri; uzantı olarak hedefe isabet etmek anlamı da taşır.",mm:"🎯 ÇİN MIZRAKI HEDEFIN ORTASINA SAPLANIR",cp:[{k:"中立",r:"CHŪRITSU",m:"Tarafsızlık"},{k:"中国",r:"CHŪGOKU",m:"Çin"},{k:"真ん中",r:"mannaka",m:"Tam orta"}],ex:[{s:"箱の___に手紙があった。",tr:"Kutunun içinde mektup vardı.",b:"中",br:"naka"}]},
  {n:60,ch:"虫",mn:"Böcek / Solucan",on:["CHŪ"],kun:["mushi"],or:"OBI formu bir yılanın piktogramından gelir. Qiu'ya göre daha sonra anlam kayması yaşandı; Qin ve Han dönemlerinde böcek (geniş anlamda) anlamı baskın hale geldi. Hafıza tekniği: başlığını kaldırmış yılan.",mm:"🐍 BAŞLIKLI YILAN BÖCEK AVLAMAK İÇİN KALKAR",cp:[{k:"寄生虫",r:"KISEICHŪ",m:"Parazit"},{k:"害虫",r:"GAICHŪ",m:"Zararlı böcek"},{k:"虫歯",r:"mushiba",m:"Çürük diş"}],ex:[{s:"夏に___が多い。",tr:"Yazın böcek çok olur.",b:"虫",br:"mushi"}]},
  {n:61,ch:"町",mn:"Kasaba / Blok",on:["CHŌ"],kun:["machi"],or:"Geç dönem karakter (Shuowen). 田 (tarla) ve fonetik unsur 367 (çivi, blok) birleşiminden oluşur. Özgün anlamı tarlalar arasındaki yol iken Japonca'da yol kenarındaki yerleşim anlamını kazandı.",mm:"🏘️ T KAVŞAĞINDAKİ KASABA TARLANIN YANINDADİR",cp:[{k:"町民",r:"CHŌMIN",m:"Kasaba halkı"},{k:"町役場",r:"machiYAKUba",m:"Kasaba belediyesi"},{k:"下町",r:"shitamachi",m:"Şehrin eski semti"}],ex:[{s:"古い___並みが続く。",tr:"Eski şehir manzarası devam ediyor.",b:"町",br:"machi"}]},
  {n:62,ch:"天",mn:"Gök / Cennet",on:["TEN"],kun:["ama-", "ame"],or:"OBI ve bronz formlarda kolları açık duran bir insanın ön profili görülür; 大 (büyük) gibi ancak başı var. Özgün anlamın baş ya da başın tacı olduğu, sonra gökyüzü ve Cennet anlamına genişlediği düşünülür.",mm:"👑 BÜYÜK ADAM GÖKTEN İNERKEN BAŞI EZİLİR",cp:[{k:"天使",r:"TENSHI",m:"Melek"},{k:"天皇",r:"TENNŌ",m:"İmparator"},{k:"天下り",r:"amakudari",m:"Gökten iniş (bürokratik terfi)"}],ex:[{s:"___気がいい日に散歩する。",tr:"Hava güzel günde yürüyüş yaparım.",b:"天",br:"TEN"}]},

  {n:65,ch:"二",mn:"İki",on:["NI"],kun:["futa-"],or:"OBI'de eşit uzunlukta iki yatay çizgi görülür; sonradan üst çizgi kısaltıldı. Basit ve evrensel bir gösterim.",mm:"✌️ İKİ ÇIZGI İKİ DEMEK, BİRİ KISA OLSA BİLE",cp:[{k:"二月",r:"NIGATSU",m:"Şubat"},{k:"二十",r:"NIJŪ",m:"Yirmi"},{k:"二人",r:"futari",m:"İki kişi"}],ex:[{s:"___人で映画を見た。",tr:"İkimiz birlikte film izledik.",b:"二",br:"NI"}]},
  {n:66,ch:"日",mn:"Güneş / Gün",on:["NICHI", "JITSU"],kun:["hi", "-ka"],or:"Güneşin piktogramına dayanır; soyut bir şekilden ayırt edilmek için içine nokta ya da çizgi eklendi. Gün anlamı doğal bir genişlemedir.",mm:"☀️ GÜNEŞ DOĞRULTUSUNDA YENİ BİR GÜN BAŞLAR",cp:[{k:"日曜日",r:"NICHIYŌbi",m:"Pazar"},{k:"本日",r:"HONJITSU",m:"Bugün (resmi)"},{k:"二日",r:"futsuka",m:"İkinci gün"}],ex:[{s:"今___は月曜日だ。",tr:"Bugün Pazartesi.",b:"日",br:"hi"}]},
  {n:67,ch:"入",mn:"Girmek / İçine koymak",on:["NYŪ"],kun:["hairu", "ireru"],or:"OBI ve bronz formlar bir konutun girişini tasvir eder. Modern stilize form eğilerek giren bir kişi gibi görünür — bu yanlış ama iyi bir hafıza aracıdır.",mm:"🚪 TERS V'DEN EĞILEREK İÇERİ GİR",cp:[{k:"輸入",r:"YUNYŪ",m:"İthalat"},{k:"入口",r:"iriguchi",m:"Giriş"},{k:"入れ物",r:"iremono",m:"Kap, kutu"}],ex:[{s:"部屋に___った。",tr:"Odaya girdim.",b:"入",br:"hai"}]},
  {n:68,ch:"年",mn:"Yıl",on:["NEN"],kun:["toshi"],or:"OBI formları çeşitli yorumlanır. Sırtında tahıl taşıyan bir adamı tasvir ediyor olabilir — yıllık hasat ve döngüyü simgeler. Shirakawa iyi hasat duası töreninde tahıl taşıyan dans eden adam olarak yorumlar.",mm:"🌾 KİŞİ HER YIL BOZUK BİR KUYUYU ZİYARET EDER",cp:[{k:"来年",r:"RAINEN",m:"Gelecek yıl"},{k:"五年生",r:"GONENSEI",m:"Beşinci sınıf öğrencisi"},{k:"年寄り",r:"toshiyori",m:"Yaşlı kişi"}],ex:[{s:"来___日本へ行く。",tr:"Gelecek yıl Japonya'ya gideceğim.",b:"年",br:"NEN"}]},
  {n:69,ch:"白",mn:"Beyaz",on:["HAKU"],kun:["shiroi", "shira-"],or:"OBI formları çeşitli yorumlanmıştır: ağartılmış kafatası (Shirakawa), soluk palamut (Schuessler), soluk başparmak (Katō). Beyaz anlamı fonetik ödünç kullanım olabilir.",mm:"☀️ GÜNEŞ ÇARPMASI SENI BEYAZ BIRAKIR",cp:[{k:"白書",r:"HAKUSHO",m:"Beyaz kitap (resmi rapor)"},{k:"面白い",r:"omoshiroi",m:"İlginç, eğlenceli"},{k:"白髪",r:"shiraga",m:"Beyaz saç, ak saç"}],ex:[{s:"___い雪が降った。",tr:"Beyaz kar yağdı.",b:"白",br:"shiro"}]},
  {n:70,ch:"八",mn:"Sekiz",on:["HACHI"],kun:["ya-"],or:"Tüm erken formlar bölünmeyi ya da ayrılmayı tasvir eder; bu grafik sekiz için fonetik ödünç alındı. Hala bileşik karakterlerde dağılma ve ayrılma anlamı taşır.",mm:"✌️ SEKİZ KOLAYCA BÖLÜNÜR",cp:[{k:"八月",r:"HACHIGATSU",m:"Ağustos"},{k:"八百屋",r:"yaoya",m:"Manav"},{k:"八日",r:"yōka",m:"Sekizinci gün"}],ex:[{s:"___月は暑い。",tr:"Ağustos sıcaktır.",b:"八",br:"HACHI"}]},
  {n:71,ch:"百",mn:"Yüz",on:["HYAKU"],kun:[],or:"OBI ve bronz formlarda 白 (beyaz) üzerine bir yatay çizgi eklenir. Erken Çincede yüz ve beyaz sözcükleri benzer seslerdi. Katō başparmağın yüzü ifade ettiğini öne sürer.",mm:"👍 BİR BEYAZ BAŞPARMAK YÜZ PALAMUTA BEDELDIR",cp:[{k:"百倍",r:"HYAKUBAI",m:"Yüz kat"},{k:"百姓",r:"HYAKUSHŌ",m:"Çiftçi, köylü"},{k:"百貨店",r:"HYAKKATEN",m:"Büyük mağaza"}],ex:[{s:"___円玉を持っている。",tr:"Yüz yenlik param var.",b:"百",br:"HYAKU"}]},
  {n:72,ch:"文",mn:"Yazı / Metin",on:["BUN", "MON"],kun:["fumi"],or:"OBI ve bronz formların etimolojisi tartışmalıdır. Shirakawa dövme yapılmış bir kişi olarak yorumlarken Ogawa ve Katō boyun giysisi giyen bir figür olarak değerlendirir. Desen ve yazı anlamları genişletilmiş anlamlardır.",mm:"✝️ HAÇ YAZININ EN BASIT BİÇİMİDİR: DAHA İYİSİNİ YAP",cp:[{k:"文学",r:"BUNGAKU",m:"Edebiyat"},{k:"文字",r:"MOJI",m:"Karakter, harf"},{k:"恋文",r:"koibumi",m:"Aşk mektubu"}],ex:[{s:"手紙に___章を書いた。",tr:"Mektuba paragraf yazdım.",b:"文",br:"BUN"}]},
  {n:73,ch:"木",mn:"Ağaç / Tahta",on:["BOKU", "MOKU"],kun:["ki", "ko"],or:"Bir ağacın piktogramına dayanır. Kökleri, gövdesi ve dallarıyla birlikte stilize edilmiştir.",mm:"🌳 GENIŞ DALLARIYLA AĞAÇ — İYİ TAHTA",cp:[{k:"木曜日",r:"MOKUYŌbi",m:"Perşembe"},{k:"木目",r:"kime",m:"Tahta damarı, doku"},{k:"木立",r:"kodachi",m:"Ağaçlık, koru"}],ex:[{s:"公園の___の下で休む。",tr:"Parkta ağacın altında dinlenirim.",b:"木",br:"ki"}]},
  {n:74,ch:"本",mn:"Kök / Kitap / Asıl",on:["HON"],kun:["moto"],or:"Köklerini gösteren ağaç piktogramına dayanır. Kök ya da gövde anlamından kitap anlamına geçiş Çin ve Japonya'da kitapların silindir şeklinde rulolar halinde olmasından kaynaklanır.",mm:"🌲 AĞACIN TOPRAK ALTINDA BİR ANA KÖK İZİ VAR",cp:[{k:"日本",r:"NIHON",m:"Japonya"},{k:"本屋",r:"HONya",m:"Kitapçı"},{k:"本社",r:"HONSHA",m:"Genel merkez"}],ex:[{s:"図書館で___を借りた。",tr:"Kütüphaneden kitap ödünç aldım.",b:"本",br:"HON"}]},
  {n:75,ch:"名",mn:"İsim / Şöhret",on:["MEI", "MYŌ"],kun:["na"],or:"Çeşitli yorumlar mevcuttur. Ağız (口) ve hilal ay (夕) bileşiminden oluştuğu düşünülür — gece karanlığında birini seslenerek çağırmak. Shirakawa en erken formların üç aylık bebeğin adlandırma törenini tasvir ettiğini öne sürer.",mm:"🌙 AY IŞIĞINDA AĞIZ ÜNLÜ İSMİ ÇAĞIRIR",cp:[{k:"有名",r:"YŪMEI",m:"Ünlü, meşhur"},{k:"名字",r:"MYŌJI",m:"Soyadı"},{k:"名前",r:"namae",m:"İsim, ad"}],ex:[{s:"お___前を教えてください。",tr:"Adınızı söyler misiniz?",b:"名",br:"na"}]},

  {n:77,ch:"立",mn:"Ayakta durmak / Kalkmak",on:["RITSU"],kun:["tatsu", "teru"],or:"OBI ve bronz formlar, ayağa kalkmayı vurgulamak için altında zemin olan duran bir kişiyi tasvir eder. Ayrılmak anlamı yükselmekten genişletilmiş bir anlamdır.",mm:"🧍 AYAĞA KALKMAK AYRILMAK DEMEKTİR",cp:[{k:"自立",r:"JIRITSU",m:"Bağımsızlık"},{k:"立場",r:"tachiba",m:"Durum, bakış açısı"},{k:"目立つ",r:"medatsu",m:"Göze çarpmak"}],ex:[{s:"椅子から___ち上がった。",tr:"Sandalyeden kalktım.",b:"立",br:"ta"}]},

// ── BUILD: 300 SORU ─────────────────────────────────────────────────────────
function build(){
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const sh=a=>[...a].sort(()=>Math.random()-0.5);

  const dMn=(ex,n)=>sh(K.filter(k=>k.ch!==ex.ch)).slice(0,n).map(k=>k.mn);
  const dCh=(ex,n)=>sh(K.filter(k=>k.ch!==ex.ch)).slice(0,n).map(k=>k.ch);
  const dCpM=(ex,n)=>{const p=[];K.filter(k=>k.ch!==ex.ch).forEach(k=>k.cp.forEach(c=>p.push(c.m)));return sh(p).slice(0,n);};
  const dRd=(ex,n)=>{const p=[];K.filter(k=>k.ch!==ex.ch).forEach(k=>[...k.on,...k.kun].forEach(r=>{if(r)p.push(r);}));return sh(p).slice(0,n);};

  const qs=[];

  // KA: Kanji→Anlam — 80 soru (her kanji 1 kez)
  sh([...K]).forEach(k=>{
    const ans=k.mn;
    const d=sh(dMn(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'ka',lb:'Kanji → Anlam',lc:'tlm',ch:k.ch,
      q:'Bu kanji ne anlama gelir?',ans,opts:sh([ans,...d]),sc:true});
  });

  // CM: Bileşik→Anlam — 80 soru
  const cmPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    const ans=cp.m;
    const d=sh(dCpM(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length>=5)cmPool.push({k,cp,ans,d});
  }));
  sh(cmPool).slice(0,80).forEach(({k,cp,ans,d})=>{
    qs.push({tp:'cm',lb:'Bileşik → Anlam',lc:'tlc',ch:k.ch,
      q:'"'+cp.k+'" ('+cp.r+') kelimesinin anlamı nedir?',
      ans,opts:sh([ans,...d]),sc:false});
  });

  // BF: Boşluk Doldurma — 35 soru
  const bfPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    if(!cp.k.includes(k.ch))return;
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length>=5)bfPool.push({k,cp,d});
  }));
  sh(bfPool).slice(0,35).forEach(({k,cp,d})=>{
    const blank=cp.k.replace(k.ch,'___');
    qs.push({tp:'bf',lb:'Boşluk Doldurma',lc:'tlr',ch:k.ch,
      q:'"'+blank+'" ('+cp.m+') — boşluğa hangi kanji gelir?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
  });

  // EX: Cümle→Kanji — 35 soru
  const exPool=K.filter(k=>k.ex&&k.ex.length>0);
  sh(exPool).slice(0,35).forEach(k=>{
    const ex=k.ex[0];
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length<5)return;
    const q=ex.s.replace(new RegExp(ex.b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'___');
    qs.push({tp:'ex',lb:'Cümle → Kanji',lc:'tlr',ch:k.ch,
      q:'"'+q+'" — boşluk hangi kanji?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
  });

  // CK: Bileşikteki Anlam — 35 soru
  const ckPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    const ans=k.mn;
    const d=sh(dMn(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length>=5)ckPool.push({k,cp,ans,d});
  }));
  sh(ckPool).slice(0,35).forEach(({k,cp,ans,d})=>{
    qs.push({tp:'ck',lb:'Bileşikteki Anlam',lc:'tlm',ch:k.ch,
      q:'"'+cp.k+'" kelimesindeki "'+k.ch+'" kanjisi ne anlama gelir?',
      ans,opts:sh([ans,...d]),sc:false});
  });

  // KR: Kanji→Okunuş — 18 soru
  const krPool=K.filter(k=>(k.on.length+k.kun.length)>0);
  sh(krPool).slice(0,18).forEach(k=>{
    const rds=[...k.on,...k.kun].filter(Boolean);
    if(!rds.length)return;
    const ans=rnd(rds);
    const d=sh(dRd(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'kr',lb:'Kanji → Okunuş',lc:'tlr',ch:k.ch,
      q:'Bu kanjinin okunuşlarından biri nedir?',
      ans,opts:sh([ans,...d]),sc:true});
  });

  // RK: Okunuş→Kanji — 17 soru
  const rkPool=K.filter(k=>k.on.length>0);
  sh(rkPool).slice(0,17).forEach(k=>{
    const rd=rnd(k.on);
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'rk',lb:'Okunuş → Kanji',lc:'tlm',ch:k.ch,
      q:'"'+rd+'" okunuşuna sahip kanji hangisidir?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
  });

  return sh(qs);
}

// ── DURUM DEĞİŞKENLERİ ─────────────────────────────────────────────────────
let tqs=[],ti=0,sc=0,ans={};

// ── BAŞLAT ──────────────────────────────────────────────────────────────────
function startExam(){
  tqs=build();
  ti=0; sc=0; ans={};
  document.getElementById('heroWrap').style.display='none';
  document.getElementById('rv').style.display='none';
  document.getElementById('tv').style.display='block';
  renderQ();
}

// ── SORU RENDER ─────────────────────────────────────────────────────────────
function renderQ(){
  const q=tqs[ti], tot=tqs.length, pct=Math.round(ti/tot*100);
  const typeCols={tlm:'var(--p600)',tlc:'var(--t400)',tlr:'var(--a600)'};
  const tc=typeCols[q.lc]||'var(--p600)';
  document.getElementById('tv').innerHTML=`
    <div class="tw">
      <div class="tprog">
        <div class="tpbar"><div class="tpfill" style="width:${pct}%"></div></div>
        <div class="tpnum">${ti+1} / ${tot}</div>
      </div>
      <div class="tcard">
        <div class="tlabel" style="color:${tc}">${q.lb}</div>
        ${q.sc?`<div class="tkanji">${q.ch}</div>`:``}
        <div class="tq">${q.q}</div>
        <div class="topts">
          ${q.opts.map((o,i)=>`<button class="topt" onclick="doAns(${i})">${o}</button>`).join('')}
        </div>
        <div class="tfb" id="fb" style="display:none"></div>
        <button class="tnext" id="nq" onclick="nextQ()" style="display:none">
          ${ti===tot-1?'Sonuçları Gör →':'Sonraki →'}
        </button>
      </div>
    </div>`;
}

// ── CEVAP ───────────────────────────────────────────────────────────────────
function doAns(i){
  const q=tqs[ti];
  const sel=q.opts[i];
  const ok=sel===q.ans;
  if(ok)sc++;
  ans[ti]={q:q.q,ch:q.ch,ans:q.ans,sel,ok,tp:q.tp,lb:q.lb};
  document.querySelectorAll('.topt').forEach((b,j)=>{
    b.disabled=true;
    if(j===i) b.classList.add(ok?'ok':'ng');
    if(q.opts[j]===q.ans&&!ok) b.classList.add('show');
  });
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='tfb '+(ok?'ok':'ng');
  fb.textContent=ok?'✅ Doğru!':'❌ Yanlış — Doğru: '+q.ans;
  document.getElementById('nq').style.display='block';
}

// ── SONRAKİ ─────────────────────────────────────────────────────────────────
function nextQ(){
  ti++;
  if(ti>=tqs.length){ showR(); return; }
  renderQ();
}

// ── SONUÇ ───────────────────────────────────────────────────────────────────
function showR(){
  const tot=tqs.length;
  const pct=Math.round(sc/tot*100);
  const emoji=pct>=90?'🏆':pct>=70?'🎯':pct>=50?'📚':'💪';
  const lbl=pct>=90?'Mükemmel':pct>=70?'İyi':pct>=50?'Gelişiyor':'Devam Et';

  const typeMap={};
  tqs.forEach((q,i)=>{
    if(!typeMap[q.tp])typeMap[q.tp]={lb:q.lb,ok:0,tot:0};
    typeMap[q.tp].tot++;
    if(ans[i]&&ans[i].ok)typeMap[q.tp].ok++;
  });
  const tsum=Object.values(typeMap).map(t=>
    `<div class="tsrow"><span class="tslb">${t.lb}</span><span class="tspct">${t.ok}/${t.tot}</span></div>`
  ).join('');

  document.getElementById('tv').style.display='none';
  const rv=document.getElementById('rv');
  rv.style.display='block';
  rv.innerHTML=`
    <div class="rcard">
      <div class="remoji">${emoji}</div>
      <div class="rscore">${sc} / ${tot}</div>
      <div class="rlabel">${lbl} · %${pct}</div>
      <div class="rstats">
        <div class="rsbox"><div class="rsbv rg">${sc}</div><div class="rsbl">Doğru</div></div>
        <div class="rsbox"><div class="rsbv rr">${tot-sc}</div><div class="rsbl">Yanlış</div></div>
        <div class="rsbox"><div class="rsbv">${tot}</div><div class="rsbl">Toplam</div></div>
      </div>
      <div class="slabel">Tip Bazında Sonuç</div>
      <div class="tsum">${tsum}</div>
      <button class="rbtn" onclick="location.reload()">Tekrar Başla</button>
      <a class="rbtn" href="index.html" style="display:inline-block;margin-top:8px">Ana Sayfa</a>
    </div>`;
}
</script>
