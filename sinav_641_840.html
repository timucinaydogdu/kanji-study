<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Büyük Sınav — Kanji #641–840</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#e8e8e7;--text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--p50:#EEEDFE;--p200:#AFA9EC;--p600:#534AB7;--p800:#3C3489;--p900:#26215C;--t50:#E1F5EE;--t400:#1D9E75;--t600:#0F6E56;--t800:#085041;--a50:#FAEEDA;--a600:#BA7517;--a800:#633806;--a900:#412402;--r50:#FCEBEB;--r600:#A32D2D;--r800:#501313;--rm:8px;--rl:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#242422;--bg3:#2e2e2c;--text:#f0f0ee;--text2:#b0b0ae;--text3:#707070;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);--p50:#26215C;--p200:#3C3489;--p600:#AFA9EC;--p800:#CECBF6;--p900:#EEEDFE;--t50:#04342C;--t600:#9FE1CB;--t800:#9FE1CB;--a50:#412402;--a800:#FAC775;--a900:#FAC775;--r50:#501313;--r600:#F09595;--r800:#FCEBEB;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg3);min-height:100vh;padding:2rem 1rem;}
.app{width:100%;max-width:680px;margin:0 auto;}
a.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);text-decoration:none;margin-bottom:1.25rem;}
a.back:hover{color:var(--text);}
.hero{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.5rem;margin-bottom:1.5rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.hero-chars{font-family:'Noto Serif JP',serif;font-size:28px;color:var(--p900);letter-spacing:6px;margin-bottom:8px;}
.hero-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px;}
.hero-sub{font-size:13px;color:var(--text2);margin-bottom:1rem;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hstat{background:var(--bg2);border-radius:var(--rm);padding:10px 8px;text-align:center;}
.hstat-val{font-size:20px;font-weight:600;color:var(--p800);}
.hstat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.start-btn{margin-top:1.25rem;width:100%;padding:14px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.start-btn:hover{background:var(--p800);}
/* TEST */
.twrap{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.thead{background:var(--a50);border-bottom:0.5px solid var(--a600);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.ttitle{font-size:14px;font-weight:500;color:var(--a900);}
.tscore{font-size:13px;color:var(--a800);}
.pstrip{height:5px;background:var(--bg2);}
.pstrip-fill{height:100%;background:linear-gradient(90deg,var(--p600),var(--t400));transition:width 0.4s;}
.tbody{padding:1.5rem;}
.tqlabel{display:inline-block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;padding:3px 10px;border-radius:20px;margin-bottom:12px;}
.tlc{background:var(--p50);color:var(--p800);}
.tlm{background:var(--t50);color:var(--t800);}
.tlr{background:var(--a50);color:var(--a800);}
.tq{font-size:15px;color:var(--text);line-height:1.6;}
.tchar{font-family:'Noto Serif JP',serif;font-size:72px;font-weight:700;color:var(--p900);text-align:center;margin:0.75rem 0 1rem;display:block;}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1.25rem;}
.topt{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--rm);padding:13px 16px;font-size:14px;cursor:pointer;color:var(--text);text-align:left;font-family:inherit;transition:background 0.15s;line-height:1.4;}
.topt:hover:not(:disabled){background:var(--p50);border-color:var(--p200);}
.topt.correct{background:var(--t50);border-color:var(--t400);color:var(--t800);font-weight:500;}
.topt.wrong{background:var(--r50);border-color:var(--r600);color:var(--r800);}
.tfb{margin-top:1rem;padding:10px 14px;border-radius:var(--rm);font-size:13px;line-height:1.5;display:none;}
.tfb.show{display:block;}
.tfb.ok{background:var(--t50);color:var(--t800);border-left:2px solid var(--t400);}
.tfb.bad{background:var(--r50);color:var(--r800);border-left:2px solid var(--r600);}
.tnext{margin-top:1.25rem;width:100%;padding:12px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:none;}
.tnext:hover{background:var(--p800);}
.tnext.show{display:block;}
/* RESULT */
.rwrap{padding:2rem 1.5rem;}
.r-top{text-align:center;margin-bottom:1.5rem;}
.remoji{font-size:52px;margin-bottom:0.75rem;}
.rscore{font-size:42px;font-weight:600;color:var(--p800);margin-bottom:0.25rem;}
.rlabel{font-size:16px;color:var(--text2);margin-bottom:1.5rem;}
.rbdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem;}
.rbc{background:var(--bg2);border-radius:var(--rm);padding:12px 8px;text-align:center;}
.rbv{font-size:24px;font-weight:600;}
.rbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.rg{color:var(--t600);}.rr{color:var(--r600);}.rgr{color:var(--text3);}
.tsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.5rem;}
.tsc{background:var(--bg2);border-radius:var(--rm);padding:10px 12px;}
.tsl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.tsv{font-size:15px;font-weight:500;color:var(--text);}
.slabel{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--text3);}
.btn-row{display:flex;gap:8px;margin-bottom:1.5rem;}
.rbtn{flex:1;padding:12px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
.rbtn:hover{background:var(--p800);}
.rbtn.sec{background:var(--bg2);color:var(--text);border:0.5px solid var(--border2);}
.wrong-list{margin-top:1.25rem;border-top:0.5px solid var(--border);padding-top:1.25rem;}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.wchar{font-family:'Noto Serif JP',serif;font-size:28px;font-weight:700;min-width:40px;color:var(--text);}
.winfo{flex:1;}
.wmean{font-size:13px;color:var(--text);font-weight:500;}
.wqtype{font-size:11px;color:var(--text2);margin-top:1px;}
.wanswers{font-size:12px;margin-top:3px;}
.wgiven{color:var(--r600);}
.wcorrect{color:var(--t600);}
</style>
</head>

  {n:660,ch:"賀",mn:"Tebrik, kutlama",on:["GA"],kun:[],or:"Bronz ve mühür formlar. 'Kabuk para, değerli şey' ve fonetik unsur 'üstüne eklemek' içerir; 'üstüne para eklemek' → kutlama hediyesi → 'tebrik' anlamına genişledi.",mm:"🎊 ÜZERİNE PARA EKLEYEREK KUTLAMAK",cp:[{k:"賀状",r:"GAJŌ",m:"Tebrik kartı"},{k:"年賀",r:"NENGA",m:"Yılbaşı tebriği"},{k:"祝賀",r:"SHUKUGA",m:"Kutlama"}],ex:[{s:"___的な出来事だった。",tr:"Tarihsel bir olaydı.",b:"画",br:"KA"}]},
  {n:661,ch:"快",mn:"Hoş, neşeli",on:["KAI"],kun:["kokoroyoi"],or:"Geç dönem karakter (Shuowen). 'Kalp, zihin' ve bir fonetik unsur içerir; kalbin açılması, ferahlama hissi. 'Hoş, neşeli' anlamına gelir.",mm:"😊 KALBİN AÇILMASI — NEŞE VE HEŞ HİS",cp:[{k:"快適",r:"KAITEKI",m:"Konforlu"},{k:"快晴",r:"KAISEI",m:"Açık hava"},{k:"爽快",r:"SŌKAI",m:"Ferahlatıcı"}],ex:[{s:"___晴れな気分だ。",tr:"Neşeli bir ruh halindeyim.",b:"快",br:"KAI"}]},
  {n:662,ch:"解",mn:"Çözmek, açıklamak",on:["KAI", "GE"],kun:["toku"],or:"OBI ve mühür formlar. OBI'de 'öküz/inek' ve iki elin üçüncü unsuru çevrelediği bir şekil görülür; bir öküzü parçalamak. 'Çözmek, açıklamak' anlamına geldi.",mm:"🔪 ÖKÜZİ PAR ÇALARA ÇÖZMEK VE AÇIKLAMAK",cp:[{k:"解決",r:"KAIKETSU",m:"Çözüm"},{k:"解説",r:"KAISETSU",m:"Açıklama"},{k:"理解",r:"RIKAI",m:"Anlayış"}],ex:[{s:"試験に___格した。",tr:"Sınavı geçtim.",b:"格",br:"KAKU"}]},
  {n:663,ch:"格",mn:"Standart, statü",on:["KAKU", "KŌ"],kun:[],or:"Bronz ve mühür formlar. 'Ağaç' ve fonetik unsur ('aşağı gelmek'; şimdi 'her biri') içerir; ağacın dallarının uzandığı yer. 'Standart, statü' anlamına ulaştı.",mm:"🌳 AĞACIN DALLARI STANDARTTIR",cp:[{k:"格差",r:"KAKUSA",m:"Eşitsizlik"},{k:"格好",r:"KAKKŌ",m:"Görünüm"},{k:"価格",r:"KAKAKU",m:"Fiyat"}],ex:[{s:"___案を提出した。",tr:"Taslak sundum.",b:"案",br:"AN"}]},
  {n:664,ch:"確",mn:"Kesin, doğrulamak",on:["KAKU"],kun:[],or:"Geç dönem karakter. 'Taş' ve fonetik unsur ('yüksek uçmak') içerir; taşın sertliğinden 'katı, kesin' anlamına ulaşır. Sonra 'doğrulamak' anlamına genişledi.",mm:"🪨 YÜKSEK UÇAN KUŞUN SERT TAŞI — KESİN",cp:[{k:"確認",r:"KAKUNIN",m:"Doğrulama"},{k:"確実",r:"KAKUJITSU",m:"Kesin"},{k:"明確",r:"MEIKAKU",m:"Net"}],ex:[{s:"___の作品を見た。",tr:"Onun eserini gördüm.",b:"彼",br:"kare"}]},
  {n:665,ch:"額",mn:"Miktar, alın, çerçeve",on:["GAKU"],kun:["hitai"],or:"Geç dönem karakter (Shuowen). 'Baş' ve fonetik unsur ('ziyaretçi' ya da 'her biri') içerir; başın üst kısmı, alın. Buradan 'miktar, çerçeve' anlamına genişledi.",mm:"👤 BAŞIN ÜST KISMI — ALINDA YAZILI MİKTAR",cp:[{k:"金額",r:"KINGAKU",m:"Para miktarı"},{k:"額面",r:"GAKUMEN",m:"Yüz değeri"},{k:"総額",r:"SŌGAKU",m:"Toplam miktar"}],ex:[{s:"友達に___助を求めた。",tr:"Arkadaşımdan yardım istedim.",b:"援",br:"EN"}]},
  {n:666,ch:"刊",mn:"Yayımlamak",on:["KAN"],kun:[],or:"Geç dönem karakter (Shuowen). 'Bıçak/kesmek' ve fonetik unsur ('kazmak, oymak' çağrışımlı) içerir; 'kazıyarak çıkarmak, yazmak' → 'yayımlamak' anlamına gelir.",mm:"🔪 BIÇAKLA KAZIYARAK YAYIMLAMAK",cp:[{k:"刊行",r:"KANKŌ",m:"Yayınlama"},{k:"週刊",r:"SHŪKAN",m:"Haftalık"},{k:"月刊",r:"GEKKAN",m:"Aylık"}],ex:[{s:"___年の経験がある。",tr:"Yıllarca deneyimim var.",b:"経",br:"KEI"}]},
  {n:667,ch:"幹",mn:"Gövde, ana",on:["KAN"],kun:["miki"],or:"Geç dönem karakter (Shuowen). Yorumlar farklılık gösterir; orijinal form Shuowen'de 'yerde sağlamca duran ahşap direkler' anlamındaydı. 'Gövde, ana unsur' anlamına geldi.",mm:"🌲 YERDE SAĞLaMCA DURAN GÖVDE",cp:[{k:"幹部",r:"KANBU",m:"Yönetici"},{k:"幹線",r:"KANSEN",m:"Ana hat"},{k:"根幹",r:"KONKAN",m:"Temel"}],ex:[{s:"水___が壊れた。",tr:"Su borusu bozuldu.",b:"管",br:"KAN"}]},
  {n:668,ch:"慣",mn:"Alışmak",on:["KAN"],kun:["nareru"],or:"İki mühür formu mevcuttur (遦 ve 摜). Her ikisi de Shuowen'de 'alışkın olmak, gelenek' anlamında tanımlanır. 'Alışmak, örf' anlamına ulaşır.",mm:"🔄 TEKRARLAYaraK ALIŞTIK — GELENEK",cp:[{k:"慣習",r:"KANSHŪ",m:"Gelenek"},{k:"慣れる",r:"NARERU",m:"Alışmak"},{k:"習慣",r:"SHŪKAN",m:"Alışkanlık"}],ex:[{s:"結___式に出た。",tr:"Düğün törenine katıldım.",b:"婚",br:"KON"}]},
  {n:669,ch:"眼",mn:"Göz",on:["GAN"],kun:["manako"],or:"Geç dönem karakter (Shuowen). 'Göz' ve fonetik unsur ('yuvarlaklık' çağrışımlı) içerir; 'göz küresi'. Daha geniş anlamda 'göz, bakış' olarak kullanıldı.",mm:"👁️ YUVARLAK GÖZ KÜRESİ",cp:[{k:"眼科",r:"GANKA",m:"Göz kliniği"},{k:"眼鏡",r:"MEGANE",m:"Gözlük"},{k:"肉眼",r:"NIKUSAN",m:"Çıplak göz"}],ex:[{s:"___倉に入れた。",tr:"Depoya koydum.",b:"冷",br:"REI"}]},
  {n:670,ch:"基",mn:"Temel, taban",on:["KI"],kun:["moto", "motozuku"],or:"Bronz ve mühür formlar. 'Toprak/zemin' ve fonetik unsur (aslen 'bir sehpa üzerindeki sepet'; 'platform' çağrışımlı) içerir; 'zemin üzerinde platform' → 'temel' anlamı.",mm:"🏗️ TOPRAK ÜZERİNDEKİ PLATFORM — TEMEL",cp:[{k:"基本",r:"KIHON",m:"Temel"},{k:"基準",r:"KIJUN",m:"Standart"},{k:"基礎",r:"KISO",m:"Altyapı"}],ex:[{s:"新しい___画を始めた。",tr:"Yeni bir plan başlattım.",b:"計",br:"KEI"}]},
  {n:671,ch:"寄",mn:"Yaklaşmak, bağış",on:["KI"],kun:["yoru", "seru"],or:"Geç dönem karakter (Shuowen). 'Çatı/konut' ve fonetik unsur (aslen 'tek ayakla duran kişi'; 'tuhaf') içerir; başkasının evine sığınmak. 'Yaklaşmak, bağış' anlamına geldi.",mm:"🏠 BAŞKASININ EVİNE SIKANMAK — YAKLAŞMAK",cp:[{k:"寄付",r:"KIFU",m:"Bağış"},{k:"寄り道",r:"YORIMICHI",m:"Yoldan sapma"},{k:"寄せる",r:"YOSERU",m:"Yaklaştırmak"}],ex:[{s:"___察に届けた。",tr:"Polise bildirdim.",b:"警",br:"KEI"}]},
  {n:672,ch:"規",mn:"Kural, düzenleme",on:["KI"],kun:[],or:"Geç dönem karakter (Shuowen). 'Koca, adam' (burada farklı bir kelime olarak kullanılmış) ve 'görmek' unsurları içerir; düzgünlüğü ölçmek. 'Kural, düzenleme' anlamına geldi.",mm:"📐 DÜZGÜNLÜĞÜ ÖLÇMEK — KURAL",cp:[{k:"規則",r:"KISOKU",m:"Kural"},{k:"規模",r:"KIBO",m:"Boyut"},{k:"規制",r:"KISEI",m:"Düzenleme"}],ex:[{s:"___験を積んだ。",tr:"Deneyim kazandım.",b:"経",br:"KEI"}]},
  {n:673,ch:"技",mn:"Beceri, teknik",on:["GI"],kun:["waza"],or:"Geç dönem karakter (Shuowen). 'El' ve fonetik unsur (aslen 'bambu tutan el'; 'ayırmak, desteklemek') içerir; elin ustalığı. 'Beceri, teknik' anlamına ulaştı.",mm:"✋ ELİN USTALARI BECERİSİ",cp:[{k:"技術",r:"GIJUTSU",m:"Teknoloji"},{k:"技能",r:"GINŌ",m:"Beceri"},{k:"演技",r:"ENGI",m:"Performans"}],ex:[{s:"___済が回復した。",tr:"Ekonomi toparlandı.",b:"経",br:"KEI"}]},
  {n:674,ch:"義",mn:"Adalet, yükümlülük",on:["GI"],kun:[],or:"OBI ve mühür formlar. 'Koyun' (kısmen kısaltılmış) ve 'halberd/mızrak' unsurlarını içerir; güzel bir silahla doğru hareket. 'Adalet, yükümlülük' anlamına geldi.",mm:"⚔️ GÜZEL SİLAHLA DOĞRU HAREKET — ADALET",cp:[{k:"義務",r:"GIMU",m:"Yükümlülük"},{k:"意義",r:"IGI",m:"Anlam"},{k:"正義",r:"SEIGI",m:"Adalet"}],ex:[{s:"___告を受けた。",tr:"Uyarı aldım.",b:"警",br:"KEI"}]},
  {n:675,ch:"逆",mn:"Ters, karşıt",on:["GYAKU"],kun:["sakarau"],or:"OBI ve mühür formlar. 'Yürümek/gitmek' ve aslen 'baş aşağı kişi' gösteren unsur içerir; ters yönde gitmek. 'Ters, karşıt' anlamına ulaştı.",mm:"🙃 BAŞ AŞAĞI KİŞİ TERS GİDİYOR",cp:[{k:"逆転",r:"GYAKUTEN",m:"Tersine çevirme"},{k:"逆効果",r:"GYAKU KŌKA",m:"Ters etki"},{k:"反逆",r:"HANGYAKU",m:"Başkaldırı"}],ex:[{s:"___素を吸った。",tr:"Oksijen soludum.",b:"酸",br:"SAN"}]},
  {n:676,ch:"久",mn:"Uzun süre",on:["KYŪ", "KU"],kun:["hisashii"],or:"Mühür formu. 'Kişi' ve 'geri tutmak' anlamındaki bir çizgiden oluşur; 'durmak, yerinde kalmak' → 'geç kalmak' → 'uzun süre' anlamına evrildi.",mm:"⏳ GERİ TUTULAN KİŞİ UZUN SÜRE BEKLER",cp:[{k:"久しい",r:"HISASHII",m:"Uzun süre"},{k:"久々",r:"HISABISA",m:"Uzun zaman sonra"},{k:"永久",r:"EIKYŪ",m:"Kalıcı"}],ex:[{s:"___結に問題がある。",tr:"Sonuçta sorun var.",b:"結",br:"KETSU"}]},
  {n:677,ch:"旧",mn:"Eski",on:["KYŪ"],kun:[],or:"OBI ve mühür formlar. Genel olarak tepeli ya da boynuzlu bir baykuş türü olarak yorumlanan bir unsur içerir. 'Bir gün yaşlı' anlamından 'eski' anlamına geldi.",mm:"🦉 ESKİ BAYKUŞ — GEÇMIŞE AİT",cp:[{k:"旧式",r:"KYŪSHIKI",m:"Eski tarz"},{k:"旧友",r:"KYŪYŪ",m:"Eski dost"},{k:"新旧",r:"SHINKYŪ",m:"Yeni ve eski"}],ex:[{s:"___典を引いた。",tr:"Sözlüğe baktım.",b:"辞",br:"JI"}]},
  {n:678,ch:"居",mn:"Oturmak, ikamet",on:["KYO"],kun:["iru", "oru"],or:"Bronz ve mühür formlar. 'Yana yatmış ceset ya da kişi' ve fonetik unsur ('eski'; 'çömelme' çağrışımlı) içerir; 'çömelip oturmak'. 'Oturmak, ikamet' anlamına geldi.",mm:"🪑 ESKİ KİŞİ ÇÖMELMIŞ — OTURMAK",cp:[{k:"居住",r:"KYOJŪ",m:"İkamet"},{k:"居間",r:"IMA",m:"Oturma odası"},{k:"住居",r:"JŪKYO",m:"Konut"}],ex:[{s:"___力を出した。",tr:"Güç gösterdim.",b:"権",br:"KEN"}]},
  {n:679,ch:"許",mn:"İzin vermek, affetmek",on:["KYO"],kun:["yurusu", "moto"],or:"Mühür formu. 'Konuşmak, söylemek' ve fonetik unsur içerir; söze izin vermek. 'İzin vermek, affetmek' anlamına ulaştı.",mm:"🗣️ SÖZLE VERİLEN İZİN",cp:[{k:"許可",r:"KYOKA",m:"İzin"},{k:"許す",r:"YURUSU",m:"Affetmek"},{k:"許容",r:"KYOYŌ",m:"Tolerans"}],ex:[{s:"___法を守る。",tr:"Anayasayı koruyorum.",b:"憲",br:"KEN"}]},
  {n:680,ch:"境",mn:"Sınır, ortam",on:["KYŌ", "KEI"],kun:["sakai"],or:"Geç dönem karakter (Shuowen). 'Toprak/zemin' ve fonetik unsur ('müzik parçasının bitmesi'; 'son, sınır' anlamındaki) içerir; 'arazinin sınırı'. 'Sınır, ortam' anlamına geldi.",mm:"🚧 TOPRAĞIN BİTTİĞİ YER — SINIR",cp:[{k:"境界",r:"KYŌKAI",m:"Sınır"},{k:"環境",r:"KANKYŌ",m:"Çevre"},{k:"境地",r:"KYŌCHI",m:"Durum"}],ex:[{s:"___究結果を報告した。",tr:"Araştırma sonucunu bildirdim.",b:"研",br:"KEN"}]},
  {n:681,ch:"均",mn:"Eşit, denge",on:["KIN"],kun:["hitoshii"],or:"Bronz ve mühür formlar. 'Kıvrılmış sürüngen ya da solucan' ve ek unsur içerir. Kilin eşit yoğrulmasından 'eşit, denge' anlamına ulaştı.",mm:"⚖️ EŞİT YOĞRULan KİL — DENGE",cp:[{k:"均等",r:"KINTŌ",m:"Eşit"},{k:"均衡",r:"KINKŌ",m:"Denge"},{k:"平均",r:"HEIKIN",m:"Ortalama"}],ex:[{s:"___察が来た。",tr:"Polis geldi.",b:"警",br:"KEI"}]},
  {n:682,ch:"禁",mn:"Yasak",on:["KIN"],kun:[],or:"Geç dönem karakter (Shuowen). 'Sunak/tanrı' ve 'orman' unsurlarını içerir. Kutsal ormana girişin yasak olmasından 'yasaklamak' anlamına geldi.",mm:"🌲 KUTSAL ORMAnA GİRİŞ YASAK",cp:[{k:"禁止",r:"KINSHI",m:"Yasak"},{k:"禁煙",r:"KINEN",m:"Sigara yasağı"},{k:"禁断",r:"KINDAN",m:"Yasaklı"}],ex:[{s:"___境を守る。",tr:"Çevreyi koruyorum.",b:"環",br:"KAN"}]},
  {n:683,ch:"句",mn:"Cümle, bölüm",on:["KU"],kun:[],or:"OBI, bronz ve mühür formlar. 'Ağız/kelimeler' ve dolanık şeyleri gösteren bir unsur içerir; sözlerin birbirine dolanması. 'Cümle, bölüm' anlamına ulaştı.",mm:"💬 SÖZLER DOLANIKCA OLUŞAN CÜMLE",cp:[{k:"句読点",r:"KUTŌTEN",m:"Noktalama"},{k:"文句",r:"MONKU",m:"Şikâyet"},{k:"俳句",r:"HAIKU",m:"Haiku"}],ex:[{s:"___固たる意志がある。",tr:"Kararlı bir irade var.",b:"堅",br:"KEN"}]},
  {n:684,ch:"群",mn:"Kalabalık, sürü",on:["GUN"],kun:["mure", "reru"],or:"Bronz ve mühür formlar. 'Koyun' ve fonetik unsur ('lord'; 'çok sayıda, birikme' çağrışımlı) içerir; koyunların bir araya gelmesi. 'Kalabalık, sürü' anlamına geldi.",mm:"🐑 KOYUNLAR BİR ARADA — SÜRÜ",cp:[{k:"群衆",r:"GUNSHŪ",m:"Kalabalık"},{k:"群れ",r:"MURE",m:"Sürü"},{k:"群島",r:"GUNTŌ",m:"Takımada"}],ex:[{s:"___語を学んでいる。",tr:"Dil öğreniyorum.",b:"語",br:"GO"}]},
  {n:685,ch:"経",mn:"Deneyim, ekonomi, geçmek",on:["KEI", "KYŌ"],kun:["heru", "tatsu"],or:"Bronz ve mühür formlar. 'İplik' ve aslen 'tezgahtaki dikey iplikler'i gösteren bir unsur içerir; 'dik iplikler' → 'dikey, doğrudan' → 'deneyim, geçmek' anlamına evrildi.",mm:"🧵 TEZGAHTAKİ DİK İPLİKLER — HAYAT DENEYİMİ",cp:[{k:"経験",r:"KEIKEN",m:"Deneyim"},{k:"経済",r:"KEIZAI",m:"Ekonomi"},{k:"経営",r:"KEIEI",m:"Yönetim"}],ex:[{s:"___準を満たした。",tr:"Standardı karşıladım.",b:"基",br:"KI"}]},
  {n:686,ch:"潔",mn:"Temiz, saf",on:["KETSU"],kun:["isagiyoi"],or:"Geç dönem karakter (Shuowen). 'Su' ile 'banyo ile arınmak' çağrışımlı fonetik unsur içerir. Suyla temizlenmekten 'temiz, saf' anlamına ulaştı.",mm:"💧 SUYLA ARINMAK — TERTEMİZ",cp:[{k:"清潔",r:"SEIKETSU",m:"Temiz"},{k:"潔白",r:"KEPPAKU",m:"Masumiyet"},{k:"不潔",r:"FUKETSU",m:"Kirli"}],ex:[{s:"___念を大切にする。",tr:"İnancı değerli tutuyorum.",b:"信",br:"SHIN"}]},
  {n:687,ch:"件",mn:"Konu, madde",on:["KEN"],kun:["kudan"],or:"Çok geç dönem karakter (Yupian). 'Öküz/inek' unsuru 'öncü inek'in kısaltması olarak yorumlanır ve 'konu, mesele'yi nitelendirmeye yarar. 'Konu, madde' anlamına geldi.",mm:"🐄 ÖNCü İNEĞİN KATEGORİZE ETTİĞİ KONU",cp:[{k:"事件",r:"JIKEN",m:"Olay, dava"},{k:"件数",r:"KENSŪ",m:"Vaka sayısı"},{k:"条件",r:"JŌKEN",m:"Koşul"}],ex:[{s:"___機に乗った。",tr:"Uçağa bindim.",b:"航",br:"KŌ"}]},

function build(){
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const sh=a=>[...a].sort(()=>Math.random()-0.5);
  const dMn=(ex,n)=>sh(K.filter(k=>k.ch!==ex.ch)).slice(0,n).map(k=>k.mn);
  const dCh=(ex,n)=>sh(K.filter(k=>k.ch!==ex.ch)).slice(0,n).map(k=>k.ch);
  const dCpM=(ex,n)=>{const p=[];K.filter(k=>k.ch!==ex.ch).forEach(k=>k.cp.forEach(c=>p.push(c.m)));return sh(p).slice(0,n);};
  const dRd=(ex,n)=>{const p=[];K.filter(k=>k.ch!==ex.ch).forEach(k=>[...k.on,...k.kun].forEach(r=>{if(r)p.push(r);}));return sh(p).slice(0,n);};
  const qs=[];
  // KA: 80 soru
  sh([...K]).slice(0,80).forEach(k=>{
    const ans=k.mn;
    const d=sh(dMn(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'ka',lb:'Kanji → Anlam',lc:'tlm',ch:k.ch,
      q:'Bu kanji ne anlama gelir?',ans,opts:sh([ans,...d]),sc:true});
  });
  // CM: 80 soru
  const cmPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    const ans=cp.m;
    const d=sh(dCpM(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length>=5)cmPool.push({k,cp,ans,d});
  }));
  sh(cmPool).slice(0,80).forEach(({k,cp,ans,d})=>{
    qs.push({tp:'cm',lb:'Bileşik → Anlam',lc:'tlc',ch:k.ch,
      q:'"'+cp.k+'" ('+cp.r+') kelimesinin anlamı nedir?',
      ans,opts:sh([ans,...d]),sc:false});
  });
  // BF: 35 soru
  const bfPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    if(!cp.k.includes(k.ch))return;
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length>=5)bfPool.push({k,cp,d});
  }));
  sh(bfPool).slice(0,35).forEach(({k,cp,d})=>{
    const blank=cp.k.replace(k.ch,'___');
    qs.push({tp:'bf',lb:'Boşluk Doldurma',lc:'tlr',ch:k.ch,
      q:'"'+blank+'" ('+cp.m+') — boşluğa hangi kanji gelir?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
  });
  // EX: 35 soru
  const exPool=K.filter(k=>k.ex&&k.ex.length>0);
  let exC=0;
  sh(exPool).forEach(k=>{
    if(exC>=35)return;
    const ex=k.ex[0];
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length<5)return;
    const q=ex.s.replace(new RegExp(ex.b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'___');
    qs.push({tp:'ex',lb:'Cümle → Kanji',lc:'tlr',ch:k.ch,
      q:'"'+q+'" — boşluk hangi kanji?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
    exC++;
  });
  // CK: 35 soru
  const ckPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    const ans=k.mn;
    const d=sh(dMn(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length>=5)ckPool.push({k,cp,ans,d});
  }));
  sh(ckPool).slice(0,35).forEach(({k,cp,ans,d})=>{
    qs.push({tp:'ck',lb:'Bileşikteki Anlam',lc:'tlm',ch:k.ch,
      q:'"'+cp.k+'" kelimesindeki "'+k.ch+'" kanjisi ne anlama gelir?',
      ans,opts:sh([ans,...d]),sc:false});
  });
  // KR: 18 soru
  const krPool=K.filter(k=>(k.on.length+k.kun.length)>0);
  let krC=0;
  sh(krPool).forEach(k=>{
    if(krC>=18)return;
    const rds=[...k.on,...k.kun].filter(Boolean);
    if(!rds.length)return;
    const ans=rnd(rds);
    const d=sh(dRd(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'kr',lb:'Kanji → Okunuş',lc:'tlr',ch:k.ch,
      q:'Bu kanjinin okunuşlarından biri nedir?',
      ans,opts:sh([ans,...d]),sc:true});
    krC++;
  });
  // RK: 17 soru
  const rkPool=K.filter(k=>k.on.length>0);
  let rkC=0;
  sh(rkPool).forEach(k=>{
    if(rkC>=17)return;
    const rd=rnd(k.on);
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'rk',lb:'Okunuş → Kanji',lc:'tlm',ch:k.ch,
      q:'"'+rd+'" okunuşuna sahip kanji hangisidir?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
    rkC++;
  });
  return sh(qs);
}

let tqs=[],ti=0,sc=0,ans={};
function startExam(){
  tqs=build(); ti=0; sc=0; ans={};
  document.getElementById('heroWrap').style.display='none';
  document.getElementById('rv').style.display='none';
  document.getElementById('tv').style.display='block';
  renderQ();
}
function renderQ(){
  const q=tqs[ti],tot=tqs.length,pct=Math.round(ti/tot*100);
  const typeCols={tlm:'var(--p600)',tlc:'var(--t400)',tlr:'var(--a600)'};
  const tc=typeCols[q.lc]||'var(--p600)';
  document.getElementById('tv').innerHTML=`
    <div class="tw">
      <div class="tprog">
        <div class="tpbar"><div class="tpfill" style="width:${pct}%"></div></div>
        <div class="tpnum">${ti+1} / ${tot}</div>
      </div>
      <div class="tcard">
        <div class="tlabel" style="color:${tc}">${q.lb}</div>
        ${q.sc?`<div class="tkanji">${q.ch}</div>`:''}
        <div class="tq">${q.q}</div>
        <div class="topts">
          ${q.opts.map((o,i)=>`<button class="topt" onclick="doAns(${i})">${o}</button>`).join('')}
        </div>
        <div class="tfb" id="fb" style="display:none"></div>
        <button class="tnext" id="nq" onclick="nextQ()" style="display:none">
          ${ti===tot-1?'Sonuçları Gör →':'Sonraki →'}
        </button>
      </div>
    </div>`;
}
function doAns(i){
  const q=tqs[ti];
  const sel=q.opts[i];
  const ok=sel===q.ans;
  if(ok)sc++;
  ans[ti]={q:q.q,ch:q.ch,ans:q.ans,sel,ok,tp:q.tp,lb:q.lb};
  document.querySelectorAll('.topt').forEach((b,j)=>{
    b.disabled=true;
    if(j===i)b.classList.add(ok?'ok':'ng');
    if(q.opts[j]===q.ans&&!ok)b.classList.add('show');
  });
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='tfb '+(ok?'ok':'ng');
  fb.textContent=ok?'✅ Doğru!':'❌ Yanlış — Doğru: '+q.ans;
  document.getElementById('nq').style.display='block';
}
function nextQ(){
  ti++;
  if(ti>=tqs.length){showR();return;}
  renderQ();
}
function showR(){
  const tot=tqs.length;
  const pct=Math.round(sc/tot*100);
  const emoji=pct>=90?'🏆':pct>=70?'🎯':pct>=50?'📚':'💪';
  const lbl=pct>=90?'Mükemmel':pct>=70?'İyi':pct>=50?'Gelişiyor':'Devam Et';
  const typeMap={};
  tqs.forEach((q,i)=>{
    if(!typeMap[q.tp])typeMap[q.tp]={lb:q.lb,ok:0,tot:0};
    typeMap[q.tp].tot++;
    if(ans[i]&&ans[i].ok)typeMap[q.tp].ok++;
  });
  const tsum=Object.values(typeMap).map(t=>
    `<div class="tsrow"><span class="tslb">${t.lb}</span><span class="tspct">${t.ok}/${t.tot}</span></div>`
  ).join('');
  document.getElementById('tv').style.display='none';
  const rv=document.getElementById('rv');
  rv.style.display='block';
  rv.innerHTML=`
    <div class="rcard">
      <div class="remoji">${emoji}</div>
      <div class="rscore">${sc} / ${tot}</div>
      <div class="rlabel">${lbl} · %${pct}</div>
      <div class="rstats">
        <div class="rsbox"><div class="rsbv rg">${sc}</div><div class="rsbl">Doğru</div></div>
        <div class="rsbox"><div class="rsbv rr">${tot-sc}</div><div class="rsbl">Yanlış</div></div>
        <div class="rsbox"><div class="rsbv">${tot}</div><div class="rsbl">Toplam</div></div>
      </div>
      <div class="slabel">Tip Bazında Sonuç</div>
      <div class="tsum">${tsum}</div>
      <button class="rbtn" onclick="location.reload()">Tekrar Başla</button>
      <a class="rbtn" href="index.html" style="display:inline-block;margin-top:8px">Ana Sayfa</a>
    </div>`;
}
</script>
</body>
</html>
