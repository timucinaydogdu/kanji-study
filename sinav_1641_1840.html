<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Büyük Sınav — Kanji #1641–1840</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#e8e8e7;--text:#1a1a1a;--text2:#6b6b6b;--text3:#9a9a9a;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--p50:#EEEDFE;--p200:#AFA9EC;--p600:#534AB7;--p800:#3C3489;--p900:#26215C;--t50:#E1F5EE;--t400:#1D9E75;--t600:#0F6E56;--t800:#085041;--a50:#FAEEDA;--a600:#BA7517;--a800:#633806;--a900:#412402;--r50:#FCEBEB;--r600:#A32D2D;--r800:#501313;--rm:8px;--rl:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#242422;--bg3:#2e2e2c;--text:#f0f0ee;--text2:#b0b0ae;--text3:#707070;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);--p50:#26215C;--p200:#3C3489;--p600:#AFA9EC;--p800:#CECBF6;--p900:#EEEDFE;--t50:#04342C;--t600:#9FE1CB;--t800:#9FE1CB;--a50:#412402;--a800:#FAC775;--a900:#FAC775;--r50:#501313;--r600:#F09595;--r800:#FCEBEB;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg3);min-height:100vh;padding:2rem 1rem;}
.app{width:100%;max-width:680px;margin:0 auto;}
a.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);text-decoration:none;margin-bottom:1.25rem;}
a.back:hover{color:var(--text);}
.hero{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:1.5rem;margin-bottom:1.5rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.hero-chars{font-family:'Noto Serif JP',serif;font-size:28px;color:var(--p900);letter-spacing:6px;margin-bottom:8px;}
.hero-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px;}
.hero-sub{font-size:13px;color:var(--text2);margin-bottom:1rem;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hstat{background:var(--bg2);border-radius:var(--rm);padding:10px 8px;text-align:center;}
.hstat-val{font-size:20px;font-weight:600;color:var(--p800);}
.hstat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.start-btn{margin-top:1.25rem;width:100%;padding:14px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.start-btn:hover{background:var(--p800);}
/* TEST */
.twrap{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.thead{background:var(--a50);border-bottom:0.5px solid var(--a600);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.ttitle{font-size:14px;font-weight:500;color:var(--a900);}
.tscore{font-size:13px;color:var(--a800);}
.pstrip{height:5px;background:var(--bg2);}
.pstrip-fill{height:100%;background:linear-gradient(90deg,var(--p600),var(--t400));transition:width 0.4s;}
.tbody{padding:1.5rem;}
.tqlabel{display:inline-block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;padding:3px 10px;border-radius:20px;margin-bottom:12px;}
.tlc{background:var(--p50);color:var(--p800);}
.tlm{background:var(--t50);color:var(--t800);}
.tlr{background:var(--a50);color:var(--a800);}
.tq{font-size:15px;color:var(--text);line-height:1.6;}
.tchar{font-family:'Noto Serif JP',serif;font-size:72px;font-weight:700;color:var(--p900);text-align:center;margin:0.75rem 0 1rem;display:block;}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1.25rem;}
.topt{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--rm);padding:13px 16px;font-size:14px;cursor:pointer;color:var(--text);text-align:left;font-family:inherit;transition:background 0.15s;line-height:1.4;}
.topt:hover:not(:disabled){background:var(--p50);border-color:var(--p200);}
.topt.correct{background:var(--t50);border-color:var(--t400);color:var(--t800);font-weight:500;}
.topt.wrong{background:var(--r50);border-color:var(--r600);color:var(--r800);}
.tfb{margin-top:1rem;padding:10px 14px;border-radius:var(--rm);font-size:13px;line-height:1.5;display:none;}
.tfb.show{display:block;}
.tfb.ok{background:var(--t50);color:var(--t800);border-left:2px solid var(--t400);}
.tfb.bad{background:var(--r50);color:var(--r800);border-left:2px solid var(--r600);}
.tnext{margin-top:1.25rem;width:100%;padding:12px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:none;}
.tnext:hover{background:var(--p800);}
.tnext.show{display:block;}
/* RESULT */
.rwrap{padding:2rem 1.5rem;}
.r-top{text-align:center;margin-bottom:1.5rem;}
.remoji{font-size:52px;margin-bottom:0.75rem;}
.rscore{font-size:42px;font-weight:600;color:var(--p800);margin-bottom:0.25rem;}
.rlabel{font-size:16px;color:var(--text2);margin-bottom:1.5rem;}
.rbdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem;}
.rbc{background:var(--bg2);border-radius:var(--rm);padding:12px 8px;text-align:center;}
.rbv{font-size:24px;font-weight:600;}
.rbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.rg{color:var(--t600);}.rr{color:var(--r600);}.rgr{color:var(--text3);}
.tsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.5rem;}
.tsc{background:var(--bg2);border-radius:var(--rm);padding:10px 12px;}
.tsl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.tsv{font-size:15px;font-weight:500;color:var(--text);}
.slabel{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--text3);}
.btn-row{display:flex;gap:8px;margin-bottom:1.5rem;}
.rbtn{flex:1;padding:12px;background:var(--p600);color:#fff;border:none;border-radius:var(--rm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
.rbtn:hover{background:var(--p800);}
.rbtn.sec{background:var(--bg2);color:var(--text);border:0.5px solid var(--border2);}
.wrong-list{margin-top:1.25rem;border-top:0.5px solid var(--border);padding-top:1.25rem;}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.wchar{font-family:'Noto Serif JP',serif;font-size:28px;font-weight:700;min-width:40px;color:var(--text);}
.winfo{flex:1;}
.wmean{font-size:13px;color:var(--text);font-weight:500;}
.wqtype{font-size:11px;color:var(--text2);margin-top:1px;}
.wanswers{font-size:12px;margin-top:3px;}
.wgiven{color:var(--r600);}
.wcorrect{color:var(--t600);}
</style>
</head>

  {n:1838,ch:"敗",mn:"Yenilmek, başarısız",on:["HAI"],kun:["やぶれる", "やぶる"],or:"'Kabuk para' ve fonetik unsur ('vurmak') içerir; para ve değerlerin yok edilmesi. 'Yenilmek, başarısız' anlamına geldi.",mm:"💸 PARA VE DEĞERLERİN YOK EDİLMESİ",cp:[{k:"敗北",r:"HAIBOKU",m:"Yenilgi"},{k:"失敗",r:"SHIPPAI",m:"Başarısızlık"},{k:"敗退",r:"HAITAI",m:"Çekilme"}],ex:[{s:"___審員に選ばれた。",tr:"Jüri üyesi seçildim.",b:"陪",br:"BAI"}]},
  {n:1839,ch:"培",mn:"Yetiştirmek, geliştirmek",on:["BAI"],kun:["つちかう"],or:"'Toprak' ve fonetik unsur içerir; toprağı biriktirerek yetiştirmek. 'Yetiştirmek, geliştirmek' anlamına geldi.",mm:"🌱 TOPRAĞIA BİRİKTİRErek YETİŞTİRMEK",cp:[{k:"培養",r:"BAIYŌ",m:"Yetiştirme"},{k:"栽培",r:"SAIBAI",m:"Tarım"},{k:"培う",r:"TSUCHINAU",m:"Geliştirmek"}],ex:[{s:"この漢字を使う。",tr:"Bu kanji kullanılır.",b:"培",br:"KA"}]},
  {n:1840,ch:"陪",mn:"Eşlik etmek",on:["BAI"],kun:[],or:"'Tepe/höyük' ve fonetik unsur içerir; yanında eşlik etmek. 'Eşlik etmek' anlamına geldi.",mm:"⛰️ YANINDA EŞLİK ETMEK",cp:[{k:"陪審",r:"BAISHIN",m:"Jüri"},{k:"陪審員",r:"BAISHIN'IN",m:"Jüri üyesi"},{k:"陪席",r:"BAISEKI",m:"Eşlik etme"}],ex:[{s:"この漢字を使う。",tr:"Bu kanji kullanılır.",b:"陪",br:"BAI"}]}
];

function build(){
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const sh=a=>[...a].sort(()=>Math.random()-0.5);
  const dMn=(ex,n)=>sh(K.filter(k=>k.ch!==ex.ch)).slice(0,n).map(k=>k.mn);
  const dCh=(ex,n)=>sh(K.filter(k=>k.ch!==ex.ch)).slice(0,n).map(k=>k.ch);
  const dCpM=(ex,n)=>{const p=[];K.filter(k=>k.ch!==ex.ch).forEach(k=>k.cp.forEach(c=>p.push(c.m)));return sh(p).slice(0,n);};
  const dRd=(ex,n)=>{const p=[];K.filter(k=>k.ch!==ex.ch).forEach(k=>[...k.on,...k.kun].forEach(r=>{if(r)p.push(r);}));return sh(p).slice(0,n);};
  const qs=[];
  // KA: 80 soru
  sh([...K]).slice(0,80).forEach(k=>{
    const ans=k.mn;
    const d=sh(dMn(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'ka',lb:'Kanji → Anlam',lc:'tlm',ch:k.ch,
      q:'Bu kanji ne anlama gelir?',ans,opts:sh([ans,...d]),sc:true});
  });
  // CM: 80 soru
  const cmPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    const ans=cp.m;
    const d=sh(dCpM(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length>=5)cmPool.push({k,cp,ans,d});
  }));
  sh(cmPool).slice(0,80).forEach(({k,cp,ans,d})=>{
    qs.push({tp:'cm',lb:'Bileşik → Anlam',lc:'tlc',ch:k.ch,
      q:'"'+cp.k+'" ('+cp.r+') kelimesinin anlamı nedir?',
      ans,opts:sh([ans,...d]),sc:false});
  });
  // BF: 35 soru
  const bfPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    if(!cp.k.includes(k.ch))return;
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length>=5)bfPool.push({k,cp,d});
  }));
  sh(bfPool).slice(0,35).forEach(({k,cp,d})=>{
    const blank=cp.k.replace(k.ch,'___');
    qs.push({tp:'bf',lb:'Boşluk Doldurma',lc:'tlr',ch:k.ch,
      q:'"'+blank+'" ('+cp.m+') — boşluğa hangi kanji gelir?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
  });
  // EX: 35 soru
  const exPool=K.filter(k=>k.ex&&k.ex.length>0);
  let exC=0;
  sh(exPool).forEach(k=>{
    if(exC>=35)return;
    const ex=k.ex[0];
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length<5)return;
    const q=ex.s.replace(new RegExp(ex.b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'___');
    qs.push({tp:'ex',lb:'Cümle → Kanji',lc:'tlr',ch:k.ch,
      q:'"'+q+'" — boşluk hangi kanji?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
    exC++;
  });
  // CK: 35 soru
  const ckPool=[];
  K.forEach(k=>k.cp.forEach(cp=>{
    const ans=k.mn;
    const d=sh(dMn(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length>=5)ckPool.push({k,cp,ans,d});
  }));
  sh(ckPool).slice(0,35).forEach(({k,cp,ans,d})=>{
    qs.push({tp:'ck',lb:'Bileşikteki Anlam',lc:'tlm',ch:k.ch,
      q:'"'+cp.k+'" kelimesindeki "'+k.ch+'" kanjisi ne anlama gelir?',
      ans,opts:sh([ans,...d]),sc:false});
  });
  // KR: 18 soru
  const krPool=K.filter(k=>(k.on.length+k.kun.length)>0);
  let krC=0;
  sh(krPool).forEach(k=>{
    if(krC>=18)return;
    const rds=[...k.on,...k.kun].filter(Boolean);
    if(!rds.length)return;
    const ans=rnd(rds);
    const d=sh(dRd(k,10)).filter(x=>x!==ans).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'kr',lb:'Kanji → Okunuş',lc:'tlr',ch:k.ch,
      q:'Bu kanjinin okunuşlarından biri nedir?',
      ans,opts:sh([ans,...d]),sc:true});
    krC++;
  });
  // RK: 17 soru
  const rkPool=K.filter(k=>k.on.length>0);
  let rkC=0;
  sh(rkPool).forEach(k=>{
    if(rkC>=17)return;
    const rd=rnd(k.on);
    const d=sh(dCh(k,10)).slice(0,5);
    if(d.length<5)return;
    qs.push({tp:'rk',lb:'Okunuş → Kanji',lc:'tlm',ch:k.ch,
      q:'"'+rd+'" okunuşuna sahip kanji hangisidir?',
      ans:k.ch,opts:sh([k.ch,...d]),sc:false});
    rkC++;
  });
  return sh(qs);
}

let tqs=[],ti=0,sc=0,ans={};
function startExam(){
  tqs=build(); ti=0; sc=0; ans={};
  document.getElementById('heroWrap').style.display='none';
  document.getElementById('rv').style.display='none';
  document.getElementById('tv').style.display='block';
  renderQ();
}
function renderQ(){
  const q=tqs[ti],tot=tqs.length,pct=Math.round(ti/tot*100);
  const typeCols={tlm:'var(--p600)',tlc:'var(--t400)',tlr:'var(--a600)'};
  const tc=typeCols[q.lc]||'var(--p600)';
  document.getElementById('tv').innerHTML=`
    <div class="tw">
      <div class="tprog">
        <div class="tpbar"><div class="tpfill" style="width:${pct}%"></div></div>
        <div class="tpnum">${ti+1} / ${tot}</div>
      </div>
      <div class="tcard">
        <div class="tlabel" style="color:${tc}">${q.lb}</div>
        ${q.sc?`<div class="tkanji">${q.ch}</div>`:''}
        <div class="tq">${q.q}</div>
        <div class="topts">
          ${q.opts.map((o,i)=>`<button class="topt" onclick="doAns(${i})">${o}</button>`).join('')}
        </div>
        <div class="tfb" id="fb" style="display:none"></div>
        <button class="tnext" id="nq" onclick="nextQ()" style="display:none">
          ${ti===tot-1?'Sonuçları Gör →':'Sonraki →'}
        </button>
      </div>
    </div>`;
}
function doAns(i){
  const q=tqs[ti];
  const sel=q.opts[i];
  const ok=sel===q.ans;
  if(ok)sc++;
  ans[ti]={q:q.q,ch:q.ch,ans:q.ans,sel,ok,tp:q.tp,lb:q.lb};
  document.querySelectorAll('.topt').forEach((b,j)=>{
    b.disabled=true;
    if(j===i)b.classList.add(ok?'ok':'ng');
    if(q.opts[j]===q.ans&&!ok)b.classList.add('show');
  });
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='tfb '+(ok?'ok':'ng');
  fb.textContent=ok?'✅ Doğru!':'❌ Yanlış — Doğru: '+q.ans;
  document.getElementById('nq').style.display='block';
}
function nextQ(){
  ti++;
  if(ti>=tqs.length){showR();return;}
  renderQ();
}
function showR(){
  const tot=tqs.length;
  const pct=Math.round(sc/tot*100);
  const emoji=pct>=90?'🏆':pct>=70?'🎯':pct>=50?'📚':'💪';
  const lbl=pct>=90?'Mükemmel':pct>=70?'İyi':pct>=50?'Gelişiyor':'Devam Et';
  const typeMap={};
  tqs.forEach((q,i)=>{
    if(!typeMap[q.tp])typeMap[q.tp]={lb:q.lb,ok:0,tot:0};
    typeMap[q.tp].tot++;
    if(ans[i]&&ans[i].ok)typeMap[q.tp].ok++;
  });
  const tsum=Object.values(typeMap).map(t=>
    `<div class="tsrow"><span class="tslb">${t.lb}</span><span class="tspct">${t.ok}/${t.tot}</span></div>`
  ).join('');
  document.getElementById('tv').style.display='none';
  const rv=document.getElementById('rv');
  rv.style.display='block';
  rv.innerHTML=`
    <div class="rcard">
      <div class="remoji">${emoji}</div>
      <div class="rscore">${sc} / ${tot}</div>
      <div class="rlabel">${lbl} · %${pct}</div>
      <div class="rstats">
        <div class="rsbox"><div class="rsbv rg">${sc}</div><div class="rsbl">Doğru</div></div>
        <div class="rsbox"><div class="rsbv rr">${tot-sc}</div><div class="rsbl">Yanlış</div></div>
        <div class="rsbox"><div class="rsbv">${tot}</div><div class="rsbl">Toplam</div></div>
      </div>
      <div class="slabel">Tip Bazında Sonuç</div>
      <div class="tsum">${tsum}</div>
      <button class="rbtn" onclick="location.reload()">Tekrar Başla</button>
      <a class="rbtn" href="index.html" style="display:inline-block;margin-top:8px">Ana Sayfa</a>
    </div>`;
}
</script>
